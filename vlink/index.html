<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sedang Perombakan</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #161823; /* Warna teks utama TikTok */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            width: 100%;
            text-align: center;
            padding: 40px 30px;
            border: 1px solid #ebebeb; /* Border halus */
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .logo-placeholder {
            font-weight: 900;
            font-size: 32px;
            margin-bottom: 24px;
            letter-spacing: -1px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        p {
            font-size: 15px;
            color: #616161;
            line-height: 1.5;
            margin-bottom: 32px;
        }

        .btn-join {
            display: inline-block;
            background-color: #fe2c55; /* Warna aksen merah TikTok */
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            padding: 12px 40px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
            width: 100%;
        }

        /* Hover effect agar lebih interaktif */
        .btn-join:hover {
            background-color: #ef2950;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 13px;
            color: #8a8a8e;
        }

        /* Mode Gelap (opsional, otomatis jika user pakai dark mode) */
        @media (prefers-color-scheme: dark) {
            body { background-color: #121212; color: #ffffff; }
            .container { border-color: #333; background-color: #121212; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); }
            p { color: #a1a1a1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-placeholder">UPDATE.</div>
        
        <h1>Web sedang perombakan dan update besar-besaran</h1>
        
        <p>Mohon maaf membuat Anda menunggu. Dapatkan informasi selengkapnya melalui grup resmi kami di bawah ini.</p>
        
        <a href="https://chat.whatsapp.com/EPbo9CECMExK9VKE6yHGjE?mode=wwc" class="btn-join">
            Join Grup
        </a>

        <div class="footer-note">
            Klik tombol di atas untuk info lebih lanjut.
        </div>
    </div>

</body>
</html>
