<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLink - Link Sharing Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #000000;
            --text-secondary: #666666;
            --accent-color: #2481cc;
            --border-color: #e0e0e0;
            --card-bg: #ffffff;
            --input-bg: #f5f5f5;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-secondary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --accent-color: #2481cc;
            --border-color: #333333;
            --card-bg: #1a1a1a;
            --input-bg: #2a2a2a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            font-size: 13px;
            line-height: 1.4;
        }

        .app-container {
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
        }

        /* Header */
        .header {
            background: var(--accent-color);
            color: white;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 101;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
            font-weight: 700;
        }

        .logo-icon {
            width: 28px;
            height: 28px;
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-color);
            font-weight: 900;
            font-size: 14px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 16px;
        }
            padding-bottom: 80px;
            overflow-y: auto;
        }

        /* Search Bar */
        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 16px;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border 0.3s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        /* User Card */
        .user-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .user-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }

        .user-details h3 {
            font-size: 14px;
            margin-bottom: 2px;
        }

        .badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 8px;
            font-size: 9px;
            font-weight: 700;
            margin-left: 4px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-publisher {
            background: #ffc107;
            color: #000;
        }

        .badge-developer {
            background: #dc3545;
            color: white;
        }

        .follow-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: 2px solid var(--accent-color);
            background: transparent;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }

        .follow-btn.following {
            background: var(--accent-color);
            color: white;
        }

        /* Link Card */
        .link-card {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            transition: border 0.3s;
        }

        .link-card:hover {
            border-color: var(--accent-color);
        }

        .link-title {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .link-url {
            color: var(--accent-color);
            text-decoration: none;
            word-break: break-all;
            font-size: 12px;
        }

        .link-url:hover {
            text-decoration: underline;
        }

        .link-meta {
            margin-top: 8px;
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Top Navigation */
        .bottom-nav {
            position: sticky;
            top: 48px;
            left: 0;
            right: 0;
            width: 100%;
            background: var(--card-bg);
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: color 0.3s;
            background: none;
            border: none;
            padding: 6px 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 20px;
            height: 20px;
        }

        .nav-label {
            font-size: 10px;
            font-weight: 500;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            animation: fadeIn 0.2s;
        }

        .modal.active {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 12px;
            width: 90%;
            max-width: 380px;
            max-height: 80vh;
            overflow-y: auto;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(20px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            background: var(--accent-color);
            color: white;
            padding: 12px 16px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .modal-body {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 12px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            font-size: 13px;
            background: var(--input-bg);
            color: var(--text-primary);
            transition: border 0.3s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 11px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
            margin-top: 8px;
        }

        .btn-danger:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 2px solid var(--border-color);
        }

        .btn-secondary:hover {
            background: var(--bg-secondary);
        }

        .language-list {
            display: flex;
            flex-direction: column;
        }

        .language-item {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s;
        }

        .language-item:last-child {
            border-bottom: none;
        }

        .language-item:hover {
            background: var(--input-bg);
        }

        .check-icon {
            width: 20px;
            height: 20px;
            display: none;
        }

        .check-icon.active {
            display: block;
        }

        .check-icon.active::after {
            content: '✓';
            color: var(--accent-color);
            font-weight: bold;
            font-size: 20px;
        }

        .stat-item {
            text-align: center;
            cursor: pointer;
            padding: 10px;
            border-radius: 6px;
            transition: background 0.3s;
        }

        .stat-item:hover {
            background: var(--input-bg);
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 3px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .developer-credit {
            text-align: center;
            padding: 16px;
            margin-top: 16px;
            border-top: 1px solid var(--border-color);
            font-size: 11px;
            color: var(--text-secondary);
        }

        .developer-credit strong {
            color: var(--text-primary);
            display: block;
            margin-bottom: 3px;
        }

        .profile-pic-container {
            position: relative;
            display: inline-block;
        }

        .profile-pic-edit {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 28px;
            height: 28px;
            background: var(--accent-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 2px solid var(--bg-primary);
        }

        .profile-pic-edit svg {
            width: 14px;
            height: 14px;
            stroke: white;
        }

        .user-avatar {
            background: var(--accent-color);
            color: white;
            background-size: cover;
            background-position: center;
        }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: 2px solid var(--border-color);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .like-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .like-btn.liked {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }

        .like-btn svg {
            width: 16px;
            height: 16px;
        }

        .link-actions {
            display: flex;
            gap: 6px;
            margin-top: 10px;
            align-items: center;
        }

        .comment-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            border: 2px solid var(--border-color);
            background: transparent;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .comment-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        .comment-btn svg {
            width: 16px;
            height: 16px;
        }

        .comments-section {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }

        .comment-input-area {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .comment-input {
            flex: 1;
            padding: 8px 12px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 13px;
            resize: none;
            min-height: 36px;
            max-height: 100px;
        }

        .comment-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .comment-send-btn {
            padding: 8px 12px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s;
        }

        .comment-send-btn:hover {
            opacity: 0.9;
        }

        .comment-send-btn svg {
            width: 18px;
            height: 18px;
        }

        .comment-item {
            padding: 10px;
            background: var(--input-bg);
            border-radius: 6px;
            margin-bottom: 8px;
        }

        .comment-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .comment-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--accent-color);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .comment-author {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .comment-author-name {
            font-weight: 600;
            font-size: 13px;
        }

        .author-badge {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--accent-color);
        }

        .comment-text {
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .comment-footer {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
        }

        .comment-time {
            font-size: 10px;
        }

        .comment-action {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
            transition: color 0.3s;
        }

        .comment-action:hover {
            color: var(--accent-color);
        }

        .comment-action.liked {
            color: var(--accent-color);
        }

        .comment-delete {
            color: #dc3545;
        }

        .comment-delete:hover {
            opacity: 0.8;
        }

        .reply-section {
            margin-left: 36px;
            margin-top: 8px;
        }

        .reply-input-area {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }

        .reply-input {
            flex: 1;
            padding: 6px 10px;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-size: 12px;
        }

        .reply-input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .reply-send-btn {
            padding: 6px 10px;
            background: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }

        .reply-item {
            padding: 8px;
            background: var(--bg-primary);
            border-radius: 6px;
            margin-bottom: 6px;
            border: 1px solid var(--border-color);
        }

        .setting-item {
            padding: 12px 0;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-weight: 500;
        }

        .theme-switch {
            display: flex;
            gap: 8px;
        }

        .theme-option {
            padding: 8px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            background: var(--input-bg);
        }

        .theme-option.active {
            border-color: var(--accent-color);
            background: var(--accent-color);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
        }

        .empty-state svg {
            margin-bottom: 12px;
            width: 56px;
            height: 56px;
        }

        .empty-state p {
            margin-top: 10px;
            font-size: 13px;
        }

        .publisher-list {
            max-height: 280px;
            overflow-y: auto;
        }

        .publisher-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .delete-icon-btn {
            background: #dc3545;
            color: white;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Login Page */
        .login-page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: var(--bg-primary);
        }

        .login-card {
            background: var(--card-bg);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            overflow: hidden;
            border: 2px solid var(--border-color);
        }

        .login-header {
            background: var(--accent-color);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .login-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: 900;
            color: var(--accent-color);
        }

        .login-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-subtitle {
            font-size: 14px;
            opacity: 0.9;
        }

        .login-body {
            padding: 30px;
        }

        .back-btn {
            background: var(--input-bg);
            color: var(--text-primary);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">V</div>
                <div class="login-title">VLink</div>
                <div class="login-subtitle" data-i18n="login_subtitle">Link Sharing Platform</div>
            </div>
            <div class="login-body">
                <form id="loginForm">
                    <div class="form-group">
                        <label data-i18n="username">Username</label>
                        <input type="text" id="loginUsername" required>
                    </div>
                    <div class="form-group">
                        <label data-i18n="password">Password</label>
                        <input type="password" id="loginPassword" required>
                    </div>
                    <button type="submit" class="btn btn-primary" data-i18n="login">Login</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="app-container" style="display: none;">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">V</div>
                <span>VLink</span>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="applyPublisherBtn" title="Apply as Publisher">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button class="icon-btn" id="settingsBtn" title="Settings">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M12 1v6m0 6v6m8.66-11.66-4.24 4.24M7.58 16.42l-4.24 4.24M23 12h-6M7 12H1m20.66 8.66-4.24-4.24M7.58 7.58 3.34 3.34"></path>
                    </svg>
                </button>
            </div>
        </div>
        
        <!-- Top Navigation -->
        <div class="bottom-nav">
            <button class="nav-item" data-page="search">
                <div class="nav-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

        let currentLanguage = localStorage.getItem('language') || 'id';

        // Initialize
        function init() {
            loadTheme();
            loadLanguage();
            
            const savedUser = localStorage.getItem('currentUser');
            if (savedUser) {
                currentUser = savedUser;
                loadData();
                showMainApp();
            } else {
                showLoginPage();
            }
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            
            currentUser = username;
            localStorage.setItem('currentUser', username);
            
            const userData = { 
                username, 
                isDeveloper: username === DEVELOPER_USERNAME 
            };
            
            if (!isFirebaseConfigured) {
                users[username] = userData;
                localStorage.setItem('users', JSON.stringify(users));
            } else {
                // Save user to Firebase
                set(ref(database, 'users/' + username), userData);
            }
            
            loadData();
            showMainApp();
        });

        function showLoginPage() {
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('mainApp').style.display = 'none';
        }

        function showMainApp() {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('mainApp').style.display = 'flex';
            
            setupNavigation();
            navigateTo('search');
        }

        function loadData() {
            if (!isFirebaseConfigured) {
                users = JSON.parse(localStorage.getItem('users') || '{}');
                links = JSON.parse(localStorage.getItem('links') || '{}');
                publishers = JSON.parse(localStorage.getItem('publishers') || '[]');
                following = JSON.parse(localStorage.getItem('following_' + currentUser) || '[]');
                followers[currentUser] = following;
                profilePics = JSON.parse(localStorage.getItem('profilePics') || '{}');
                linkLikes = JSON.parse(localStorage.getItem('linkLikes') || '{}');
                linkComments = JSON.parse(localStorage.getItem('linkComments') || '{}');
                
                // Ensure current user is in users list
                if (!users[currentUser]) {
                    users[currentUser] = { 
                        username: currentUser, 
                        isDeveloper: currentUser === DEVELOPER_USERNAME 
                    };
                    localStorage.setItem('users', JSON.stringify(users));
                }
                return;
            }

            // Load from Firebase
            const usersRef = ref(database, 'users');
            onValue(usersRef, (snapshot) => {
                users = snapshot.val() || {};
                // Ensure current user exists
                if (!users[currentUser]) {
                    const userData = { 
                        username: currentUser, 
                        isDeveloper: currentUser === DEVELOPER_USERNAME 
                    };
                    users[currentUser] = userData;
                    set(ref(database, 'users/' + currentUser), userData);
                }
            });

            const linksRef = ref(database, 'links');
            onValue(linksRef, (snapshot) => {
                links = snapshot.val() || {};
            });

            const publishersRef = ref(database, 'publishers');
            onValue(publishersRef, (snapshot) => {
                publishers = snapshot.val() || [];
                setupNavigation();
            });

            const followingRef = ref(database, 'following/' + currentUser);
            onValue(followingRef, (snapshot) => {
                following = snapshot.val() || [];
                followers[currentUser] = following;
            });

            const allFollowingRef = ref(database, 'following');
            onValue(allFollowingRef, (snapshot) => {
                followers = snapshot.val() || {};
            });

            const profilePicsRef = ref(database, 'profilePics');
            onValue(profilePicsRef, (snapshot) => {
                profilePics = snapshot.val() || {};
            });

            const linkLikesRef = ref(database, 'linkLikes');
            onValue(linkLikesRef, (snapshot) => {
                linkLikes = snapshot.val() || {};
            });

            const linkCommentsRef = ref(database, 'linkComments');
            onValue(linkCommentsRef, (snapshot) => {
                linkComments = snapshot.val() || {};
            });
        }

        // Navigation
        function setupNavigation() {
            const isDeveloper = currentUser === DEVELOPER_USERNAME;
            const isPublisher = publishers.includes(currentUser);

            // Update navigation visibility
            const myLinksNav = document.querySelector('[data-page="my-links"]');
            const devPanelNav = document.querySelector('[data-page="dev-panel"]');
            
            if (isDeveloper) {
                myLinksNav.style.display = 'flex';
                devPanelNav.style.display = 'flex';
            } else if (isPublisher) {
                myLinksNav.style.display = 'flex';
                devPanelNav.style.display = 'none';
            } else {
                myLinksNav.style.display = 'none';
                devPanelNav.style.display = 'none';
            }

            document.querySelectorAll('.nav-item').forEach(item => {
                item.addEventListener('click', function() {
                    const page = this.dataset.page;
                    navigateTo(page);
                });
            });

            document.getElementById('settingsBtn').addEventListener('click', () => {
                openModal('settingsModal');
            });

            document.getElementById('applyPublisherBtn').addEventListener('click', () => {
                document.getElementById('applyUsername').value = currentUser;
                openModal('applyPublisherModal');
            });
        }

        function navigateTo(page) {
            currentPage = page;
            
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            document.querySelector(`[data-page="${page}"]`)?.classList.add('active');

            const content = document.getElementById('mainContent');
            
            switch(page) {
                case 'search':
                    renderSearchPage(content);
                    break;
                case 'following':
                    renderFollowingPage(content);
                    break;
                case 'my-links':
                    renderMyLinksPage(content);
                    break;
                case 'dev-panel':
                    renderDevPanel(content);
                    break;
                case 'profile':
                    renderProfilePage(content);
                    break;
            }
        }

        // Render Pages
        function renderSearchPage(content) {
            const t = translations[currentLanguage];
            content.innerHTML = `
                <div class="search-container">
                    <input type="text" class="search-input" id="userSearch" placeholder="${t.search_users}">
                </div>
                <div id="searchResults"></div>
            `;

            document.getElementById('userSearch').addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                const results = document.getElementById('searchResults');
                
                if (!query) {
                    results.innerHTML = '';
                    return;
                }

                const filteredUsers = Object.values(users).filter(user => 
                    user.username.toLowerCase().includes(query)
                );

                if (filteredUsers.length === 0) {
                    results.innerHTML = `
                        <div class="empty-state">
                            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.3;">
                                <circle cx="11" cy="11" r="8"></circle>
                                <path d="m21 21-4.35-4.35"></path>
                            </svg>
                            <p>${t.no_users}</p>
                        </div>
                    `;
                    return;
                }

                results.innerHTML = filteredUsers.map(user => {
                    const isDev = user.username === DEVELOPER_USERNAME;
                    const isPub = publishers.includes(user.username);
                    const isFollowing = following.includes(user.username);
                    
                    return `
                        <div class="user-card" onclick="viewUserProfile('${user.username}')">
                            <div class="user-info">
                                <div class="user-avatar">${user.username[0].toUpperCase()}</div>
                                <div class="user-details">
                                    <h3>
                                        ${user.username}
                                        ${isDev ? '<span class="badge badge-developer">Developer</span>' : ''}
                                        ${!isDev && isPub ? '<span class="badge badge-publisher">Publisher</span>' : ''}
                                    </h3>
                                </div>
                            </div>
                            ${user.username !== currentUser ? `
                                <button class="follow-btn ${isFollowing ? 'following' : ''}" 
                                    onclick="event.stopPropagation(); toggleFollow('${user.username}')">
                                    ${isFollowing ? 'Following' : 'Follow'}
                                </button>
                            ` : ''}
                        </div>
                    `;
                }).join('');
            });
        }

        function renderFollowingPage(content) {
            const t = translations[currentLanguage];
            if (following.length === 0) {
                content.innerHTML = `
                    <div class="empty-state">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.3;">

                    </div>

            content.innerHTML = following.map(username => {

                return `

                                <h3>
                                    ${username}

                                    ${!isDev && isPub ? '<span class="badge badge-publisher">Publisher</span>' : ''}
                                </h3>
                            </div>
                        </div>
                        <button class="follow-btn following" 
                            onclick="event.stopPropagation(); toggleFollow('${username}')">
                            Following
                        </button>
                    </div>
                `;
            }).join('');
        }

        function renderMyLinksPage(content) {
            const t = translations[currentLanguage];
            const userLinks = Object.entries(links).filter(([id, link]) => link.author === currentUser);
            
            content.innerHTML = `
                <h2 style="margin-bottom: 20px;">${t.my_links_title}</h2>

        function renderComment(comment, linkId, linkAuthor) {
            const t = translations[currentLanguage];
            const user = users[comment.author] || { username: comment.author };
            const isDev = comment.author === DEVELOPER_USERNAME;
            const isPub = publishers.includes(comment.author);
            const profilePic = profilePics[comment.author];
            const linkAuthorPic = profilePics[linkAuthor];
            
            const commentLikes = comment.likes || [];
            const isLiked = commentLikes.includes(currentUser);
            const likeCount = commentLikes.length;
            const isLikedByAuthor = commentLikes.includes(linkAuthor);
            
            const timeAgo = getTimeAgo(comment.timestamp);
            const canDelete = currentUser === comment.author || currentUser === linkAuthor;
            
            return `
                <div class="comment-item" id="comment-${comment.id}">
                    <div class="comment-header">
                        <div class="comment-avatar" style="${profilePic ? `background-image: url(${profilePic}); font-size: 0;` : ''}">${!profilePic ? comment.author[0].toUpperCase() : ''}</div>

                            ${!isDev && isPub ? '<span class="badge badge-publisher">PUBLISHER</span>' : ''}
                            ${isLikedByAuthor && linkAuthor !== comment.author ? `<div class="author-badge" style="background-image: url(${linkAuthorPic || ''});">${!linkAuthorPic ? linkAuthor[0].toUpperCase() : ''}</div>` : ''}

                        <span class="comment-action ${isLiked ? 'liked' : ''}" onclick="toggleCommentLike('${linkId}', '${comment.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            ${likeCount > 0 ? likeCount : ''}
                        </span>
                        <span class="comment-action" onclick="showReplyInput('${linkId}', '${comment.id}')">${t.reply}</span>
                        ${canDelete ? `<span class="comment-action comment-delete" onclick="deleteComment('${linkId}', '${comment.id}')">${t.delete}</span>` : ''}
                    </div>
                    <div class="reply-section" id="reply-section-${comment.id}" style="display: none;">
                        <div class="reply-input-area">
                            <input type="text" class="reply-input" id="reply-input-${comment.id}" placeholder="${t.reply}...">
                            <button class="reply-send-btn" onclick="addReply('${linkId}', '${comment.id}')">${t.send}</button>
                        </div>
                    </div>
                    <div class="reply-section">
                        ${(comment.replies || []).map(reply => renderReply(reply, linkId, comment.id, linkAuthor)).join('')}
                    </div>
                </div>
            `;
        }

        function renderReply(reply, linkId, commentId, linkAuthor) {
            const t = translations[currentLanguage];
            const user = users[reply.author] || { username: reply.author };
            const isDev = reply.author === DEVELOPER_USERNAME;
            const isPub = publishers.includes(reply.author);
            const profilePic = profilePics[reply.author];
            const linkAuthorPic = profilePics[linkAuthor];
            
            const replyLikes = reply.likes || [];
            const isLiked = replyLikes.includes(currentUser);
            const likeCount = replyLikes.length;
            const isLikedByAuthor = replyLikes.includes(linkAuthor);
            
            const timeAgo = getTimeAgo(reply.timestamp);
            const canDelete = currentUser === reply.author || currentUser === linkAuthor;
            
            return `
                <div class="reply-item" id="reply-${reply.id}">
                    <div class="comment-header">
                        <div class="comment-avatar" style="width: 28px; height: 28px; font-size: 12px; ${profilePic ? `background-image: url(${profilePic}); font-size: 0;` : ''}">${!profilePic ? reply.author[0].toUpperCase() : ''}</div>
                        <div class="comment-author">
                            <span class="comment-author-name" style="font-size: 13px;">${reply.author}</span>
                            ${isDev ? '<span class="badge badge-developer">DEVELOPER</span>' : ''}
                            ${!isDev && isPub ? '<span class="badge badge-publisher">PUBLISHER</span>' : ''}
                            ${isLikedByAuthor && linkAuthor !== reply.author ? `<div class="author-badge" style="width: 18px; height: 18px; background-image: url(${linkAuthorPic || ''});">${!linkAuthorPic ? linkAuthor[0].toUpperCase() : ''}</div>` : ''}
                        </div>
                    </div>
                    <div class="comment-text" style="font-size: 13px;">${reply.text}</div>
                    <div class="comment-footer">
                        <span class="comment-time">${timeAgo}</span>
                        <span class="comment-action ${isLiked ? 'liked' : ''}" onclick="toggleReplyLike('${linkId}', '${commentId}', '${reply.id}')">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="${isLiked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2">
                                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                            </svg>
                            ${likeCount > 0 ? likeCount : ''}
                        </span>
                        ${canDelete ? `<span class="comment-action comment-delete" onclick="deleteReply('${linkId}', '${commentId}', '${reply.id}')">${t.delete}</span>` : ''}
                    </div>
                </div>
            `;
        }

        function getTimeAgo(timestamp) {
            const now = Date.now();
            const diff = now - timestamp;
            const seconds = Math.floor(diff / 1000);
            const minutes = Math.floor(seconds / 60);
            const hours = Math.floor(minutes / 60);
            const days = Math.floor(hours / 24);
            
            if (days > 0) return days + 'd';
            if (hours > 0) return hours + 'h';
            if (minutes > 0) return minutes + 'm';
            return 'now';
        }

        }

        // Modal Functions
        window.openModal = function(modalId) {
            if (modalId === 'profilePicModal') {
                const preview = document.getElementById('previewAvatar');
                const profilePic = profilePics[currentUser];
                if (profilePic) {
                    preview.style.backgroundImage = `url(${profilePic})`;
                    preview.style.fontSize = '0';
                    preview.textContent = '';
                } else {
                    preview.style.backgroundImage = '';
                    preview.style.fontSize = '48px';
                    preview.textContent = currentUser[0].toUpperCase();
                }
            }
            document.getElementById(modalId).classList.add('active');
        };

        window.closeModal = function(modalId) {
            document.getElementById(modalId).classList.remove('active');
        };

        // Close modal on outside click
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('active');
                }
            });
        });

        // Initialize
        init();
    </script>
</body>
</html>
