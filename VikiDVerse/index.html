<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VikiDVerse</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, Helvetica, sans-serif;
}

:root {
  --bg: #0b1220;
  --card: #121b2e;
  --border: #1e2a44;
  --blue: #2f7bff;
  --text: #e6ebf5;
  --muted: #9aa4b2;
}

body {
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* PAGE */
.page {
  position: absolute;
  width: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  animation: fade .25s ease;
}

.page.active {
  display: flex;
}

@keyframes fade {
  from { opacity: 0 }
  to { opacity: 1 }
}

/* CARD */
.card {
  width: 90%;
  max-width: 380px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  text-align: center;
}

/* TEXT */
h1 {
  color: var(--blue);
  margin-bottom: 12px;
  font-size: 26px;
}

p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
  margin-bottom: 24px;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 13px;
  margin-bottom: 14px;
  border-radius: 10px;
  border: 1.5px solid var(--border);
  background: #0f1730;
  color: var(--text);
  font-weight: bold;
  cursor: pointer;
  transition: transform .1s ease, border-color .2s, color .2s;
}

.btn:active {
  transform: scale(0.96);
}

.btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}

.btn.primary {
  background: var(--blue);
  border-color: var(--blue);
  color: #fff;
}

.btn.primary:hover {
  opacity: .9;
}

/* BACK */
.back-btn {
  margin-top: 6px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--border);
  background: #0f1730;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  transition: transform .1s ease, color .2s, border-color .2s;
}

.back-btn:hover {
  color: var(--blue);
  border-color: var(--blue);
}

.back-btn:active {
  transform: scale(0.95);
}
</style>
</head>
<body>

<!-- HOME -->
<div class="page active" id="home">
  <div class="card">
    <h1>VikiDVerse</h1>
    <p>
      Developer web tools minimalis.  
      Fokus pada utilitas online, AI, dan platform sosial.
    </p>

    <button class="btn primary"
      onclick="window.open('https://wa.me/6283159447683','_blank')">
      Hubungi Developer
    </button>

    <button class="btn" onclick="goPage('project')">
      Project
    </button>
  </div>
</div>

<!-- PROJECT -->
<div class="page" id="project">
  <div class="card">
    <h1>Project</h1>

    <button class="btn"
      onclick="window.open('https://pikyz.biz.id/vtikd','_blank')">
      TikTok Downloader
    </button>

    <button class="btn"
      onclick="window.open('https://pikyz.biz.id/vai','_blank')">
      Web AI
    </button>

    <button class="btn"
      onclick="window.open('https://pikyz.biz.id/vlink','_blank')">
      Web Sosial
    </button>

    <div class="back-btn" onclick="goPage('home')">
      Kembali
    </div>
  </div>
</div>

<script>
function goPage(id) {
  // kasih delay biar animasi klik kelihatan
  setTimeout(() => {
    document.querySelectorAll('.page').forEach(p => {
      p.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
  }, 120);
}
</script>

</body>
</html>
