async function joinRoom(raw) {
  const u = state.user;
  if (!u) { toast("Masuk untuk bergabung ke room.", "error"); return; }
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!ROOM_RE.test(code)) { toast("Kode room terdiri dari 6 karakter huruf dan angka.", "error"); return; }
  showLoader(true);
  try {
    const r = (await db.ref("rooms/" + code).once("value")).val();
    if (!r) throw new Error("Room tidak ditemukan atau sudah ditutup.");
    if (r.members && r.members[u.uid]) { location.hash = "#/room/" + code; return; }
    if (r.status === "playing") throw new Error("Pertandingan di room ini sedang berlangsung.");
    const free = SLOT_KEYS.filter(k => !(r.slots && r.slots[k]));
    if (!free.length) throw new Error("Room sudah penuh (maksimal " + MAX_PLAYERS + " pemain).");
    let joined = false;
    for (const k of free) {
      const up = {};
      up["rooms/" + code + "/members/" + u.uid] = { name: myName(), slot: k };
      up["rooms/" + code + "/slots/" + k] = u.uid;
      try { await db.ref().update(up); joined = true; break; }
      catch (e) { if (!/permission_denied/i.test((e.code || "") + (e.message || ""))) throw e; }
    }
    if (!joined) throw new Error("Tidak bisa bergabung. Room mungkin sudah penuh.");
    location.hash = "#/room/" + code;
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

async function leaveRoom() {
  const r = state.room, code = state.roomId, u = state.user;
  if (!r || !u || !r.members || !r.members[u.uid]) return;
  const host = r.hostId === u.uid;
  const ok = await confirmBox({ title: host ? "Tutup room?" : "Keluar dari room?", text: host ? "Room akan ditutup dan semua pemain dikeluarkan." : "Anda akan keluar dari room ini.", ok: host ? "Tutup room" : "Keluar", danger: true });
  if (!ok) return;
  state.leaving = true;
  showLoader(true);
  try {
    meshStop(false);
    const up = {};
    if (host) {
      up["rooms/" + code] = null; up["roomInputs/" + code] = null; up["roomSignals/" + code] = null;
    } else {
      up["rooms/" + code + "/members/" + u.uid] = null;
      up["rooms/" + code + "/slots/" + r.members[u.uid].slot] = null;
    }
    await db.ref().update(up);
    cancelDisconnect(code);
    location.hash = "#/";
  } catch (e) { state.leaving = false; toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

function setupDisconnect(r) {
  const code = state.roomId, uid = state.user.uid;
  const mine = r.members && r.members[uid];
  if (!mine) return;
  const role = (r.hostId === uid ? "h" : "g") + mine.slot;
  if (state.disc[code] === role) return;
  state.disc[code] = role;
  if (r.hostId === uid) {
    // Urutan penting: bersihkan data turunan selagi room masih ada.
    db.ref("roomSignals/" + code).onDisconnect().remove();
    db.ref("roomInputs/" + code).onDisconnect().remove();
    db.ref("rooms/" + code).onDisconnect().remove();
  } else {
    const up = {};
    up["members/" + uid] = null;
    up["slots/" + mine.slot] = null;
    db.ref("rooms/" + code).onDisconnect().update(up);
  }
}
function cancelDisconnect(code) {
  ["roomSignals/" + code, "roomInputs/" + code, "rooms/" + code].forEach(p => db.ref(p).onDisconnect().cancel());
  delete state.disc[code];
}

function pickGame() {
  const r = state.room;
  if (!r || !state.user || r.hostId !== state.user.uid || r.status === "playing") return;
  const m = modal('<h3>Pilih game untuk room</h3><input type="search" id="pk-q" placeholder="Cari game" aria-label="Cari game"><div class="pick-list" id="pk-list"></div><div class="dlg-act"><button class="btn" data-close>Tutup</button></div>');
  const list = $("#pk-list", m.el), q = $("#pk-q", m.el);
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const items = gamesList().filter(g => !t || ((g.title || "") + " " + (g.ownerName || "")).toLowerCase().indexOf(t) !== -1).sort(newest);
    list.innerHTML = items.length ? items.map(g => '<button class="pick" data-id="' + esc(g.id) + '"><b>' + esc(g.title) + '</b><span class="muted">' + esc(nameOf(g.ownerId, g.ownerName)) + (g.multiplayer ? ", multiplayer" : "") + "</span></button>").join("") : '<p class="muted">Tidak ada game yang cocok.</p>';
  };
  q.addEventListener("input", draw);
  draw();
  list.addEventListener("click", async e => {
    const b = e.target.closest("[data-id]");
    if (!b) return;
    const g = state.games[b.dataset.id];
    if (!g) return;
    m.close();
    showLoader(true);
    try {
      const up = {};
      const base = "rooms/" + state.roomId + "/";
      up[base + "gameId"] = b.dataset.id;
      up[base + "gameTitle"] = g.title;
      up[base + "gameMulti"] = !!g.multiplayer;
      up[base + "gameVer"] = currentVid(g);
      await db.ref().update(up);
      toast("Game room diganti.", "ok");
    } catch (err) { toast(errMsg(err), "error"); }
    finally { showLoader(false); }
  });
}

function pickVersion() {
  const r = state.room, g = r && state.games[r.gameId];
  if (!r || !g || !state.user || r.hostId !== state.user.uid || r.status === "playing") return;
  db.ref("gameVersions/" + r.gameId).once("value").then(snap => {
    const list = versionList(g, snap.val() || {}).filter(v => v.status === "approved").reverse();
    state.verCache[r.gameId] = snap.val() || {};
    const m = modal('<h3>Pilih versi</h3><div class="pick-list" id="pv-list">' + list.map(v => '<button class="pick" data-vid="' + esc(v.vid) + '"><b>' + esc(v.name) + (v.vid === currentVid(g) ? " (terbaru)" : "") + (v.vid === (r.gameVer || "legacy") ? " [dipakai]" : "") + '</b><span class="muted">' + fmtDate(v.createdAt) + (v.notes ? ", " + esc(v.notes) : "") + "</span></button>").join("") + '</div><div class="dlg-act"><button class="btn" data-close>Tutup</button></div>');
    $("#pv-list", m.el).addEventListener("click", async e => {
      const b = e.target.closest("[data-vid]");
      if (!b) return;
      m.close();
      showLoader(true);
      try { await db.ref("rooms/" + state.roomId + "/gameVer").set(b.dataset.vid); toast("Versi room diganti.", "ok"); }
      catch (err) { toast(errMsg(err), "error"); }
      finally { showLoader(false); }
    });
  }).catch(e => toast(errMsg(e), "error"));
}

async function startRound() {
  const r = state.room, code = state.roomId;
  if (!r || !r.gameId || !r.gameVer || !state.user || Object.keys(r.members || {}).length < 2) return;
  const b = "rooms/" + code + "/";
  const up = {};
  up[b + "status"] = "playing";
  up[b + "round"] = (r.round || 0) + 1;
  up[b + "seed"] = Math.floor(Math.random() * 4294967296);
  up[b + "startedAt"] = TS;
  up[b + "winnerId"] = null;
  up[b + "out"] = null;
  up["roomInputs/" + code] = null;
  try { await db.ref().update(up); }
  catch (e) { toast(/permission_denied/i.test((e.code || "") + (e.message || "")) ? "Tidak bisa memulai. Mungkin pemain lain sudah memulai." : errMsg(e), "error"); }
}

async function changeGame() {
  const r = state.room, u = state.user;
  if (!r || !u) return;
  const host = r.hostId === u.uid;
  showLoader(true);
  try { await db.ref("rooms/" + state.roomId + "/status").set("waiting"); }
  catch (e) { toast(errMsg(e), "error"); return; }
  finally { showLoader(false); }
  if (host) setTimeout(pickGame, 80);
}

function copyCode(code) {
  const done = () => toast("Kode room disalin.", "ok");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => window.prompt("Salin kode room:", code));
  else window.prompt("Salin kode room:", code);
}

/* ---- Suara dan koneksi langsung antar pemain (WebRTC, signaling lewat Realtime Database) ---- */
const mesh = { code: null, uid: null, sid: null, peers: {}, sigRef: null, sigCb: null, micStream: null, micTrack: null, micOn: false, micMuted: false, unsupported: false, box: null };
let peerTimer = null;
function peerStateChanged() {
  clearTimeout(peerTimer);
  peerTimer = setTimeout(() => { if (route.name === "room" && !mp) renderView(); }, 80);
}
function audioBox() {
  if (!mesh.box) { mesh.box = document.createElement("div"); mesh.box.hidden = true; document.body.appendChild(mesh.box); }
  return mesh.box;
}

function meshStart() {
  if (mesh.sid && mesh.code === state.roomId) return;
  meshStop(false);
  if (typeof RTCPeerConnection === "undefined") { mesh.unsupported = true; return; }
  mesh.unsupported = false;
  mesh.code = state.roomId;
  mesh.uid = state.user.uid;
  mesh.sid = Math.random().toString(36).slice(2, 10);
  const ref = db.ref("roomSignals/" + mesh.code + "/" + mesh.uid);
  mesh.sigRef = ref;
  mesh.sigCb = snap => {
    const v = snap.val();
    snap.ref.remove().catch(() => {});
    if (!v || typeof v.d !== "string" || typeof v.from !== "string") return;
    let msg;
    try { msg = JSON.parse(v.d); } catch (_) { return; }
    onSignal(v.from, msg);
  };
  ref.on("child_added", mesh.sigCb, () => {});
}

function meshSync(list) {
  if (!mesh.sid || mesh.unsupported) return;
  const ids = {};
  list.forEach(x => { ids[x.id] = true; });
  Object.keys(mesh.peers).forEach(id => { if (!ids[id]) closePeer(id); });
  list.forEach(x => {
    if (x.id === mesh.uid || mesh.peers[x.id]) return;
    createPeer(x.id, mesh.uid < x.id);
  });
}

function meshStop(clearFlag) {
  if (mesh.micOn) {
    const had = state.room && state.user && state.room.members && state.room.members[state.user.uid];
    micStop(false);
    if (clearFlag && had) db.ref("rooms/" + state.roomId + "/members/" + state.user.uid + "/mic").set(false).catch(() => {});
  }
  Object.keys(mesh.peers).forEach(closePeer);
  if (mesh.sigRef) { mesh.sigRef.off("child_added", mesh.sigCb); mesh.sigRef = null; }
  mesh.code = null; mesh.sid = null;
  voice.muted = {}; voice.allMuted = false;
}

function signal(to, msg, p) {
  if (!mesh.sid) return;
  const body = Object.assign({ s: mesh.sid, a: p ? p.rs : null }, msg);
  db.ref("roomSignals/" + mesh.code + "/" + to).push({ from: mesh.uid, d: JSON.stringify(body) }).catch(() => {});
}

function createPeer(id, initiator) {
  const pc = new RTCPeerConnection(ICE_CFG);
  const p = { id: id, pc: pc, initiator: initiator, dc: null, vdc: null, sender: null, rs: null, pending: [], remoteSet: false, state: "connecting", audio: null };
  mesh.peers[id] = p;
  pc.onicecandidate = e => { if (e.candidate) signal(id, { t: "ice", c: e.candidate.toJSON ? e.candidate.toJSON() : e.candidate }, p); };
  pc.onconnectionstatechange = () => { p.state = pc.connectionState; peerStateChanged(); };
  pc.ontrack = e => attachAudio(p, (e.streams && e.streams[0]) || new MediaStream([e.track]));
  pc.ondatachannel = e => { if (e.channel.label === "v") setupVDC(p, e.channel); else setupDC(p, e.channel); };
  if (initiator) {
    setupDC(p, pc.createDataChannel("g"));
    setupVDC(p, pc.createDataChannel("v", { ordered: false, maxRetransmits: 0 }));
    const tr = pc.addTransceiver("audio", { direction: "sendrecv" });
    p.sender = tr.sender;
    if (mesh.micTrack) tr.sender.replaceTrack(mesh.micTrack).catch(() => {});
    pc.createOffer()
      .then(o => pc.setLocalDescription(o).then(() => signal(id, { t: "offer", sdp: o.sdp }, p)))
      .catch(e => console.warn("Offer gagal:", e));
  }
  return p;
}

function closePeer(id) {
  const p = mesh.peers[id];
  if (!p) return;
  delete mesh.peers[id];
  try { p.pc.onicecandidate = null; p.pc.onconnectionstatechange = null; p.pc.close(); } catch (_) {}
  if (p.audio) { try { p.audio.srcObject = null; p.audio.remove(); } catch (_) {} }
  voiceUnwatch(id);
  peerStateChanged();
}

function flushIce(p) {
  const q = p.pending; p.pending = [];
  q.forEach(c => p.pc.addIceCandidate(c).catch(() => {}));
}

async function onSignal(from, m) {
  try {
    if (!mesh.sid || !m || typeof m !== "object") return;
    if (m.a && m.a !== mesh.sid) return;
    let p = mesh.peers[from];
    if (m.t === "offer") {
      if (p && p.rs && p.rs !== m.s) { closePeer(from); p = null; }
      if (p && p.initiator) return;
      if (!p) p = createPeer(from, false);
      p.rs = m.s;
      await p.pc.setRemoteDescription({ type: "offer", sdp: m.sdp });
      p.remoteSet = true;
      flushIce(p);
      const tr = p.pc.getTransceivers().find(t => t.receiver && t.receiver.track && t.receiver.track.kind === "audio");
      if (tr) {
        try { tr.direction = "sendrecv"; } catch (_) {}
        p.sender = tr.sender;
        if (mesh.micTrack) tr.sender.replaceTrack(mesh.micTrack).catch(() => {});
      }
      const ans = await p.pc.createAnswer();
      await p.pc.setLocalDescription(ans);
      signal(from, { t: "answer", sdp: ans.sdp }, p);
    } else if (!p) {
      return;
    } else if (m.t === "answer") {
      if (p.rs && p.rs !== m.s) return;
      p.rs = m.s;
      await p.pc.setRemoteDescription({ type: "answer", sdp: m.sdp });
      p.remoteSet = true;
      flushIce(p);
    } else if (m.t === "ice") {
      if (p.rs && p.rs !== m.s) return;
      if (p.remoteSet) p.pc.addIceCandidate(m.c).catch(() => {}); else p.pending.push(m.c);
    }
  } catch (e) { console.warn("Signal gagal:", e); }
}

function attachAudio(p, stream) {
  let a = p.audio;
  if (!a) {
    a = document.createElement("audio");
    a.autoplay = true;
    a.setAttribute("playsinline", "");
    audioBox().appendChild(a);
    p.audio = a;
  }
  a.srcObject = stream;
  a.muted = isMutedPeer(p.id);
  voiceWatch(p.id, stream);
  const pr = a.play();
  if (pr && pr.catch) pr.catch(() => {
    const kick = () => { a.play().catch(() => {}); document.removeEventListener("click", kick); };
    document.addEventListener("click", kick);
  });
}

function setupDC(p, dc) {
  p.dc = dc;
  dc.onopen = () => peerStateChanged();
  dc.onclose = () => peerStateChanged();
  dc.onmessage = e => { if (typeof e.data === "string" && e.data.length < 20000) onNetData(p.id, e.data); };
}

function setupVDC(p, dc) {
  p.vdc = dc;
  try { dc.binaryType = "arraybuffer"; } catch (_) {}
  dc.onopen = () => peerStateChanged();
  dc.onclose = () => peerStateChanged();
  dc.onmessage = e => { if (e.data instanceof ArrayBuffer) onVideoFrame(p.id, e.data); };
}

function refreshMicButtons() {
  document.querySelectorAll('[data-act="mic-toggle"]').forEach(b => {
    const t = mesh.micOn ? "Matikan mic" : "Nyalakan mic";
    if (b.dataset.ic) { b.innerHTML = micIcon(mesh.micOn); b.title = t; b.setAttribute("aria-label", t); b.classList.toggle("on", mesh.micOn); }

  document.querySelectorAll('[data-act="mute-all"]').forEach(b => {
    const t = voice.allMuted ? "Suarakan semua" : "Bisukan semua";
    if (b.dataset.ic) { b.innerHTML = spkIcon(!voice.allMuted); b.title = t; b.setAttribute("aria-label", t); b.classList.toggle("off", voice.allMuted); }
    else b.textContent = t;

function setMicFlag(on) {
  const r = state.room, u = state.user;
  if (!r || !u || !r.members || !r.members[u.uid]) return;
  db.ref("rooms/" + state.roomId + "/members/" + u.uid + "/mic").set(on).catch(() => {});
}
async function micToggle() {
  if (!state.user || !state.room) return;
  if (mesh.micOn) { micStop(true); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    toast("Mikrofon tidak tersedia. Buka situs lewat HTTPS atau localhost.", "error");
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }, video: false });
    mesh.micStream = stream;
    mesh.micTrack = stream.getAudioTracks()[0];
    mesh.micOn = true;
    mesh.micMuted = false;
    voiceWatch(state.user.uid, stream);
    Object.keys(mesh.peers).forEach(id => { const p = mesh.peers[id]; if (p.sender) p.sender.replaceTrack(mesh.micTrack).catch(() => {}); });
    setMicFlag(true);
    refreshMicButtons();
  } catch (e) {
    toast(e && e.name === "NotAllowedError" ? "Izin mikrofon ditolak. Aktifkan izin mikrofon di pengaturan browser." : "Gagal mengaktifkan mikrofon: " + errMsg(e), "error");
  }
}
function micStop(updateDb) {
  if (mesh.micStream) mesh.micStream.getTracks().forEach(t => t.stop());
  Object.keys(mesh.peers).forEach(id => { const p = mesh.peers[id]; if (p.sender) p.sender.replaceTrack(null).catch(() => {}); });
  mesh.micStream = null; mesh.micTrack = null; mesh.micOn = false; mesh.micMuted = false;
  if (state.user) voiceUnwatch(state.user.uid);
  if (updateDb) setMicFlag(false);
  refreshMicButtons();
}

const spkIcon = on => '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"/>' + (on ? '<path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>' : '<path d="M22 9l-6 6M16 9l6 6"/>') + "</svg>";
const flagIcon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5"/></svg>';
const micIcon = on => '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>' + (on ? "" : '<path d="M3 3l18 18"/>') + "</svg>";

/* ---- Mute dan indikator suara ---- */
const voice = { ctx: null, nodes: {}, speaking: {}, muted: {}, allMuted: false, timer: null };
const isMutedPeer = id => voice.allMuted || !!voice.muted[id];
function voiceCtx() {
  if (!voice.ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { voice.ctx = new C(); } catch (_) { return null; }
  }
  if (voice.ctx.state === "suspended") voice.ctx.resume().catch(() => {});
  return voice.ctx;
}
function setSpeaking(id, on) {
  if (!!voice.speaking[id] === on) return;
  voice.speaking[id] = on;
  document.querySelectorAll("[data-voice]").forEach(el => { if (el.dataset.voice === id) el.classList.toggle("speaking", on); });
}
function applySpeaking() {
  document.querySelectorAll("[data-voice]").forEach(el => el.classList.toggle("speaking", !!voice.speaking[el.dataset.voice]));
}
function voiceTick() {
  const me = state.user && state.user.uid;
  if (voice.ctx && voice.ctx.state === "suspended") voice.ctx.resume().catch(() => {});
  const now = Date.now();
  Object.keys(voice.nodes).forEach(id => {
    const n = voice.nodes[id];
    n.an.getByteTimeDomainData(n.buf);
    let sum = 0;
    for (let i = 0; i < n.buf.length; i++) { const v = (n.buf[i] - 128) / 128; sum += v * v; }
    if (Math.sqrt(sum / n.buf.length) > 0.035) n.last = now;
    let sp = now - n.last < 350;
    if (id !== me && isMutedPeer(id)) sp = false;
    setSpeaking(id, sp);
  });
}
function voiceWatch(id, stream) {
  voiceUnwatch(id);
  if (!id || !stream || !stream.getAudioTracks().length) return;
  const ctx = voiceCtx();
  if (!ctx) return;
  try {
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an); // tidak disambungkan ke speaker, hanya dianalisis
    voice.nodes[id] = { src: src, an: an, buf: new Uint8Array(an.fftSize), last: 0 };
    if (!voice.timer) voice.timer = setInterval(voiceTick, 100);
  } catch (_) {}
}
function voiceUnwatch(id) {
  const n = voice.nodes[id];
  if (n) { try { n.src.disconnect(); } catch (_) {} delete voice.nodes[id]; }
  setSpeaking(id, false);
  if (!Object.keys(voice.nodes).length && voice.timer) { clearInterval(voice.timer); voice.timer = null; }
}
function applyMute() {
  Object.keys(mesh.peers).forEach(id => {
    const p = mesh.peers[id];
    if (p.audio) p.audio.muted = isMutedPeer(id);
    if (isMutedPeer(id)) setSpeaking(id, false);
  });
  refreshMicButtons();
  if (route.name === "room" && !mp) renderView();
}
function toggleMutePeer(id) { voice.muted[id] = !voice.muted[id]; applyMute(); }
function toggleMuteAll() { voice.allMuted = !voice.allMuted; applyMute(); }
function micMuteToggle() {
  if (!mesh.micOn || !mesh.micTrack) return;
  mesh.micMuted = !mesh.micMuted;
  mesh.micTrack.enabled = !mesh.micMuted;
  setMicFlag(!mesh.micMuted);
  refreshMicButtons();
  if (route.name === "room" && !mp) renderView();
}

/* ---- Halaman room (lobi) ---- */
function voiceText(id) {
  if (mesh.unsupported) return "Suara tidak didukung browser ini";
  const p = mesh.peers[id];
  if (!p) return "Suara: menunggu";
  if (p.state === "connected") return "Suara terhubung";
  if (p.state === "failed" || p.state === "disconnected" || p.state === "closed") return "Suara tidak terhubung";
  return "Suara: menghubungkan";
}

function viewRoom() {
  if (!state.authReady) return loadingBlock();
  if (!state.user) return needLogin("Masuk untuk bergabung ke room.");
  const code = (route.id || "").toUpperCase();
  if (state.roomId === "bad" || !ROOM_RE.test(code)) return notFound("Kode room tidak valid.");
  if (state.roomId !== code) return loadingBlock("Memuat room...");
  const r = state.room;
  if (!r) return notFound("Room tidak ditemukan atau sudah ditutup.");
  const uid = state.user.uid;
  const list = membersList(r);
  const me = r.members && r.members[uid];
  if (!me) {
    if (list.length >= MAX_PLAYERS) return notFound("Room ini sudah penuh (maksimal " + MAX_PLAYERS + " pemain).");

  }
  const isHost = r.hostId === uid;
  const canStart = !!r.gameId && !!r.gameVer && list.length >= 2 && ((isHost && r.status === "waiting") || r.status === "finished");
  const byId = {};
  list.forEach(x => { byId[x.id] = x; });

    const id = r.slots && r.slots[k];
    const x = id && byId[id];
    if (!x) return '<div class="pcard empty"><div class="pc-top"><span class="avatar sm">' + (idx + 1) + '</span><div class="pc-name"><b>Menunggu pemain</b><span class="muted">Player ' + (idx + 1) + "</span></div></div></div>";
    const self = id === uid;
    const eq = '<span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>';
    let meta;
    if (self) {
      const on = mesh.micOn && !mesh.micMuted;
      meta = '<span class="pc-mic ' + (on ? "on" : "") + '">' + micIcon(on) + (mesh.micOn ? (mesh.micMuted ? "Mic dibisukan" : "Mic aktif") : "Mic mati") + eq + "</span>";
    } else {
      const pm = isMutedPeer(id);
      meta = '<span class="pc-mic ' + (x.mic && !pm ? "on" : "") + '">' + micIcon(x.mic && !pm) + (pm ? "Dibisukan oleh Anda" : (x.mic ? "Mic aktif" : "Mic mati")) + eq + '</span><span class="muted pc-voice">' + esc(voiceText(id)) + '</span><button class="btn sm pc-mute" data-act="mute-peer" data-id="' + esc(id) + '">' + (voice.muted[id] ? "Suarakan" : "Bisukan") + "</button>";
    }
    return '<div class="pcard" data-voice="' + esc(id) + '"><div class="pc-top">' + avatarHTML(id, x.name, "sm") + '<div class="pc-name"><b>' + nameHTML(id, x.name) + (self ? ' <span class="badge">Anda</span>' : "") + '</b><span class="muted">Player ' + x.slot + (id === r.hostId ? ", host" : "") + "</span></div></div>" + meta + "</div>";

  else if (isHost) startArea = '<button class="btn primary" disabled>Mainkan</button>';
  else startArea = "";
  let wait = "";
  if (!r.gameId) wait = isHost ? "Pilih game terlebih dahulu dengan tombol Pilih game." : "Menunggu host memilih game.";
  else if (isHost && list.length < 2) wait = "Menunggu minimal satu teman bergabung dengan kode di atas.";
  else if (!isHost && r.status === "waiting") wait = "Menunggu host menekan Mainkan.";
  const modeText = !r.gameId ? "Game belum dipilih." : r.gameMulti ? "Game multiplayer: semua pemain berada di satu layar penuh." : "Game biasa: layar terbagi, tiap pemain memainkan game sendiri dan yang bertahan terakhir menang.";
  return '<section class="wrap narrow"><h1>Room multiplayer</h1>' +
    '<p class="muted" style="margin-top:6px">' + (isHost ? "Bagikan kode ini ke temanmu. Mereka memasukkannya lewat tombol Room di menu atas." : "Anda sudah berada di room ini.") + "</p>" +
    '<div class="roomcode"><div><span class="muted">Kode room</span><output>' + esc(code) + '</output></div><button class="btn sm" data-act="copy-code" data-id="' + esc(code) + '">Salin kode</button></div>' +

    '<div class="roomgame"><div><span class="muted">Game</span><b>' + esc(r.gameTitle || "Belum dipilih") + '</b>' + (r.gameId ? '<span class="muted">Versi ' + esc(verNameIn(state.verCache[r.gameId], state.games[r.gameId], r.gameVer || "legacy")) + "</span>" : "") + '<span class="muted">' + esc(modeText) + "</span></div>" + (isHost ? '<div class="rg-act">' + (r.gameId ? '<button class="btn sm" data-act="pick-ver">Versi</button>' : "") + '<button class="btn sm" data-act="pick-game">' + (r.gameId ? "Ganti game" : "Pilih game") + "</button></div>" : "") + "</div>" +
    (wait ? '<p class="hint">' + esc(wait) + "</p>" : "") +
    '<div class="actions" style="margin-top:22px">' + startArea + '<button class="btn danger" data-act="leave-room">' + (isHost ? "Tutup room" : "Keluar room") + "</button></div></section>";

function postToFrame(f, msg) {
  if (!f || f.dead) return;
  if (f.ready && f.el.contentWindow) { try { f.el.contentWindow.postMessage(msg, "*"); } catch (_) {} }
  else if (f.queue.length < 500) f.queue.push(msg);
}
function frameRec(iframe) {
  const f = { el: iframe, ready: false, queue: [] };
  iframe.addEventListener("load", () => {
    f.ready = true;
    const q = f.queue; f.queue = [];
    q.forEach(msg => { try { iframe.contentWindow.postMessage(msg, "*"); } catch (_) {} });
  });
  return f;
}

      cd.textContent = String(Math.ceil(left / 1000));
      m.tickT = setTimeout(tick, Math.min(left, 100));
    } else {
      cd.hidden = true;
      launchMp(m, r, codePromise);
    }
  };
  tick();
}

async function launchMp(m, r, codePromise) {
  let code;
  try {
    code = await codePromise;
    if (typeof code !== "string" || !code) throw new Error("Kode game tidak tersedia. Mungkin game sedang ditinjau ulang.");
  } catch (e) { toast(errMsg(e), "error"); return; }
  if (m.dead) return;
  const n = m.list.length;
  const build = (cfg, title) => {
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-pointer-lock allow-modals");
    f.referrerPolicy = "no-referrer";
    f.title = title;
    f.srcdoc = injectShim(code, cfg);
    return f;
  };
  if (m.mode === "split") {
    const vw = n <= 2 ? 480 : n === 3 ? 400 : 320;
    const vfps = n <= 2 ? 12 : n === 3 ? 10 : 8;
    m.list.forEach(x => {
      const pane = paneEl(m, x.id);
      if (!pane) return;
      if (x.id === m.uid) {
        const f = build({ role: "local", mode: "split", seed: m.seed, vw: vw, vfps: vfps, vq: 0.55 }, "Game Anda");
        f.addEventListener("load", () => { try { f.contentWindow.focus(); } catch (_) {} });
        m.local = f;
        pane.insertBefore(f, pane.firstChild);
      } else {
        // Layar pemain lain: jika pengirim memakai canvas, tayangan asli (cuplikan) menggantikan iframe ini
        // dan iframe dibuang agar tidak membebani perangkat. Jika tidak, iframe memutar ulang input (perkiraan).
        const f = build({ role: "mirror", mode: "split", seed: m.seed, fps: n >= 3 ? 30 : 60 }, "Tayangan " + x.name);
        f.className = "mirror";
        f.tabIndex = -1;
        m.frames[x.id] = frameRec(f);
        pane.insertBefore(f, pane.firstChild);
        const cv = document.createElement("canvas");
        cv.className = "vview";
        cv.hidden = true;
        pane.insertBefore(cv, f.nextSibling);
        m.vview[x.id] = cv;
      }
    });
    m.noteT = setTimeout(() => {
      if (m.dead) return;
      m.list.forEach(x => {
        if (x.id === m.uid || m.gotFrame[x.id]) return;
        const pane = paneEl(m, x.id);
        if (pane && !$(".pnote", pane)) {
          const nt = document.createElement("div");
          nt.className = "pnote";
          nt.textContent = "Tayangan perkiraan";
          pane.appendChild(nt);
        }
      });
    }, 4500);
  } else {
    const me = m.members[m.uid];
    const players = m.list.map(x => ({ id: x.id, name: nameOf(x.id, x.name), index: x.slot }));
    const info = { me: { id: m.uid, name: nameOf(m.uid, me ? me.name : ""), index: me ? me.slot : 0 }, players: players, host: m.isHost, round: m.round, seed: m.seed };
    const f = build({ role: "local", mode: "single", info: info }, "Game");
    f.addEventListener("load", () => { try { f.contentWindow.focus(); } catch (_) {} });
    m.local = f;
    m.single = frameRec(f);
    const pane = paneEl(m, "single");
    pane.insertBefore(f, pane.firstChild);
  }
  // Jalur cadangan lewat Realtime Database (dipakai bila koneksi langsung gagal).
  m.list.forEach(x => {
    if (x.id === m.uid) return;
    const ref = db.ref("roomInputs/" + m.code + "/" + x.id);
    const cb = snap => { const v = snap.val(); if (typeof v === "string") onNetData(x.id, v); };
    ref.on("child_added", cb, () => {});
    m.rtdb.push([ref, cb]);
  });
  m.t0 = Date.now();
  m.live = true;
  if (r.round === 1) countPlay(r.gameId, state.games[r.gameId]);
}

// Tayangan layar pemain lain: cuplikan JPEG lewat kanal data tanpa antrean (frame lama dibuang, bukan menumpuk).
function netFrame(d) {
  const m = mp;
  if (!m || !m.live || m.dead || !(d.buf instanceof ArrayBuffer) || d.buf.byteLength > 200000) return;
  const w = Math.min(65535, d.w | 0), h = Math.min(65535, d.h | 0);
  if (w < 2 || h < 2) return;
  const out = new Uint8Array(12 + d.buf.byteLength);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, m.round); dv.setUint16(4, w); dv.setUint16(6, h); dv.setUint32(8, ++m.vseq);
  out.set(new Uint8Array(d.buf), 12);
  Object.keys(m.members).forEach(id => {
    if (id === m.uid) return;
    const p = mesh.peers[id];
    if (p && p.vdc && p.vdc.readyState === "open" && p.vdc.bufferedAmount < 262144) { try { p.vdc.send(out); } catch (_) {} }
  });
}
function onVideoFrame(from, buf) {
  const m = mp;
  if (!m || m.dead || !m.members[from] || buf.byteLength < 14) return;
  const view = m.vview[from];
  if (!view) return;
  const dv = new DataView(buf);
  if (dv.getUint32(0) !== m.round) return;
  const seq = dv.getUint32(8);
  if (seq <= (m.vlast[from] || 0) || m.vbusy[from]) return;
  m.vlast[from] = seq;
  const w = dv.getUint16(4), h = dv.getUint16(6);
  m.vbusy[from] = true;
  createImageBitmap(new Blob([buf.slice(12)], { type: "image/jpeg" })).then(bm => {
    m.vbusy[from] = false;
    if (m.dead) { bm.close(); return; }
    if (view.width !== w || view.height !== h) { view.width = w; view.height = h; }
    view.getContext("2d").drawImage(bm, 0, 0);
    bm.close();
    if (!m.gotFrame[from]) {
      m.gotFrame[from] = true;
      view.hidden = false;
      const f = m.frames[from];
      if (f) { f.dead = true; try { f.el.srcdoc = ""; f.el.remove(); } catch (_) {} }
      const pane = paneEl(m, from);
      const nt = pane && $(".pnote", pane);
      if (nt) nt.remove();
    }
  }).catch(() => { m.vbusy[from] = false; });
}

function cleanEv(e) {
  if (!e || typeof e !== "object" || typeof e.t !== "string" || e.t.length > 12) return null;
  const o = { t: e.t, w: Math.max(0, Math.round(+e.w || 0)) };
  if (typeof e.k === "string") o.k = e.k.slice(0, 24);
  if (typeof e.c === "string") o.c = e.c.slice(0, 24);
  ["kc", "md", "x", "y", "b", "bs"].forEach(f => { if (typeof e[f] === "number" && isFinite(e[f])) o[f] = e[f]; });
  ["th", "ch"].forEach(f => { if (Array.isArray(e[f])) o[f] = e[f].slice(0, 5).map(q => ({ i: +q.i || 0, x: +q.x || 0, y: +q.y || 0 })); });
  return o;
}

function dcOpen(id) {
  const p = mesh.peers[id];
  return !!(p && p.dc && p.dc.readyState === "open");
}
// Kirim peristiwa ke semua pemain lain: lewat koneksi langsung bila ada, selain itu lewat database.
function netSend(evs) {
  const m = mp;
  if (!m || m.dead || !m.live || !evs.length) return;
  const str = JSON.stringify({ r: m.round, e: evs });
  let needDb = false;
  Object.keys(m.members).forEach(id => {
    if (id === m.uid) return;
    if (dcOpen(id)) { try { mesh.peers[id].dc.send(str); } catch (_) { needDb = true; } }
    else needDb = true;
  });
  if (needDb) {
    Array.prototype.push.apply(m.dbBuf, evs);
    if (!m.dbTimer) m.dbTimer = setTimeout(dbFlush, 60);
  }
}
function dbFlush() {
  const m = mp;
  if (!m) return;
  m.dbTimer = null;
  const buf = m.dbBuf; m.dbBuf = [];
  if (!buf.length) return;
  const ref = db.ref("roomInputs/" + m.code + "/" + m.uid);
  const push = a => {
    const s = JSON.stringify({ r: m.round, e: a });
    if (s.length > 2900) {
      if (a.length > 1) { const h = a.length >> 1; push(a.slice(0, h)); push(a.slice(h)); }
      return;
    }
    ref.push(s).catch(() => {});
  };
  push(buf);
}

function onNetData(from, str) {
  const m = mp;
  if (!m || m.dead || !m.members[from]) return;
  let o;
  try { o = JSON.parse(str); } catch (_) { return; }
  if (!o || o.r !== m.round || !Array.isArray(o.e)) return;
  const seen = m.seen[from] || (m.seen[from] = new Set());
  const fresh = [];
  const evs = o.e.slice(0, 200);
  for (let k = 0; k < evs.length; k++) {
    const e = evs[k];
    if (!e || typeof e.i !== "number" || seen.has(e.i)) continue;
    seen.add(e.i);
    fresh.push(e);
  }
  if (seen.size > 4000) {
    Array.from(seen).sort((a, b) => a - b).slice(0, 2000).forEach(x => seen.delete(x));
  }
  if (!fresh.length) return;
  if (m.mode === "split") deliverSplit(m, from, fresh); else deliverSingle(m, from, fresh);
}

// Jitter buffer: tiap peristiwa diputar pada waktu kirim asli + penundaan tetap,
// sehingga gerakan lawan tampak halus dan tidak menumpuk.
function deliverSplit(m, from, fresh) {
  const f = m.frames[from];
  if (!f || f.dead) return; // layar ini sudah memakai tayangan asli
  const st = m.sync[from] || (m.sync[from] = { min: Infinity, last: 0 });
  const now = Date.now();
  const clean = fresh.map(cleanEv).filter(Boolean).sort((a, b) => a.w - b.w);
  clean.forEach(e => { const d = now - e.w; if (d < st.min) st.min = d; });
  const base = st.min + JITTER_MS;
  // Waktu putar tidak boleh mundur: tombol "ditekan" tidak boleh terlambat dari "dilepas".
  clean.forEach(e => { let at = e.w + base; if (at < st.last) at = st.last; st.last = at; e.at = at; });
  if (clean.length) postToFrame(f, { caxa: 1, type: "replay", events: clean });
}
function deliverSingle(m, from, fresh) {
  fresh.forEach(e => {
    if (!e || !e.m) return;
    if (e.to && e.to !== m.uid) return;
    postToFrame(m.single, { caxa: 1, type: "msg", from: from, data: e.d });
  });
}

window.addEventListener("message", e => {
  const m = mp;
  if (!m || !m.local || e.source !== m.local.contentWindow) return;
  const d = e.data;
  if (!d || d.caxa !== 1) return;
  if (d.type === "gameover") reportOut();
  else if (d.type === "frame" && m.mode === "split") netFrame(d);
  else if (d.type === "input" && m.mode === "split" && Array.isArray(d.ev)) {
    const evs = d.ev.slice(0, 100).map(cleanEv).filter(Boolean);
    evs.forEach(x => { x.i = ++m.seq; });
    netSend(evs);
  } else if (d.type === "send" && m.mode === "single") {
    let s;
    try { s = JSON.stringify(d.data); } catch (_) { return; }
    if (typeof s !== "string" || s.length > 1800) { console.warn("Pesan Caxa terlalu besar (maksimal 1800 karakter)."); return; }
    netSend([{ m: 1, to: typeof d.to === "string" ? d.to : null, d: d.data, w: Date.now() - m.t0, i: ++m.seq }]);
  } else if (d.type === "finish" && m.mode === "single") {
    const w = String(d.winner || "draw");
    if (w === "draw" || m.members[w]) finishRound(w);
  }
});

async function reportOut() {
  const m = mp;
  if (!m || !m.live || m.dead || m.reported || m.resultShown || !state.user) return;
  m.reported = true;
  try { await db.ref("rooms/" + m.code + "/out/" + state.user.uid).set(true); }
  catch (e) { console.warn("Laporan game over ditolak:", e); }
}

async function finishRound(winner) {
  const m = mp;
  if (!m || m.finishing || m.dead || m.resultShown) return;
  m.finishing = true;
  const b = "rooms/" + m.code + "/";
  const up = {};
  up[b + "winnerId"] = winner;
  up[b + "status"] = "finished";
  try { await db.ref().update(up); }
  catch (e) { setTimeout(() => { m.finishing = false; }, 1500); }
}

function updateMpState(r) {
  const m = mp;
  if (!m) return;
  const cur = r.members || {};
  m.list.forEach(x => {
    const left = !cur[x.id];
    const isOut = !!(r.out && r.out[x.id]);
    const pane = paneEl(m, x.id);
    if (pane) {
      const po = $(".pout", pane);
      if (po) { po.hidden = !(left || isOut); po.textContent = left ? "Keluar" : "Game over"; }
    }
    if (left && m.members[x.id]) {
      delete m.members[x.id];
      if (m.mode === "single") postToFrame(m.single, { caxa: 1, type: "leave", id: x.id });
    }
  });
}

function showResult(r) {
  const m = mp;
  if (!m || m.resultShown) return;
  m.resultShown = true;
  const freeze = { caxa: 1, type: "freeze" };
  if (m.local) { try { m.local.contentWindow.postMessage(freeze, "*"); } catch (_) {} }
  Object.keys(m.frames).forEach(id => { try { m.frames[id].el.contentWindow.postMessage(freeze, "*"); } catch (_) {} });
  const w = r.winnerId;
  let title, text;
  if (w === "draw") {
    title = "Ronde seri";
    text = "Tidak ada pemenang di ronde ini.";
  } else {
    const x = membersList(r).find(i => i.id === w);
    const nm = nameOf(w, x ? x.name : "Pemain");
    title = "Player " + (x ? x.slot : "?") + " menang";
    text = '<b>' + esc(nm) + "</b> memenangkan ronde ini. " + (w === m.uid ? "Selamat, Anda menang." : "Anda belum menang di ronde ini.");
  }
  const box = document.createElement("div");
  box.className = "backdrop";
  box.innerHTML = '<div class="dlg" role="alertdialog" aria-modal="true"><h3>' + esc(title) + "</h3><p>" + text + '</p><div class="dlg-act"><button class="btn" data-act="mp-change">Ganti game</button><button class="btn primary" data-act="mp-again">Lanjutkan game</button></div></div>';
  m.el.appendChild(box);
  const first = $('[data-act="mp-again"]', box);
  if (first) first.focus();
}

function destroyMp(forfeit) {
  const m = mp;
  if (!m) return;
  if (forfeit && m.live && !m.reported && !m.resultShown) reportOut();
  m.dead = true;
  clearTimeout(m.tickT);
  clearTimeout(m.noteT);
  clearTimeout(m.dbTimer);
  m.rtdb.forEach(x => { try { x[0].off("child_added", x[1]); } catch (_) {} });
  if (m.el) m.el.remove();
  document.body.style.overflow = "";
  mp = null;
}

/* ---- Sinkronisasi room ---- */
function detachRoom() {
  if (roomRef) { roomRef.off("value", roomCb); roomRef = null; }
  state.room = null; state.roomId = null; state.prevMembers = null;
}
function attachRoom() {
  detachRoom();
  if (route.name !== "room") return;
  const code = (route.id || "").toUpperCase();
  if (!ROOM_RE.test(code)) { state.roomId = "bad"; return; }
  if (!state.user) return;
  const same = () => (route.id || "").toUpperCase() === code;
  roomCb = s => { if (!same()) return; state.room = s.val(); state.roomId = code; onRoomUpdate(); };
  roomRef = db.ref("rooms/" + code);
  roomRef.on("value", roomCb, e => { if (!same()) return; state.room = null; state.roomId = code; onDbErr(e); renderView(); });
}

function onRoomUpdate() {
  const r = state.room, u = state.user;
  if (!u) return;
  if (!r) {
    destroyMp(false);
    meshStop(false);
    if (state.seenRoom === state.roomId && !state.leaving) { toast("Room telah ditutup.", "error"); state.seenRoom = null; location.hash = "#/"; return; }
    renderView();
    return;
  }
  state.seenRoom = state.roomId;
  const list = membersList(r);
  const me = r.members && r.members[u.uid];
  const isHost = r.hostId === u.uid;
  ensureProfiles(list.map(x => x.id));
  ensureVers(r.gameId);
  if (me) { setupDisconnect(r); meshStart(); meshSync(list); } else { meshStop(false); }

  const cur = {};
  list.forEach(x => { cur[x.id] = x.name; });
  if (state.prevMembers) {
    Object.keys(state.prevMembers).forEach(id => { if (!cur[id] && id !== u.uid) toast(nameOf(id, state.prevMembers[id]) + " keluar dari room."); });
    Object.keys(cur).forEach(id => { if (!state.prevMembers[id] && id !== u.uid) toast(nameOf(id, cur[id]) + " bergabung ke room.", "ok"); });
  }
  state.prevMembers = cur;

  if (isHost && r.status !== "waiting" && list.length < 2) db.ref("rooms/" + state.roomId + "/status").set("waiting").catch(() => {});

  if (me && r.status === "playing" && list.length >= 2) {
    if (!mp || mp.round !== r.round || mp.code !== state.roomId) startMp(r);
    else {
      updateMpState(r);
      const w = computeFinish(r);
      if (w) finishRound(w);
    }
  } else if (me && r.status === "finished" && r.winnerId && mp && mp.round === r.round) {
    showResult(r);
  } else if (mp) {
    destroyMp(false);
  }
  if (!mp) renderView();
}

/* ====================== Router ====================== */
function parseHash() {
  const p = location.hash.replace(/^#\/?/, "").split("/");
  return { name: p[0] || "home", id: p[1] || null };
}
function onRoute() {
  destroyMp(true);
  meshStop(true);
  route = parseHash();
  state.touched = false;
  state.leaving = false;
  attachRoom();
  if (detailRef) { detailRef.off("value", detailCb); detailRef = null; }
  if (versRef) { versRef.off("value", versCb); versRef = null; }
  state.detail = null; state.detailId = null; state.myRating = null; state.vers = null; state.selVer = null;
  if (route.name === "update") loadUpdVers(route.id);
  if (route.name === "game") {
    const rid = route.id;
    loadMyRating(rid);
    if (!ID_RE.test(rid || "")) { state.detailId = "bad"; }
    else {
      detailCb = s => { if (route.id !== rid) return; state.detail = s.val(); state.detailId = rid; renderView(); };
      versCb = s => { if (route.id !== rid) return; state.vers = s.val() || {}; renderView(); };
      versRef = db.ref("gameVersions/" + rid);
      versRef.on("value", versCb, e => { if (route.id !== rid) return; state.vers = {}; onDbErr(e); renderView(); });
      detailRef = db.ref("games/" + rid);
      detailRef.on("value", detailCb, e => { if (route.id !== rid) return; state.detail = null; state.detailId = rid; onDbErr(e); renderView(); });
    }
  }
  const navKey = route.name === "edit" || route.name === "update" ? "upload" : route.name;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === navKey));
  window.scrollTo(0, 0);
  renderView();
}
function renderView() {
  const v = $("#view");
  switch (route.name) {
    case "home": v.innerHTML = viewHome(); break;
    case "game": v.innerHTML = viewGame(); break;
    case "favorites": v.innerHTML = viewFavorites(); break;
    case "profile": v.innerHTML = viewProfile(); break;
    case "room": v.innerHTML = viewRoom(); break;
    case "upload": case "edit": v.innerHTML = viewForm(); bindForm(); break;
    case "update": v.innerHTML = viewUpdate(); bindUpdate(); break;
    default: v.innerHTML = notFound("Halaman tidak ada.");
  }
  applySpeaking();
}
// Data realtime memanggil refresh(). Dibatasi agar tidak menggambar ulang terus-menerus,
// tidak mengganggu form yang sedang diisi, dan tidak berjalan saat permainan berlangsung.
function refresh() {
  if (refreshT) return;
  refreshT = setTimeout(() => {
    refreshT = null;
    if (mp && route.name === "room") return;
    if ((route.name === "upload" || route.name === "edit" || route.name === "update") && state.touched) return;
    renderView();
  }, 60);
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "login") login();
  else if (a === "logout") logout();
  else if (a === "fav") toggleFav(id);
  else if (a === "play") playMenu(id);
  else if (a === "join-room") joinModal();
  else if (a === "join-room-now") joinRoom(id);
  else if (a === "copy-code") copyCode(id);
  else if (a === "leave-room") leaveRoom();
  else if (a === "start-room" || a === "mp-again") startRound();
  else if (a === "pick-game") pickGame();
  else if (a === "mp-change") changeGame();
  else if (a === "mp-surrender") {
    confirmBox({ title: "Menyerah?", text: "Anda akan dinyatakan kalah di ronde ini.", ok: "Menyerah", danger: true }).then(ok => { if (ok) reportOut(); });
  }
  else if (a === "mp-exit") leaveRoom();
  else if (a === "mp-fs") {
    if (mp && mp.el) {
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      else if (mp.el.requestFullscreen) mp.el.requestFullscreen().catch(() => {});
    }
  }
  else if (a === "play-ver") { state.selVer = el.dataset.vid; playMenu(id); }
  else if (a === "del-ver") delVersion(id, el.dataset.vid);
  else if (a === "pick-ver") pickVersion();
  else if (a === "mic-toggle") micToggle();
  else if (a === "mic-mute") micMuteToggle();
  else if (a === "mute-peer") toggleMutePeer(id);
  else if (a === "mute-all") toggleMuteAll();
  else if (a === "edit-profile") editProfileModal();
  else if (a === "rate") rateGame(id, parseInt(el.dataset.n, 10));
  else if (a === "share") share(id);
  else if (a === "delete") deleteGame(id);
  else if (a === "cat") { state.cat = id || ""; renderView(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; renderView(); }
  if (e.target.id === "ver-sel") { state.selVer = e.target.value; renderView(); }
});
let qTimer = null;
$("#q").addEventListener("input", e => {

  qTimer = setTimeout(() => {

  else offTimer = setTimeout(() => { $("#offline").hidden = false; }, 4000);
});
db.ref("categories").on("value", s => { state.cats = s.val() || {}; state.loaded.cats = true; refresh(); }, e => { state.loaded.cats = true; onDbErr(e); });
db.ref("games").orderByChild("status").equalTo("approved").on("value", s => {
  state.games = s.val() || {}; state.loaded.games = true; state.loadError = "";
  ensureProfiles(Object.keys(state.games).map(id => state.games[id].ownerId));
  refresh();
}, e => { state.loaded.games = true; state.loadError = errMsg(e); onDbErr(e); refresh(); });
db.ref("plays").on("value", s => { state.plays = s.val() || {}; refresh(); }, onDbErr);
db.ref("ratingStats").on("value", s => { state.ratingStats = s.val() || {}; refresh(); }, onDbErr);

auth.getRedirectResult().catch(e => toast(errMsg(e), "error"));
auth.onAuthStateChanged(async u => {
  detachUserListeners();
  state.user = u;
  state.authReady = true;
  renderAuth();
  if (!u) { destroyMp(false); detachRoom(); }
  else if (route.name === "room") attachRoom();
  if (u) { await ensureUserRecord(u); attachUserListeners(u); }
  refresh();
});

onRoute();
})();
</script>
</body>
</html>
