<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Caxa GameHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--line:#2b2b2b;--line2:#555;--tx:#fff;--mu:#a3a3a3;
  --ok:#5ee08a;--warn:#f5c04a;--bad:#ff6b6b;--max:1200px;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;font-weight:800}
.muted{color:var(--mu)}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:-.03em}
.logo span{font-weight:400;color:var(--mu);margin-left:4px}
.nav{display:flex;gap:2px}
.nav a{padding:7px 12px;border-radius:6px;color:var(--mu);font-weight:600;font-size:14px}
.nav a:hover{color:#fff}
.nav a.on{color:#000;background:#fff}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px}
.search:focus-within{border-color:#fff}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search svg{flex:none;color:var(--mu)}
.auth{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);overflow:hidden;display:grid;place-items:center;font-weight:800;background:#000;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.offline{background:#fff;color:#000;text-align:center;padding:8px 16px;font-weight:600;font-size:14px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#fff}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.primary:hover{background:#d4d4d4}
.btn.danger{color:var(--bad);border-color:#5c2b2b}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:#000;border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--mu)}
.icon-btn:hover{color:#fff;border-color:#fff}
.icon-btn.on{color:#000;background:#fff;border-color:#fff}
input[type=text],input[type=search],textarea,select{width:100%;background:#000;border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
input[type=text]:focus,textarea:focus,select:focus{border-color:#fff;outline:0}
input[type=file]{width:100%;border:1px dashed var(--line2);border-radius:8px;padding:10px;background:#000;cursor:pointer}
select option{background:#000}
textarea{resize:vertical;min-height:100px}

/* layout */
.wrap{max-width:var(--max);margin:0 auto;padding:28px 16px 72px}
.narrow{max-width:680px}
.hero{padding:36px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-size:clamp(32px,6vw,60px);max-width:16ch}
.hero p{color:var(--mu);margin:14px 0 20px;max-width:46ch;font-size:16px}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.sec-head select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mu)}
.chip:hover{color:#fff;border-color:#fff}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:#fff}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:#000;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:72px;font-weight:800;color:transparent;-webkit-text-stroke:1.5px #fff;line-height:1}
.tag{position:absolute;left:8px;top:8px;background:#fff;color:#000;font-size:12px;font-weight:800;padding:2px 8px;border-radius:4px}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.ctitle{font-weight:800;font-size:17px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle:hover{text-decoration:underline}
.meta{color:var(--mu);font-size:13px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;font-size:13px}
.manage{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.reason{margin-top:8px;font-size:13px;color:var(--bad)}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.badge.approved{color:var(--ok);border-color:#1f5a35}
.badge.pending{color:var(--warn);border-color:#6a5420}
.badge.rejected{color:var(--bad);border-color:#5c2b2b}
.state{text-align:center;padding:64px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mu)}
.state h2{color:#fff}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:32px 16px;text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

/* detail */
.back{display:inline-block;color:var(--mu);margin-bottom:18px;font-weight:600}
.back:hover{color:#fff}
.d-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.d-cover{aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.d-cover img{width:100%;height:100%;object-fit:cover}
.d-cover .ph{font-size:140px}
.d-info h1{font-size:clamp(28px,4vw,42px);margin:6px 0 12px}
.d-info .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-bottom:18px;font-size:14px}
.d-info .facts dt{color:var(--mu)}
.d-info .desc{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:22px;max-width:62ch}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.notice{border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.notice.warn{border-color:#6a5420;color:var(--warn)}
.notice.bad{border-color:#5c2b2b;color:var(--bad)}
.hint{font-size:13px;color:var(--mu);margin-top:12px}

/* profile */
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.profile .avatar{width:72px;height:72px;font-size:28px}
.profile h1{font-size:28px}

/* form */
.form{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.form small{color:var(--mu);font-weight:400}
.form .check{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.cover-prev{width:240px;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cover-prev img{width:100%;height:100%;object-fit:cover}

/* overlays */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
.dlg{background:#000;border:1px solid var(--line2);border-radius:12px;padding:22px;max-width:420px;width:100%}
.dlg h3{font-size:20px;margin-bottom:8px}
.dlg p{color:var(--mu);margin-bottom:20px;overflow-wrap:anywhere}
.dlg-act{display:flex;gap:10px;justify-content:flex-end}
.loader{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);display:grid;place-items:center}
.player{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:52px}
.pbar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player iframe{flex:1;width:100%;border:0;background:#000}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:#fff;color:#000;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 0 0 1px #000}
.toast.error{background:var(--bad)}
.toast.ok{background:var(--ok)}

/* multiplayer */
.nav button{background:none;border:0;cursor:pointer;padding:7px 12px;border-radius:6px;color:var(--mu);font-weight:600;font-size:14px}
.nav button:hover{color:#fff}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line2);background:#000;border-radius:10px;padding:14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:#fff}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice span{color:var(--mu);font-size:13px;font-weight:400}
.dlg input[type=text],.dlg input[type=search]{margin-bottom:12px}
.pick-list{max-height:46vh;overflow:auto;margin-bottom:6px;display:flex;flex-direction:column;gap:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#000;border-radius:8px;padding:10px 12px;cursor:pointer}
.pick:hover{border-color:#fff}
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1px solid #fff;border-radius:12px;padding:16px 20px;margin:22px 0}
.roomcode div{display:flex;flex-direction:column}
.roomcode output{font-size:clamp(34px,10vw,56px);font-weight:800;letter-spacing:.18em;line-height:1.1}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.pcard b{overflow-wrap:anywhere}
.pcard.empty b{color:var(--mu);font-weight:400}
.roomgame{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.roomgame div{display:flex;flex-direction:column;min-width:0}
.mp{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.mp .pane{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
.mp .pane+.pane{border-top:2px solid #fff}
.mp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mp iframe.mirror{pointer-events:none}
.plabel{position:absolute;top:8px;right:8px;z-index:3;background:#000;border:1px solid #fff;border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;max-width:60%}
.plabel b{font-size:13px}
.plabel span{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.you{font-style:normal;font-size:11px;font-weight:800;background:#fff;color:#000;border-radius:4px;padding:0 6px;margin-top:2px}
.mp-ctl{position:absolute;top:8px;left:8px;z-index:3;background:#000}
.cd{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.88);font-size:clamp(80px,22vw,200px);font-weight:800}

/* v3: profil, rating, multiplayer */
.vchk{display:inline-block;vertical-align:-3px;margin-left:4px}
.devtag{display:inline-block;font-size:12px;font-weight:800;background:#fff;color:#000;border-radius:4px;padding:0 8px;margin-left:6px;vertical-align:2px}
.avatar.sm{width:36px;height:36px;font-size:15px}
.avatar.lg{width:84px;height:84px;font-size:32px}
.nameline{display:inline-flex;align-items:center;flex-wrap:wrap}
.rt{display:inline-flex;align-items:center;gap:4px;color:#fff;font-size:13px}
.rt svg{color:#fff}
.tag.mpt{top:auto;bottom:8px}
.rating{margin:0 0 20px;padding:14px;border:1px solid var(--line);border-radius:10px}
.stars{display:flex;gap:4px;margin-bottom:6px}
.star{background:none;border:0;padding:2px;cursor:pointer;color:#3a3a3a;line-height:0}
.star.on{color:#fff}
.star.avg{color:#8a8a8a}
.star:disabled{cursor:default}
.star:not(:disabled):hover{color:#fff}
.rating .txt{font-size:14px}
.doc{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-weight:400}
.doc summary{cursor:pointer;font-weight:600}
.doc pre{background:#000;border:1px solid var(--line);border-radius:6px;padding:10px;overflow:auto;font-size:12px;margin:10px 0;white-space:pre}
.doc p{font-size:13px;color:var(--mu);margin-top:8px}
.doc code,.form small code{background:#161616;padding:0 4px;border-radius:3px}
.avatar-prev{display:flex;align-items:center;gap:12px}
.players{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.pc-top{display:flex;align-items:center;gap:10px;min-width:0}
.pc-name{display:flex;flex-direction:column;min-width:0}
.pc-name b{overflow-wrap:anywhere}
.pc-mic{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:13px;color:var(--mu)}
.pc-mic.on{color:var(--ok)}
.pc-voice{font-size:12px;display:block;margin-top:2px}
.micbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}
.micbar .muted{font-size:13px;flex:1 1 220px}
.roomgame div span.muted{font-size:13px}
.mp.split{background:#000}
.mp.split .pane{background:#000;border-top:0}
.mp.split .pane+.pane{border-top:0}
.mp.split .pane.wide{grid-column:span 2}

.mp-ctls{position:absolute;top:8px;left:8px;z-index:4;display:flex;gap:6px;flex-wrap:wrap}
.mp-ctls .btn{background:rgba(0,0,0,.75)}
.pout{position:absolute;inset:0;z-index:2;display:grid;place-items:center;background:rgba(0,0,0,.72);font-weight:800;font-size:clamp(20px,5vw,34px);pointer-events:none}
/* v4: login email, mute, indikator suara */
input[type=email],input[type=password]{width:100%;background:#000;border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
input[type=email]:focus,input[type=password]:focus{border-color:#fff;outline:0}
.dlg .fl{display:block;font-weight:600;font-size:14px;margin:10px 0 6px}
.dlg .or{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:16px 0 12px}
.dlg .or::before,.dlg .or::after{content:"";flex:1;height:1px;background:var(--line)}
.au-err{color:var(--bad);font-size:13px;margin:10px 0 0!important}
.linkbtn{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-size:13px;margin-top:12px;padding:0}
.linkbtn:hover{color:#fff}
.doc ul{margin:10px 0 0 18px;font-size:14px;color:#fff}
.doc li{margin:4px 0}
.pc-mute{margin-top:8px;align-self:flex-start}
.pcard{transition:border-color .12s,box-shadow .12s}
.pcard.speaking{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e,0 0 18px rgba(34,197,94,.55)}
.pcard.speaking .avatar{box-shadow:0 0 0 3px #22c55e}
.pcard.speaking .pc-mic{color:#22c55e}
.eq{display:none;align-items:flex-end;gap:2px;height:12px;margin-left:2px}
.speaking .eq{display:inline-flex}
.eq i{display:block;width:3px;height:4px;background:#22c55e;border-radius:1px;animation:eq .7s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}
.eq i:nth-child(3){animation-delay:.3s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.plabel.speaking{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e,0 0 14px rgba(34,197,94,.7)}
.vstrip{position:absolute;left:8px;bottom:8px;z-index:4;display:flex;gap:6px;flex-wrap:wrap;max-width:70%;pointer-events:none}
.vchip{background:rgba(0,0,0,.75);border:1px solid var(--line2);border-radius:999px;padding:2px 10px;font-size:12px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vchip.speaking{border-color:#22c55e;box-shadow:0 0 0 2px #22c55e,0 0 12px rgba(34,197,94,.7)}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:8px}}
/* v5: bar ikon, tayangan layar */
.mp-bar{flex:0 0 38px;display:flex;align-items:center;gap:6px;padding:0 6px;background:#000;border-bottom:1px solid var(--line);overflow:hidden}
.ib{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);border-radius:8px;background:#000;color:#fff;cursor:pointer;padding:0}
.ib:hover{border-color:#fff}
.ib svg{width:18px;height:18px}
.ib.on{background:#fff;color:#000;border-color:#fff}
.ib.off{color:var(--bad);border-color:#5c2b2b}
.ib.danger{color:var(--bad);border-color:#5c2b2b}
.mp-bar .vbar{display:flex;gap:6px;margin-left:auto;min-width:0;overflow:hidden}
.mp-body{position:absolute;inset:0}
.mp.split .mp-body{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));grid-template-rows:repeat(var(--rows,2),minmax(0,1fr));gap:2px;background:#fff}
.mp.single .pane.full{position:absolute;inset:0}
.vview{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;z-index:1}
.pnote{position:absolute;left:8px;bottom:8px;z-index:3;font-size:11px;background:rgba(0,0,0,.75);border:1px solid var(--line2);border-radius:6px;padding:1px 8px;color:var(--mu);pointer-events:none}
.plabel{opacity:.88;padding:2px 8px}
/* v6: layar penuh, dock, versi */
.dock{position:absolute;left:0;top:50%;transform:translateY(-50%);z-index:60;display:flex;flex-direction:row-reverse;align-items:center}
.dock-h{width:22px;height:46px;border:1px solid rgba(255,255,255,.35);border-left:0;border-radius:0 12px 12px 0;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;opacity:.5}
.dock-h svg{width:16px;height:16px;transition:transform .15s}
.dock[data-open="1"] .dock-h{opacity:1}
.dock[data-open="1"] .dock-h svg{transform:rotate(180deg)}
.dock-i{display:none;flex-direction:column;gap:6px;padding:6px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.25);border-left:0}
.dock[data-open="1"] .dock-i{display:flex}
.dock .ib{width:34px;height:34px;background:rgba(0,0,0,.6)}
.vchips{position:absolute;top:6px;right:6px;z-index:6;display:flex;gap:6px;pointer-events:none;max-width:80%;flex-wrap:wrap;justify-content:flex-end}
.vchips .vchip{display:none}
.vchips .vchip.speaking{display:inline-block}
.rg-act{display:flex;gap:6px;flex-wrap:wrap}
.vlist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.vlist li{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-top:1px solid var(--line);padding-top:10px}
.vlist li:first-child{border-top:0;padding-top:0}
.vl-main{min-width:0}
.vl-meta{font-size:12px}
.vl-notes{font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.vl-act{display:flex;gap:6px;flex:none}
.facts select{width:auto;max-width:100%;padding:4px 8px}
@media (max-width:860px){
  .top-in{gap:10px}

<script>
(function () {
"use strict";

/* ====================== Konfigurasi ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyBmOQhqoVSowBHT2xLbb2-cgnLNkmAdzcQ",
  authDomain: "caxagamehub.firebaseapp.com",

};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const TS = firebase.database.ServerValue.TIMESTAMP;

// Batas ini HARUS sama dengan yang ada di Security Rules.
const LIMIT = { html: 5 * 1024 * 1024, cover: 45000, titleMin: 3, titleMax: 60, desc: 500, nameMin: 2, nameMax: 30, photo: 13000, verName: 20, verNotes: 300 };
const ADMIN_EMAIL = "kriiaja48@gmail.com"; // hanya untuk tampilan; penegak sebenarnya adalah Security Rules
const GPHOTO_RE = /^https:\/\/lh[0-9]\.googleusercontent\.com\//;
const ID_RE = /^[A-Za-z0-9_-]{6,40}$/;
const VER_RE = /^(v([1-9]|10)|legacy)$/;
const MAX_VERSIONS = 10;
const codePath = (gid, vid) => vid === "legacy" ? "gameCode/" + gid : "gameCodeV/" + gid + "/" + vid;
const ROOM_RE = /^[A-Z2-9]{6}$/;
const ROOM_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 32 karakter, tanpa I dan O
const STATUS = { pending: "Menunggu tinjauan", approved: "Dipublikasikan", rejected: "Ditolak" };

/* ====================== State ====================== */
const state = {
  user: null, authReady: false,
  games: {}, cats: {}, plays: {}, favs: {}, mine: {},
  loaded: { games: false, cats: false, mine: false },
  loadError: "",
  query: "", cat: "", sort: "new",
  detail: null, detailId: null, touched: false,
  room: null, roomId: null, srvOff: 0, disc: {}, leaving: false, seenRoom: null, prevMembers: null,
  profiles: {}, myProfile: null, ratingStats: {}, myRating: null, pendingName: null,

};
let route = { name: "home", id: null };
let detailRef = null, detailCb = null, favRef = null, mineRef = null;
let roomRef = null, roomCb = null, mp = null, profRef = null, refreshT = null, versRef = null, versCb = null;

/* ====================== Util ====================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : "-";
const fmtBytes = n => n >= 1048576 ? (n / 1048576).toFixed(n % 1048576 ? 1 : 0) + " MB" : Math.ceil(n / 1000) + " KB";
const fmtNum = n => new Intl.NumberFormat("id-ID").format(n || 0);
const heart = on => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;

function toast(msg, type) {
  const t = document.createElement("div");
  t.className = "toast " + (type || "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), type === "error" ? 6500 : 3500);
}
let loaderCount = 0;
function showLoader(on) {
  loaderCount = Math.max(0, loaderCount + (on ? 1 : -1));
  $("#loader").hidden = loaderCount === 0;
}
function errMsg(e) {
  const code = (e && e.code ? e.code : "") + "";
  const m = (e && e.message) || String(e);
  if (/permission_denied/i.test(code + m)) return "Ditolak oleh aturan keamanan database. Pastikan Anda sudah masuk dan data memenuhi batas yang ditentukan.";
  if (code === "auth/unauthorized-domain") return "Domain ini belum diizinkan. Tambahkan di Firebase Console, Authentication, Settings, Authorized domains.";
  if (code === "auth/network-request-failed") return "Koneksi bermasalah. Periksa internet Anda.";
  return m || "Terjadi kesalahan.";
}
let lastErrAt = 0;
function onDbErr(e) {
  console.error(e);
  if (Date.now() - lastErrAt > 5000) { lastErrAt = Date.now(); toast(errMsg(e), "error"); }
}
function confirmBox(o) {
  return new Promise(res => {
    const w = document.createElement("div");
    w.className = "backdrop";
    w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p><div class="dlg-act"><button class="btn" data-r="0">Batal</button><button class="btn ${o.danger ? "danger fill" : "primary"}" data-r="1">${esc(o.ok || "Ya")}</button></div></div>`;
    const done = v => { w.remove(); document.removeEventListener("keydown", onKey); res(v); };
    const onKey = e => { if (e.key === "Escape") done(false); };
    w.addEventListener("click", e => {
      const b = e.target.closest("[data-r]");
      if (b) done(b.dataset.r === "1"); else if (e.target === w) done(false);
    });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(w);
    $('[data-r="0"]', w).focus();
  });
}

/* ====================== Data helper ====================== */
const gamesList = () => Object.keys(state.games).map(id => Object.assign({ id }, state.games[id]));
const playsOf = id => state.plays[id] || 0;
const catName = id => (state.cats[id] && state.cats[id].name) || "Tanpa kategori";
const newest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
const popular = (a, b) => playsOf(b.id) - playsOf(a.id) || newest(a, b);

/* ====================== Versi game ====================== */
// Game lama (sebelum ada versi) dianggap satu versi "1.0" yang kodenya tetap di gameCode/{id}.
function versionList(g, raw) {
  const list = Object.keys(raw || {}).filter(k => VER_RE.test(k)).map(k => Object.assign({ vid: k }, raw[k]));
  if (g && !g.versioned && !(raw && raw.legacy)) list.push({ vid: "legacy", name: "1.0", createdAt: g.createdAt, status: "approved", virtual: true });
  return list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
}
const currentVid = g => g.currentVer || "legacy";
const playableVersions = (g, own, raw) => versionList(g, raw).filter(v => v.status === "approved" || own);
function chosenVid(g, own) {
  const list = playableVersions(g, own, state.vers);
  if (state.selVer && list.some(v => v.vid === state.selVer)) return state.selVer;
  const cur = list.find(v => v.vid === currentVid(g));
  return cur ? cur.vid : (list.length ? list[list.length - 1].vid : null);
}
function verNameIn(raw, g, vid) {
  const v = versionList(g, raw).find(x => x.vid === vid);
  return v ? v.name : (vid === "legacy" ? "1.0" : vid);
}
const verPending = {};
function ensureVers(gid) {
  if (!gid || gid in state.verCache || verPending[gid]) return;
  verPending[gid] = 1;
  db.ref("gameVersions/" + gid).once("value")
    .then(s => { state.verCache[gid] = s.val() || {}; })
    .catch(() => { state.verCache[gid] = {}; })
    .then(() => { delete verPending[gid]; refresh(); });
}
async function readGameFile(file) {
  if (!/\.html?$/i.test(file.name)) throw new Error("File harus berformat .html atau .htm.");
  if (file.size > LIMIT.html) throw new Error("Ukuran file " + fmtBytes(file.size) + " melebihi batas " + fmtBytes(LIMIT.html) + ". Kecilkan ukuran gambar atau aset di dalam game.");
  const code = await file.text();
  if (code.length > LIMIT.html) throw new Error("Isi file melebihi batas " + fmtBytes(LIMIT.html) + ".");
  if (!/<\s*(!doctype|html|head|body|script|canvas|div)/i.test(code)) throw new Error("Isi file tidak terlihat seperti dokumen HTML.");
  return code;
}

/* ====================== Profil dan rating (helper) ====================== */
const VERIFIED = '<svg class="vchk" viewBox="0 0 24 24" width="16" height="16" role="img" aria-label="Developer terverifikasi"><title>Developer terverifikasi</title><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><polygon points="12 2.5 14.9 8.8 21.7 9.6 16.6 14.2 18 21 12 17.6 6 21 7.4 14.2 2.3 9.6 9.1 8.8"/></svg>';
const STAR_S = STAR.replace('width="20" height="20"', 'width="14" height="14"');
const isAdminUser = u => !!u && (u.email || "").toLowerCase() === ADMIN_EMAIL && u.emailVerified === true;
const isDev = uid => !!(state.profiles[uid] && state.profiles[uid].dev);
function nameOf(uid, fb) {
  const p = state.profiles[uid];
  return (p && p.name) || fb || "Pengguna";
}
const nameHTML = (uid, fb) => esc(nameOf(uid, fb)) + (isDev(uid) ? VERIFIED : "");
const dispName = u => (u && (u.displayName || state.pendingName || (u.email ? u.email.split("@")[0] : ""))) || "Pengguna";
const myName = () => ((state.myProfile && state.myProfile.name) || dispName(state.user)).trim().slice(0, LIMIT.nameMax) || "Pengguna";
function avatarHTML(uid, name, cls) {
  const p = state.profiles[uid];
  let src = p && p.photo;
  if (!src && state.user && state.user.uid === uid) src = state.user.photoURL;
  const ini = esc((name || nameOf(uid) || "?").trim().charAt(0).toUpperCase());
  return '<span class="avatar ' + (cls || "") + '">' + (src ? '<img src="' + esc(src) + '" alt="" referrerpolicy="no-referrer">' : ini) + "</span>";
}
const profPending = {};
function ensureProfiles(ids) {
  ids.forEach(id => {
    if (!id || id in state.profiles || profPending[id]) return;
    profPending[id] = 1;
    db.ref("profiles/" + id).once("value")
      .then(s => { state.profiles[id] = s.val() || null; })
      .catch(() => { state.profiles[id] = null; })
      .then(() => { delete profPending[id]; refresh(); });
  });
}
function ratingOf(id) {
  const s = state.ratingStats[id];
  return s && s.count > 0 ? { avg: s.sum / s.count, count: s.count } : null;
}
async function ensureProfile(u) {
  try {
    const ref = db.ref("profiles/" + u.uid);
    const snap = await ref.once("value");
    const admin = isAdminUser(u);
    if (!snap.exists()) {
      const rec = { name: (dispName(u).trim().slice(0, LIMIT.nameMax)) || "Pengguna", updatedAt: TS };
      if (u.photoURL && u.photoURL.length <= 500 && GPHOTO_RE.test(u.photoURL)) rec.photo = u.photoURL;
      if (admin) rec.dev = true;
      await ref.set(rec);
    } else if (admin && !snap.val().dev) {
      await ref.update({ dev: true });
    }
  } catch (e) { console.warn("Gagal menyiapkan profil:", e); }
}
function loadMyRating(id) {
  state.myRating = null;
  if (!state.user || !ID_RE.test(id || "")) return;
  const uid = state.user.uid;
  db.ref("ratings/" + id + "/" + uid).once("value").then(s => {
    if (route.name === "game" && route.id === id && state.user && state.user.uid === uid) { state.myRating = s.val(); renderView(); }
  }).catch(() => {});
}
async function rateGame(id, n) {
  const u = state.user, g = state.detail;
  if (!u) { toast("Masuk untuk memberi rating.", "error"); return; }
  if (!g || g.status !== "approved") { toast("Rating hanya untuk game yang sudah dipublikasikan.", "error"); return; }
  if (g.ownerId === u.uid) { toast("Anda tidak dapat menilai game sendiri.", "error"); return; }
  if (!(n >= 1 && n <= 5)) return;
  showLoader(true);
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const res = await Promise.all([db.ref("ratingStats/" + id).once("value"), db.ref("ratings/" + id + "/" + u.uid).once("value")]);
      const st = res[0].val() || { sum: 0, count: 0 };
      const old = res[1].val();
      const up = {};
      up["ratings/" + id + "/" + u.uid] = n;
      up["ratingStats/" + id + "/sum"] = (st.sum || 0) + n - (old || 0);
      up["ratingStats/" + id + "/count"] = (st.count || 0) + (old == null ? 1 : 0);
      try { await db.ref().update(up); state.myRating = n; toast("Rating Anda tersimpan.", "ok"); renderView(); return; }
      catch (e) { if (attempt === 2 || !/permission_denied/i.test((e.code || "") + (e.message || ""))) throw e; }
    }
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

function resizeSquare(file, size, maxChars) {
  return new Promise((res, rej) => {
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) return rej(new Error("Foto harus berupa PNG, JPG, WebP, atau GIF."));
    if (file.size > 8 * 1024 * 1024) return rej(new Error("Foto terlalu besar (maksimal 8 MB sebelum dikecilkan)."));
    loadImg(file).then(im => {
      const steps = [[size, 0.82], [size, 0.7], [Math.round(size * 0.8), 0.6], [Math.round(size * 0.6), 0.5]];
      for (const st of steps) {
        const c = document.createElement("canvas");
        c.width = st[0]; c.height = st[0];
        const x = c.getContext("2d");
        x.fillStyle = "#000"; x.fillRect(0, 0, st[0], st[0]);
        const sc = Math.max(st[0] / im.width, st[0] / im.height);
        const dw = im.width * sc, dh = im.height * sc;
        x.drawImage(im, (st[0] - dw) / 2, (st[0] - dh) / 2, dw, dh);
        const url = c.toDataURL("image/jpeg", st[1]);
        if (url.length <= maxChars) return res(url);
      }
      rej(new Error("Foto terlalu detail untuk dikecilkan. Coba foto lain."));
    }).catch(rej);
  });
}

function editProfileModal() {
  const u = state.user;
  if (!u) return;
  const p = state.myProfile || {};
  const m = modal('<form id="pf-form"><h3>Edit profil</h3><label style="display:block;font-weight:600;font-size:14px;margin-bottom:6px" for="pf-name">Username</label><input type="text" id="pf-name" maxlength="' + LIMIT.nameMax + '" value="' + esc(p.name || u.displayName || "") + '" autocomplete="off"><label style="display:block;font-weight:600;font-size:14px;margin:4px 0 6px" for="pf-photo">Foto profil</label><input type="file" id="pf-photo" accept="image/png,image/jpeg,image/webp,image/gif" style="margin-bottom:10px"><div class="avatar-prev">' + avatarHTML(u.uid, p.name || u.displayName, "lg") + '<label style="display:flex;gap:8px;align-items:center;font-size:14px"><input type="checkbox" id="pf-rm"> Pakai foto Google lagi</label></div><p style="margin:12px 0 0;font-size:13px">Username 2 sampai 30 karakter. Foto dikecilkan otomatis dan disimpan di database.</p><div class="dlg-act"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="pf-save">Simpan</button></div></form>');
  const img = () => $(".avatar-prev .avatar", m.el);
  $("#pf-photo", m.el).addEventListener("change", e => {
    const f = e.target.files[0];
    if (!f) return;
    const url = URL.createObjectURL(f);
    img().innerHTML = '<img alt="" src="' + url + '">';
    $("#pf-rm", m.el).checked = false;
  });
  $("#pf-form", m.el).addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("#pf-name", m.el).value.trim();
    const file = $("#pf-photo", m.el).files[0];
    const rm = $("#pf-rm", m.el).checked;
    if (name.length < LIMIT.nameMin || name.length > LIMIT.nameMax) return toast("Username harus " + LIMIT.nameMin + " sampai " + LIMIT.nameMax + " karakter.", "error");
    $("#pf-save", m.el).disabled = true;
    showLoader(true);
    try {
      const up = {};
      const base = "profiles/" + u.uid + "/";
      up[base + "name"] = name;
      up[base + "updatedAt"] = TS;
      up["users/" + u.uid + "/name"] = name;
      if (file) up[base + "photo"] = await resizeSquare(file, 160, LIMIT.photo);
      else if (rm) up[base + "photo"] = (u.photoURL && u.photoURL.length <= 500 && GPHOTO_RE.test(u.photoURL)) ? u.photoURL : null;
      await db.ref().update(up);
      m.close();
      toast("Profil diperbarui.", "ok");
    } catch (err) { toast(errMsg(err), "error"); $("#pf-save", m.el).disabled = false; }
    finally { showLoader(false); }
  });
}

/* ====================== Auth ====================== */
async function loginGoogle() {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  showLoader(true);
  try {
    await auth.signInWithPopup(p);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await auth.signInWithRedirect(p); } catch (e2) { toast(errMsg(e2), "error"); }
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      toast(errMsg(e), "error");
    }
  } finally { showLoader(false); }
}
function logout() { state.pendingName = null; auth.signOut().catch(e => toast(errMsg(e), "error")); }

function authErr(e) {
  const c = (e && e.code) || "";
  const map = {
    "auth/invalid-email": "Format email tidak valid.",
    "auth/missing-password": "Password wajib diisi.",
    "auth/invalid-credential": "Email atau password salah. Jika dulu Anda masuk dengan Google, gunakan tombol Google.",
    "auth/wrong-password": "Email atau password salah.",
    "auth/user-not-found": "Akun dengan email ini belum terdaftar.",
    "auth/email-already-in-use": "Email ini sudah terdaftar. Silakan masuk.",
    "auth/weak-password": "Password terlalu lemah. Gunakan minimal 6 karakter.",
    "auth/too-many-requests": "Terlalu banyak percobaan. Coba lagi beberapa saat lagi.",
    "auth/operation-not-allowed": "Login email belum diaktifkan. Aktifkan Email/Password di Firebase Console, Authentication, Sign-in method.",
    "auth/user-disabled": "Akun ini dinonaktifkan.",
    "auth/network-request-failed": "Koneksi bermasalah. Periksa internet Anda."
  };
  return map[c] || errMsg(e);
}

// Dialog masuk: Google atau email dan password.
function login() {
  if (state.user) return;
  let mode = "in";
  const m = modal('<h3>Masuk ke Caxa GameHub</h3><button class="btn primary" style="width:100%" data-g>Lanjutkan dengan Google</button><div class="or"><span>atau dengan email</span></div><div class="chips" style="margin-bottom:6px"><button type="button" class="chip on" data-tab="in">Masuk</button><button type="button" class="chip" data-tab="up">Daftar</button></div><form id="au-form" novalidate><div id="au-name-row" hidden><label class="fl" for="au-name">Username</label><input type="text" id="au-name" maxlength="' + LIMIT.nameMax + '" autocomplete="nickname"></div><label class="fl" for="au-email">Email</label><input type="email" id="au-email" autocomplete="email" inputmode="email"><label class="fl" for="au-pass">Password</label><input type="password" id="au-pass" autocomplete="current-password"><p class="au-err" id="au-err" role="alert" hidden></p><div class="dlg-act"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary" id="au-go">Masuk</button></div><button type="button" class="linkbtn" id="au-forgot">Lupa password?</button></form>');
  const q = id => $(id, m.el);
  const showErr = t => { const el = q("#au-err"); el.textContent = t || ""; el.hidden = !t; };
  m.el.addEventListener("click", e => {
    if (e.target.closest("[data-g]")) { m.close(); loginGoogle(); return; }
    const t = e.target.closest("[data-tab]");
    if (!t) return;
    mode = t.dataset.tab;
    m.el.querySelectorAll("[data-tab]").forEach(b => b.classList.toggle("on", b === t));
    q("#au-name-row").hidden = mode !== "up";
    q("#au-go").textContent = mode === "up" ? "Buat akun" : "Masuk";
    q("#au-pass").setAttribute("autocomplete", mode === "up" ? "new-password" : "current-password");
    showErr("");
  });
  q("#au-forgot").addEventListener("click", async () => {
    const email = q("#au-email").value.trim();
    if (!email) { showErr("Isi email Anda dulu, lalu tekan Lupa password."); return; }
    showLoader(true);
    try { await auth.sendPasswordResetEmail(email); showErr(""); toast("Tautan atur ulang password dikirim ke " + email + ".", "ok"); }
    catch (e) { showErr(authErr(e)); }
    finally { showLoader(false); }
  });
  q("#au-form").addEventListener("submit", async e => {
    e.preventDefault();
    const email = q("#au-email").value.trim(), pass = q("#au-pass").value, name = q("#au-name").value.trim();
    if (!email || !pass) { showErr("Email dan password wajib diisi."); return; }
    if (mode === "up" && (name.length < LIMIT.nameMin || name.length > LIMIT.nameMax)) { showErr("Username harus " + LIMIT.nameMin + " sampai " + LIMIT.nameMax + " karakter."); return; }
    if (mode === "up" && pass.length < 6) { showErr("Password minimal 6 karakter."); return; }
    showErr("");
    q("#au-go").disabled = true;
    showLoader(true);
    try {
      if (mode === "in") await auth.signInWithEmailAndPassword(email, pass);
      else {
        state.pendingName = name;
        const cred = await auth.createUserWithEmailAndPassword(email, pass);
        try { await cred.user.updateProfile({ displayName: name }); } catch (_) {}
        cred.user.sendEmailVerification().then(() => toast("Email verifikasi dikirim ke " + email + ".", "ok")).catch(() => {});
      }
      m.close();
    } catch (err) { state.pendingName = null; showErr(authErr(err)); q("#au-go").disabled = false; }
    finally { showLoader(false); }
  });
  q("#au-email").focus();
}

async function ensureUserRecord(u) {
  try {
    const ref = db.ref("users/" + u.uid);
    const snap = await ref.once("value");
    const base = {
      name: dispName(u).slice(0, 100),
      email: u.email ? u.email.slice(0, 200) : null,
      photo: u.photoURL ? u.photoURL.slice(0, 500) : null,
      lastLogin: TS
    };
    if (snap.exists()) await ref.update(base);
    else await ref.set(Object.assign({}, base, { createdAt: TS }));
  } catch (e) { console.warn("Gagal menyimpan data pengguna:", e); }
  await ensureProfile(u);
}

function detachUserListeners() {
  if (favRef) { favRef.off(); favRef = null; }
  if (mineRef) { mineRef.off(); mineRef = null; }
  if (profRef) { profRef.off(); profRef = null; }
  state.favs = {}; state.mine = {}; state.loaded.mine = false; state.myProfile = null;
}
function attachUserListeners(u) {
  favRef = db.ref("favorites/" + u.uid);
  favRef.on("value", s => { state.favs = s.val() || {}; refresh(); }, onDbErr);
  profRef = db.ref("profiles/" + u.uid);
  profRef.on("value", s => { state.myProfile = s.val(); state.profiles[u.uid] = s.val(); renderAuth(); refresh(); }, onDbErr);
  mineRef = db.ref("games").orderByChild("ownerId").equalTo(u.uid);
  mineRef.on("value", s => { state.mine = s.val() || {}; state.loaded.mine = true; refresh(); }, e => { state.loaded.mine = true; onDbErr(e); refresh(); });
}

function renderAuth() {
  const box = $("#auth");
  if (!state.authReady) { box.innerHTML = ""; return; }
  const u = state.user;
  if (!u) { box.innerHTML = '<button class="btn primary" data-act="login">Masuk</button>'; return; }
  box.innerHTML = '<a href="#/profile" title="Profil: ' + esc(myName()) + '" style="display:inline-flex;align-items:center;gap:6px">' + avatarHTML(u.uid, myName()) + (isDev(u.uid) ? VERIFIED : "") + '</a><button class="btn sm hide-sm" data-act="logout">Keluar</button>';
}

/* ====================== Tampilan umum ====================== */
const loadingBlock = t => `<div class="state"><div class="spin"></div><p>${esc(t || "Memuat...")}</p></div>`;
const notFound = t => `<section class="wrap narrow"><div class="state"><h2>Tidak ditemukan</h2><p>${esc(t)}</p><a class="btn primary" href="#/">Kembali ke beranda</a></div></section>`;
const needLogin = t => `<section class="wrap narrow"><div class="state"><h2>Masuk diperlukan</h2><p>${esc(t)}</p><button class="btn primary" data-act="login">Masuk</button></div></section>`;

function coverHTML(g) {
  if (g.cover && String(g.cover).indexOf("data:image/") === 0) return `<img src="${esc(g.cover)}" alt="" loading="lazy">`;
  return `<div class="ph" aria-hidden="true">${esc((g.title || "?").trim().charAt(0).toUpperCase())}</div>`;
}

function cardHTML(g, manage) {
  const id = esc(g.id);
  let foot;
  if (manage) {
    foot = `<div class="manage"><span class="badge ${esc(g.status)}">${esc(STATUS[g.status] || g.status)}</span><span class="grow"></span><a class="btn sm" href="#/update/${id}">Update</a><a class="btn sm" href="#/edit/${id}">Edit</a><button class="btn danger sm" data-act="delete" data-id="${id}">Hapus</button></div>` +
      (g.status === "rejected" && g.reviewNote ? `<p class="reason">Alasan penolakan: ${esc(g.reviewNote)}</p>` : "");
  } else {
    const on = !!state.favs[g.id];
    foot = `<div class="row"><span class="muted">${fmtNum(playsOf(g.id))} dimainkan</span><button class="icon-btn ${on ? "on" : ""}" data-act="fav" data-id="${id}" aria-pressed="${on}" aria-label="${on ? "Hapus dari favorit" : "Tambah ke favorit"}">${heart(on)}</button></div>`;
  }
  const rt = ratingOf(g.id);
  const rtHTML = rt ? `<span class="rt">${STAR_S}${rt.avg.toFixed(1)} (${fmtNum(rt.count)})</span>` : "";
  return `<article class="card"><a class="thumb" href="#/game/${id}">${coverHTML(g)}${g.featured && g.status === "approved" ? '<span class="tag">Unggulan</span>' : ""}${g.multiplayer ? '<span class="tag mpt">Multiplayer</span>' : ""}</a><div class="cbody"><a class="ctitle" href="#/game/${id}" title="${esc(g.title)}">${esc(g.title)}</a><div class="meta"><span>${nameHTML(g.ownerId, g.ownerName)}</span><span>${esc(catName(g.category))}</span>${rtHTML}</div>${foot}</div></article>`;

const gridHTML = (list, manage) => `<div class="grid">${list.map(g => cardHTML(g, manage)).join("")}</div>`;

/* ====================== Beranda ====================== */
function viewHome() {
  if (state.loadError) return `<section class="wrap"><div class="state"><h2>Game tidak dapat dimuat</h2><p>${esc(state.loadError)}</p></div></section>`;
  if (!state.loaded.games) return loadingBlock("Memuat game...");
  const all = gamesList();
  const q = state.query.trim().toLowerCase();
  const cats = Object.keys(state.cats).map(id => ({ id, name: state.cats[id].name || "" })).sort((a, b) => a.name.localeCompare(b.name));
  const chips = `<div class="chips" role="group" aria-label="Kategori"><button class="chip ${!state.cat ? "on" : ""}" data-act="cat" data-id="">Semua</button>${cats.map(c => `<button class="chip ${state.cat === c.id ? "on" : ""}" data-act="cat" data-id="${esc(c.id)}">${esc(c.name)}</button>`).join("")}</div>`;
  let html = "";
  if (!q && !state.cat) {
    html += `<div class="hero"><h1>Mainkan game buatan komunitas.</h1><p>${all.length ? fmtNum(all.length) + " game siap dimainkan langsung di browser, tanpa unduhan." : "Belum ada game yang dipublikasikan."} Punya game HTML sendiri? Bagikan di sini.</p><a class="btn primary" href="#/upload">Unggah game</a></div>`;
  }
  html += chips;
  if (q || state.cat) {
    let list = all.filter(g => (!state.cat || g.category === state.cat) && (!q || ((g.title || "") + " " + (g.description || "") + " " + nameOf(g.ownerId, g.ownerName)).toLowerCase().indexOf(q) !== -1));
    list.sort(state.sort === "pop" ? popular : state.sort === "rate" ? ((a, b) => ((ratingOf(b.id) ? ratingOf(b.id).avg : 0) - (ratingOf(a.id) ? ratingOf(a.id).avg : 0)) || newest(a, b)) : newest);
    html += `<section class="sec"><div class="sec-head"><h2>${fmtNum(list.length)} hasil</h2><select id="sort" aria-label="Urutkan"><option value="new" ${state.sort === "new" ? "selected" : ""}>Terbaru</option><option value="pop" ${state.sort === "pop" ? "selected" : ""}>Terpopuler</option><option value="rate" ${state.sort === "rate" ? "selected" : ""}>Rating tertinggi</option></select></div>${list.length ? gridHTML(list) : '<div class="empty"><p>Tidak ada game yang cocok dengan pencarian atau kategori ini.</p></div>'}</section>`;
  } else if (!all.length) {
    html += `<section class="sec"><div class="empty"><p>Belum ada game. Jadilah yang pertama mengunggah.</p><a class="btn primary" href="#/upload">Unggah game</a></div></section>`;
  } else {
    const feat = all.filter(g => g.featured).sort(newest);
    const pop = all.filter(g => playsOf(g.id) > 0).sort(popular);
    if (feat.length) html += sectionHTML("Unggulan", feat.slice(0, 8));
    html += sectionHTML("Terbaru", all.slice().sort(newest).slice(0, 8));
    if (pop.length) html += sectionHTML("Populer", pop.slice(0, 8));
  }
  return `<section class="wrap">${html}</section>`;
}

function ratingBox(id, g, own, u) {
  const rt = ratingOf(id);
  const mine = state.myRating;
  const dis = !u || own || g.status !== "approved";
  const avgN = rt ? Math.round(rt.avg) : 0;
  const stars = [1, 2, 3, 4, 5].map(n => `<button class="star ${mine ? (n <= mine ? "on" : "") : (n <= avgN ? "avg" : "")}" data-act="rate" data-id="${esc(id)}" data-n="${n}" ${dis ? "disabled" : ""} aria-label="Beri ${n} bintang">${STAR}</button>`).join("");
  let hint;
  if (!u) hint = "Masuk untuk memberi rating.";
  else if (own) hint = "Anda tidak dapat menilai game sendiri.";
  else if (g.status !== "approved") hint = "Rating tersedia setelah game dipublikasikan.";
  else if (mine) hint = "Rating Anda: " + mine + " bintang. Tekan bintang lain untuk mengubah.";
  else hint = "Tekan bintang untuk menilai.";
  return `<div class="rating"><div class="stars" role="group" aria-label="Rating game">${stars}</div><div class="txt">${rt ? "<b>" + rt.avg.toFixed(1) + "</b> dari 5 (" + fmtNum(rt.count) + " penilaian)" : "Belum ada penilaian"}</div><div class="hint" style="margin-top:4px">${esc(hint)}</div></div>`;
}

function bindForm() {
  const f = $("#gform");
  if (!f) return;
  const mark = () => { state.touched = true; };
  f.addEventListener("input", mark);
  f.addEventListener("change", mark);
  const counter = () => { $("#gdesc-c").textContent = f.elements.gdesc.value.length + "/" + LIMIT.desc; };
  f.elements.gdesc.addEventListener("input", counter);
  counter();
  f.elements.gcover.addEventListener("change", () => {
    const file = f.elements.gcover.files[0];
    const box = $("#cover-prev");
    if (!file) return;
    const url = URL.createObjectURL(file);
    box.hidden = false;
    box.innerHTML = '<img alt="Pratinjau sampul">';
    const im = $("img", box);
    im.onload = () => URL.revokeObjectURL(url);
    im.src = url;
  });
  f.addEventListener("submit", e => { e.preventDefault(); submitForm(f); });
}

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Gambar sampul tidak dapat dibaca.")); };
    im.src = url;
  });
}
async function makeCover(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error("Sampul harus berupa PNG, JPG, WebP, atau GIF.");
  if (file.size > 8 * 1024 * 1024) throw new Error("Gambar sampul terlalu besar (maksimal 8 MB sebelum dikecilkan).");
  const im = await loadImg(file);
  const steps = [[480, 0.78], [420, 0.68], [360, 0.6], [300, 0.5], [240, 0.45]];
  for (const st of steps) {
    const w = st[0], h = Math.round(w * 9 / 16);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
    const s = Math.max(w / im.width, h / im.height);
    const dw = im.width * s, dh = im.height * s;
    x.drawImage(im, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const url = c.toDataURL("image/jpeg", st[1]);
    if (url.length <= LIMIT.cover) return url;
  }
  throw new Error("Sampul terlalu detail untuk dikecilkan di bawah " + Math.round(LIMIT.cover / 1000) + " KB. Coba gambar lain.");
}

/* Dock: tombol berupa ikon di tepi kiri layar, bisa dilipat, agar game memenuhi seluruh layar. */
const ico = d => '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + "</svg>";
const icoExit = ico('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>');
const icoFs = ico('<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>');
function dockHTML(items) {
  return '<div class="dock" data-open="0"><button type="button" class="dock-h" data-dock="toggle" aria-label="Menu" title="Menu">' + ico('<path d="M9 18l6-6-6-6"/>') + '</button><div class="dock-i">' + items + "</div></div>";
}
function bindDock(root) {
  const d = $(".dock", root);
  if (!d) return;
  let t = null;
  const set = open => {
    d.dataset.open = open ? "1" : "0";
    clearTimeout(t);
    if (open) t = setTimeout(() => set(false), 5000);
  };
  d.addEventListener("click", e => {
    if (e.target.closest("[data-dock]")) set(d.dataset.open !== "1");
    else if (e.target.closest("button")) set(true);
  });
  set(true);
}

function openPlayer(title, code) {
  const w = document.createElement("div");
  w.className = "player";
  const items = '<button class="ib danger" data-p="close" title="Keluar" aria-label="Keluar">' + icoExit + "</button>" + (document.fullscreenEnabled ? '<button class="ib" data-p="fs" title="Layar penuh" aria-label="Layar penuh">' + icoFs + "</button>" : "");
  w.innerHTML = `<iframe title="${esc(title)}" sandbox="allow-scripts allow-pointer-lock allow-modals" referrerpolicy="no-referrer" allow="fullscreen" allowfullscreen></iframe>` + dockHTML(items);
  const close = () => {
    document.removeEventListener("keydown", onKey);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    w.remove();
    document.body.style.overflow = "";
  };
  const onKey = e => { if (e.key === "Escape" && !document.fullscreenElement) close(); };
  w.addEventListener("click", e => {
    const b = e.target.closest("[data-p]");
    if (!b) return;
    if (b.dataset.p === "close") close();
    else if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else if (w.requestFullscreen) w.requestFullscreen().catch(() => {});
  });
  document.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  document.body.appendChild(w);
  bindDock(w);
  // Tanpa "allow-same-origin": game berjalan di origin terpisah dan tidak bisa
  // membaca halaman, cookie, localStorage, maupun sesi Firebase kita.
  $("iframe", w).srcdoc = code;
}

const MAX_PLAYERS = 5;
const SLOT_KEYS = ["s1", "s2", "s3", "s4", "s5"];
// Isi CUSTOM_ICE dengan server TURN milik Anda agar suara dan tayangan layar tetap tersambung di jaringan yang
// memblokir koneksi langsung (misalnya data seluler). Contoh: { urls: "turn:turn.contoh.com:3478", username: "user", credential: "sandi" }
const CUSTOM_ICE = [];
const ICE_CFG = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }, { urls: "stun:stun1.l.google.com:19302" }].concat(CUSTOM_ICE) };
const JITTER_MS = 120;

function membersList(r) {
  const mem = (r && r.members) || {};
  return Object.keys(mem).map(id => ({
    id: id,
    name: (mem[id] && mem[id].name) || "Pemain",
    slot: parseInt(String((mem[id] && mem[id].slot) || "s9").slice(1), 10) || 9,
    mic: !!(mem[id] && mem[id].mic)
  })).sort((a, b) => a.slot - b.slot);
}

// Mengembalikan id pemenang, "draw", atau null jika ronde belum selesai.
function computeFinish(r) {
  if (!r || r.status !== "playing") return null;
  const ids = Object.keys(r.members || {});
  if (ids.length < 2) return null;
  const out = r.out || {};
  const alive = ids.filter(id => !out[id]);
  if (alive.length === 1) return alive[0];
  if (alive.length === 0) return "draw";
  return null;
}

/* ---- Skrip yang disuntikkan ke iframe game ---- */
// Mode "split": tiap pemain menjalankan game sendiri. Input pemain lokal direkam
// dengan cap waktu lalu diputar ulang di panel pemain lain (role "mirror").
// Mode "single": satu layar penuh; game memakai window.Caxa untuk berkirim pesan.
function caxaShim(cfg) {
  "use strict";
  var role = cfg.role, mode = cfg.mode || "split";
  var post = function (m, t) { try { parent.postMessage(m, "*", t || []); } catch (e) {} };
  var t0 = Date.now(), done = false;

  if (mode === "split" && typeof cfg.seed === "number") {
    var sd = cfg.seed | 0;
    Math.random = function () {
      sd = (sd + 0x6D2B79F5) | 0;
      var t = sd;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var ctxs = [];
  ["AudioContext", "webkitAudioContext"].forEach(function (n) {
    var O = window[n];
    if (!O) return;
    var W = function (a) { var c = new O(a); ctxs.push(c); return c; };
    W.prototype = O.prototype;
    try { window[n] = W; } catch (e) {}
  });

  var RE = /game\s*over|permainan\s*(?:selesai|berakhir)|(?:kamu|anda|you)\s*(?:kalah|lose|lost|died|dead)|you\s*are\s*dead/i;
  function over(force) {
    if (done || role !== "local") return;
    if (!force && Date.now() - t0 < 1500) return;
    done = true;
    post({ caxa: 1, type: "gameover" });
  }

  var msgCbs = [], leaveCbs = [], info = cfg.info || null;
  window.Caxa = {
    role: role,
    multiplayer: mode === "single",
    info: info,
    gameOver: function () { over(true); },
    finish: function (w) { if (mode === "single" && role === "local") post({ caxa: 1, type: "finish", winner: (w == null ? "draw" : String(w)) }); },
    send: function (d) { if (mode === "single") post({ caxa: 1, type: "send", to: null, data: d }); },
    sendTo: function (id, d) { if (mode === "single") post({ caxa: 1, type: "send", to: String(id), data: d }); },
    onMessage: function (f) { if (typeof f === "function") msgCbs.push(f); },
    onPlayerLeave: function (f) { if (typeof f === "function") leaveCbs.push(f); },
    ready: function (f) {
      if (typeof f !== "function") return;
      var go = function () { try { f(info); } catch (e) { console.error(e); } };
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else setTimeout(go, 0);
    }
  };

  if (role === "mirror") {
    try { AudioNode.prototype.connect = function (d) { return d; }; } catch (e) {}
    try { HTMLMediaElement.prototype.play = function () { return Promise.resolve(); }; } catch (e) {}
    window.alert = function () {};
    window.confirm = function () { return false; };
    window.prompt = function () { return null; };
    if (cfg.fps && cfg.fps < 60) {
      var raf = window.requestAnimationFrame.bind(window), caf = window.cancelAnimationFrame.bind(window);
      var tmap = {}, lastF = 0, iv = 1000 / cfg.fps;
      window.requestAnimationFrame = function (cb) {
        var h = raf(function (t) {
          var wait = iv - (t - lastF);
          if (wait > 2) { tmap[h] = setTimeout(function () { delete tmap[h]; lastF = performance.now(); cb(lastF); }, wait); }
          else { lastF = t; cb(t); }
        });
        return h;
      };
      window.cancelAnimationFrame = function (h) { if (tmap[h]) { clearTimeout(tmap[h]); delete tmap[h]; } caf(h); };
    }
  }

  if (role === "local" && mode === "split") {
    var oa = window.alert, oc = window.confirm;
    window.alert = function (m) { if (RE.test(String(m))) over(true); return oa.apply(window, arguments); };
    window.confirm = function (m) { if (RE.test(String(m))) over(true); return oc.apply(window, arguments); };

    // Tayangan layar: bila game memakai <canvas>, kirim cuplikan JPEG agar pemain lain melihat layar aslinya
    // (bukan perkiraan). WebGL dipaksa menyimpan buffer supaya bisa dibaca di luar frame gambar.
    if (cfg.vw) {
      var ogc = HTMLCanvasElement.prototype.getContext;
      HTMLCanvasElement.prototype.getContext = function (t, o) {
        if (typeof t === "string" && /webgl/i.test(t)) { o = Object.assign({}, o || {}); o.preserveDrawingBuffer = true; }
        return ogc.call(this, t, o);
      };
      var vbusy = false, vdead = false, vcv = document.createElement("canvas"), vcx = vcv.getContext("2d");
      var pickCanvas = function () {
        var best = null, area = 0, cs = document.getElementsByTagName("canvas");
        for (var i = 0; i < cs.length; i++) {
          var r = cs[i].getBoundingClientRect(), a = r.width * r.height;
          if (a > area && r.bottom > 0 && r.right > 0 && r.top < innerHeight && r.left < innerWidth) { best = cs[i]; area = a; }
        }

      };
      setInterval(function () {
        if (vbusy || vdead) return;
        var src = pickCanvas();
        if (!src || !src.width || !src.height) return;
        vbusy = true;
        try {
          var r = src.getBoundingClientRect();
          var w = cfg.vw, h = Math.max(2, Math.round(w * r.height / r.width));
          vcv.width = w; vcv.height = h;
          vcx.fillStyle = "#000"; vcx.fillRect(0, 0, w, h);

          vcv.toBlob(function (b) {
            if (!b) { vbusy = false; return; }
            b.arrayBuffer().then(function (buf) { post({ caxa: 1, type: "frame", w: w, h: h, buf: buf }, [buf]); vbusy = false; }, function () { vbusy = false; });

function injectShim(code, cfg) {
  const tag = "<script>(" + caxaShim.toString() + ")(" + JSON.stringify(cfg) + ");<\/script>";
  let m = code.match(/<head(?:\s[^>]*)?>/i) || code.match(/<html(?:\s[^>]*)?>/i);
  if (m) { const i = m.index + m[0].length; return code.slice(0, i) + tag + code.slice(i); }
  m = code.match(/^\s*<!doctype[^>]*>/i);
  if (m) return code.slice(0, m[0].length) + tag + code.slice(m[0].length);
  return tag + code;
}

function genCode() {
  const a = new Uint8Array(6);
  crypto.getRandomValues(a);
  let s = "";
  for (let i = 0; i < a.length; i++) s += ROOM_CHARS[a[i] % 32];
  return s;
}

function modal(html) {
  const w = document.createElement("div");
  w.className = "backdrop";
  w.innerHTML = '<div class="dlg" role="dialog" aria-modal="true">' + html + "</div>";
  const onKey = e => { if (e.key === "Escape") close(); };
  const close = () => { w.remove(); document.removeEventListener("keydown", onKey); };
  w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(w);
  return { el: w, close: close };
}

/* ---- Pilih mode, buat room, gabung room ---- */
function playMenu(id) {
  const g = state.detail;
  if (!g) return;
  const own = !!(state.user && g.ownerId === state.user.uid);
  const vid = chosenVid(g, own);
  if (!vid) { toast("Belum ada versi yang bisa dimainkan.", "error"); return; }
  const ver = versionList(g, state.vers).find(v => v.vid === vid);
  const canRoom = g.status === "approved" && !!ver && ver.status === "approved";
  let roomNote;
  if (!canRoom) roomNote = "Tersedia setelah game dan versi ini dipublikasikan.";
  else if (!state.user) roomNote = "Perlu masuk akun. Buat room lalu bagikan kodenya.";
  else if (g.multiplayer) roomNote = "Hingga 5 pemain dalam satu layar penuh.";
  else roomNote = "Hingga 5 pemain. Layar terbagi, tiap pemain memainkan game sendiri.";
  const m = modal('<h3>Pilih mode permainan</h3><p>' + esc(g.title) + (ver ? ", versi " + esc(ver.name) : "") + '</p><div class="choices"><button class="choice" data-m="solo"><b>Mainkan sendiri</b><span>Satu pemain, langsung mulai.</span></button><button class="choice" data-m="room" ' + (canRoom ? "" : "disabled") + '><b>Mainkan bersama teman</b><span>' + esc(roomNote) + '</span></button></div><div class="dlg-act"><button class="btn" data-close>Batal</button></div>');
  m.el.addEventListener("click", e => {
    const b = e.target.closest("[data-m]");
    if (!b || b.disabled) return;
    m.close();
    if (b.dataset.m === "solo") playGame(id, vid); else createRoom(id, vid);
  });
}

async function createRoom(gameId, vid) {
  const u = state.user;
  if (!u) { toast("Masuk untuk membuat room.", "error"); return; }
  let g = null;
  if (gameId) {
    g = state.detail;
    if (!g || g.status !== "approved") { toast("Hanya game yang sudah dipublikasikan yang bisa dimainkan bersama.", "error"); return; }
  }
  showLoader(true);
  try {
    for (let i = 0; i < 5; i++) {
      const code = genCode();
      const ref = db.ref("rooms/" + code);
      if ((await ref.once("value")).exists()) continue;
      const mem = {};
      mem[u.uid] = { name: myName(), slot: "s1" };
      const room = { hostId: u.uid, status: "waiting", round: 0, createdAt: TS, members: mem, slots: { s1: u.uid } };
      if (g) { room.gameId = gameId; room.gameTitle = g.title; room.gameMulti = !!g.multiplayer; room.gameVer = vid || currentVid(g); }
      await ref.set(room);
      location.hash = "#/room/" + code;
      return;
    }
    throw new Error("Gagal membuat kode room. Coba lagi.");
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

// Dialog Room: buat room dulu (game dipilih belakangan di lobi) atau gabung dengan kode.
function joinModal() {
  if (!state.user) { toast("Masuk untuk memakai room.", "error"); return; }
  const m = modal('<h3>Room multiplayer</h3><p>Buat room baru lalu pilih game di lobi, atau gabung ke room temanmu.</p><div class="choices" id="rm-ch"><button class="choice" data-m="create"><b>Buat room</b><span>Buat room dulu, pilih game belakangan di lobi.</span></button><button class="choice" data-m="join"><b>Gabung room</b><span>Masukkan kode room dari temanmu.</span></button></div><form id="jr-form" hidden><input type="text" id="jr" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kode room" placeholder="KODE" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:26px;font-weight:800"><div class="dlg-act"><button type="button" class="btn" data-back>Kembali</button><button type="submit" class="btn primary">Gabung</button></div></form><div class="dlg-act" id="rm-act"><button class="btn" data-close>Batal</button></div>');
  const show = joinForm => {
    $("#rm-ch", m.el).hidden = joinForm;
    $("#rm-act", m.el).hidden = joinForm;
    $("#jr-form", m.el).hidden = !joinForm;
    if (joinForm) $("#jr", m.el).focus();
  };
  m.el.addEventListener("click", e => {
    const b = e.target.closest("[data-m]");
    if (b) { if (b.dataset.m === "create") { m.close(); createRoom(null); } else show(true); return; }
    if (e.target.closest("[data-back]")) show(false);
  });
  $("#jr-form", m.el).addEventListener("submit", e => { e.preventDefault(); const v = $("#jr", m.el).value; m.close(); joinRoom(v); });
