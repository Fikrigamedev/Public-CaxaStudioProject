<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Caxa GameHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--line:#2b2b2b;--line2:#555;--tx:#fff;--mu:#a3a3a3;
  --ok:#5ee08a;--warn:#f5c04a;--bad:#ff6b6b;--max:1200px;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--tx);font:400 15px/1.55 var(--font);min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
h1,h2,h3{line-height:1.15;letter-spacing:-.02em;font-weight:800}
.muted{color:var(--mu)}
.grow{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:var(--max);margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;letter-spacing:-.03em}
.logo span{font-weight:400;color:var(--mu);margin-left:4px}
.nav{display:flex;gap:2px}
.nav a{padding:7px 12px;border-radius:6px;color:var(--mu);font-weight:600;font-size:14px}
.nav a:hover{color:#fff}
.nav a.on{color:#000;background:#fff}
.search{flex:1;max-width:380px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:0 12px;height:38px}
.search:focus-within{border-color:#fff}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;height:100%}
.search svg{flex:none;color:var(--mu)}
.auth{margin-left:auto;display:flex;align-items:center;gap:10px}
.avatar{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);overflow:hidden;display:grid;place-items:center;font-weight:800;background:#000;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.offline{background:#fff;color:#000;text-align:center;padding:8px 16px;font-weight:600;font-size:14px}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:8px;border:1px solid var(--line2);background:transparent;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{border-color:#fff}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.primary:hover{background:#d4d4d4}
.btn.danger{color:var(--bad);border-color:#5c2b2b}
.btn.danger:hover{border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:#000;border-color:var(--bad)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{background:none;border:1px solid var(--line);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--mu)}
.icon-btn:hover{color:#fff;border-color:#fff}
.icon-btn.on{color:#000;background:#fff;border-color:#fff}
input[type=text],input[type=search],textarea,select{width:100%;background:#000;border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
input[type=text]:focus,textarea:focus,select:focus{border-color:#fff;outline:0}
input[type=file]{width:100%;border:1px dashed var(--line2);border-radius:8px;padding:10px;background:#000;cursor:pointer}
select option{background:#000}
textarea{resize:vertical;min-height:100px}

/* layout */
.wrap{max-width:var(--max);margin:0 auto;padding:28px 16px 72px}
.narrow{max-width:680px}
.hero{padding:36px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1{font-size:clamp(32px,6vw,60px);max-width:16ch}
.hero p{color:var(--mu);margin:14px 0 20px;max-width:46ch;font-size:16px}
.sec{margin-top:36px}
.sec-head{display:flex;align-items:center;gap:12px;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap}
.sec-head h2{font-size:22px}
.sec-head select{width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mu)}
.chip:hover{color:#fff;border-color:#fff}
.chip.on{background:#fff;color:#000;border-color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.card{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;display:flex;flex-direction:column;transition:border-color .15s}
.card:hover{border-color:#fff}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:#000;border-bottom:1px solid var(--line);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.ph{width:100%;height:100%;display:grid;place-items:center;font-size:72px;font-weight:800;color:transparent;-webkit-text-stroke:1.5px #fff;line-height:1}
.tag{position:absolute;left:8px;top:8px;background:#fff;color:#000;font-size:12px;font-weight:800;padding:2px 8px;border-radius:4px}
.cbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.ctitle{font-weight:800;font-size:17px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctitle:hover{text-decoration:underline}
.meta{color:var(--mu);font-size:13px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px;font-size:13px}
.manage{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;flex-wrap:wrap}
.reason{margin-top:8px;font-size:13px;color:var(--bad)}
.badge{font-size:12px;font-weight:600;border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.badge.approved{color:var(--ok);border-color:#1f5a35}
.badge.pending{color:var(--warn);border-color:#6a5420}
.badge.rejected{color:var(--bad);border-color:#5c2b2b}
.state{text-align:center;padding:64px 16px;display:flex;flex-direction:column;align-items:center;gap:14px;color:var(--mu)}
.state h2{color:#fff}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:32px 16px;text-align:center;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:12px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2s}}

/* detail */
.back{display:inline-block;color:var(--mu);margin-bottom:18px;font-weight:600}
.back:hover{color:#fff}
.d-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:start}
.d-cover{aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.d-cover img{width:100%;height:100%;object-fit:cover}
.d-cover .ph{font-size:140px}
.d-info h1{font-size:clamp(28px,4vw,42px);margin:6px 0 12px}
.d-info .facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin-bottom:18px;font-size:14px}
.d-info .facts dt{color:var(--mu)}
.d-info .desc{white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:22px;max-width:62ch}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.notice{border:1px solid var(--line2);border-radius:8px;padding:12px 14px;margin-bottom:18px;font-size:14px}
.notice.warn{border-color:#6a5420;color:var(--warn)}
.notice.bad{border-color:#5c2b2b;color:var(--bad)}
.hint{font-size:13px;color:var(--mu);margin-top:12px}

/* profile */
.profile{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:20px;border-bottom:1px solid var(--line)}
.profile .avatar{width:72px;height:72px;font-size:28px}
.profile h1{font-size:28px}

/* form */
.form{display:flex;flex-direction:column;gap:18px;margin-top:20px}
.form label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.form small{color:var(--mu);font-weight:400}
.form .check{flex-direction:row;align-items:center;gap:8px;font-weight:400}
.cover-prev{width:240px;max-width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cover-prev img{width:100%;height:100%;object-fit:cover}

/* overlays */
.backdrop{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.85);display:grid;place-items:center;padding:16px}
.dlg{background:#000;border:1px solid var(--line2);border-radius:12px;padding:22px;max-width:420px;width:100%}
.dlg h3{font-size:20px;margin-bottom:8px}
.dlg p{color:var(--mu);margin-bottom:20px;overflow-wrap:anywhere}
.dlg-act{display:flex;gap:10px;justify-content:flex-end}
.loader{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);display:grid;place-items:center}
.player{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);min-height:52px}
.pbar strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player iframe{flex:1;width:100%;border:0;background:#000}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:#fff;color:#000;padding:12px 16px;border-radius:8px;font-weight:600;font-size:14px;box-shadow:0 0 0 1px #000}
.toast.error{background:var(--bad)}
.toast.ok{background:var(--ok)}

/* multiplayer */
.nav button{background:none;border:0;cursor:pointer;padding:7px 12px;border-radius:6px;color:var(--mu);font-weight:600;font-size:14px}
.nav button:hover{color:#fff}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.choice{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line2);background:#000;border-radius:10px;padding:14px;cursor:pointer}
.choice:hover:not(:disabled){border-color:#fff}
.choice:disabled{opacity:.5;cursor:not-allowed}
.choice span{color:var(--mu);font-size:13px;font-weight:400}
.dlg input[type=text],.dlg input[type=search]{margin-bottom:12px}
.pick-list{max-height:46vh;overflow:auto;margin-bottom:6px;display:flex;flex-direction:column;gap:6px}
.pick{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:#000;border-radius:8px;padding:10px 12px;cursor:pointer}
.pick:hover{border-color:#fff}
.roomcode{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border:1px solid #fff;border-radius:12px;padding:16px 20px;margin:22px 0}
.roomcode div{display:flex;flex-direction:column}
.roomcode output{font-size:clamp(34px,10vw,56px);font-weight:800;letter-spacing:.18em;line-height:1.1}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;min-width:0}
.pcard b{overflow-wrap:anywhere}
.pcard.empty b{color:var(--mu);font-weight:400}
.roomgame{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.roomgame div{display:flex;flex-direction:column;min-width:0}
.mp{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column}
.mp .pane{position:relative;flex:1 1 0;min-height:0;overflow:hidden}
.mp .pane+.pane{border-top:2px solid #fff}
.mp iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000}
.mp iframe.mirror{pointer-events:none}
.plabel{position:absolute;top:8px;right:8px;z-index:3;background:#000;border:1px solid #fff;border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;align-items:flex-end;pointer-events:none;max-width:60%}
.plabel b{font-size:13px}
.plabel span{font-size:12px;color:var(--mu);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.you{font-style:normal;font-size:11px;font-weight:800;background:#fff;color:#000;border-radius:4px;padding:0 6px;margin-top:2px}
.mp-ctl{position:absolute;top:8px;left:8px;z-index:3;background:#000}
.cd{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:rgba(0,0,0,.88);font-size:clamp(80px,22vw,200px);font-weight:800}

@media (max-width:860px){
  .top-in{gap:10px}
  .search{order:5;flex:1 1 100%;max-width:none}
  .nav{order:4;flex:1 1 100%;overflow-x:auto}
  .d-grid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .ph{font-size:48px}
  .d-cover .ph{font-size:96px}
  .cbody{padding:10px}
  .ctitle{font-size:15px}
  .hide-sm{display:none}
}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <a class="logo" href="#/">Caxa<span>GameHub</span></a>
    <nav class="nav" aria-label="Navigasi utama">
      <a href="#/" data-nav="home">Beranda</a>
      <a href="#/favorites" data-nav="favorites">Favorit</a>
      <a href="#/upload" data-nav="upload">Unggah game</a>
      <button type="button" data-act="join-room">Gabung room</button>
    </nav>
    <label class="search">
      <span class="sr">Cari game</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari nama, deskripsi, atau pembuat" autocomplete="off" maxlength="60">
    </label>
    <div class="auth" id="auth"></div>
  </div>
</header>
<div id="offline" class="offline" hidden>Tidak terhubung ke database. Mencoba menyambung kembali.</div>

<main id="view"></main>

<div id="toasts" aria-live="polite"></div>
<div id="loader" class="loader" hidden><div class="spin"></div></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
"use strict";

/* ====================== Konfigurasi ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyBmOQhqoVSowBHT2xLbb2-cgnLNkmAdzcQ",
  authDomain: "caxagamehub.firebaseapp.com",
  databaseURL: "https://caxagamehub-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "caxagamehub",
  storageBucket: "caxagamehub.firebasestorage.app",
  messagingSenderId: "44522670946",
  appId: "1:44522670946:web:28352e68beb8a39f3f7a3b"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();
const TS = firebase.database.ServerValue.TIMESTAMP;

// Batas ini HARUS sama dengan yang ada di Security Rules.
const LIMIT = { html: 250000, cover: 45000, titleMin: 3, titleMax: 60, desc: 500 };
const ID_RE = /^[A-Za-z0-9_-]{6,40}$/;
const ROOM_RE = /^[A-Z2-9]{6}$/;
const ROOM_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // 32 karakter, tanpa I dan O
const STATUS = { pending: "Menunggu tinjauan", approved: "Dipublikasikan", rejected: "Ditolak" };

/* ====================== State ====================== */
const state = {
  user: null, authReady: false,
  games: {}, cats: {}, plays: {}, favs: {}, mine: {},
  loaded: { games: false, cats: false, mine: false },
  loadError: "",
  query: "", cat: "", sort: "new",
  detail: null, detailId: null, touched: false,
  room: null, roomId: null, srvOff: 0, disc: {}, leaving: false, seenRoom: null, prevGuest: null
};
let route = { name: "home", id: null };
let detailRef = null, detailCb = null, favRef = null, mineRef = null;
let roomRef = null, roomCb = null, mp = null;

/* ====================== Util ====================== */
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtDate = ts => ts ? new Date(ts).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" }) : "-";
const fmtNum = n => new Intl.NumberFormat("id-ID").format(n || 0);
const heart = on => `<svg width="18" height="18" viewBox="0 0 24 24" fill="${on ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;

function toast(msg, type) {
  const t = document.createElement("div");
  t.className = "toast " + (type || "");
  t.textContent = msg;
  $("#toasts").appendChild(t);
  setTimeout(() => t.remove(), type === "error" ? 6500 : 3500);
}
let loaderCount = 0;
function showLoader(on) {
  loaderCount = Math.max(0, loaderCount + (on ? 1 : -1));
  $("#loader").hidden = loaderCount === 0;
}
function errMsg(e) {
  const code = (e && e.code ? e.code : "") + "";
  const m = (e && e.message) || String(e);
  if (/permission_denied/i.test(code + m)) return "Ditolak oleh aturan keamanan database. Pastikan Anda sudah masuk dan data memenuhi batas yang ditentukan.";
  if (code === "auth/unauthorized-domain") return "Domain ini belum diizinkan. Tambahkan di Firebase Console, Authentication, Settings, Authorized domains.";
  if (code === "auth/network-request-failed") return "Koneksi bermasalah. Periksa internet Anda.";
  return m || "Terjadi kesalahan.";
}
let lastErrAt = 0;
function onDbErr(e) {
  console.error(e);
  if (Date.now() - lastErrAt > 5000) { lastErrAt = Date.now(); toast(errMsg(e), "error"); }
}
function confirmBox(o) {
  return new Promise(res => {
    const w = document.createElement("div");
    w.className = "backdrop";
    w.innerHTML = `<div class="dlg" role="dialog" aria-modal="true"><h3>${esc(o.title)}</h3><p>${esc(o.text)}</p><div class="dlg-act"><button class="btn" data-r="0">Batal</button><button class="btn ${o.danger ? "danger fill" : "primary"}" data-r="1">${esc(o.ok || "Ya")}</button></div></div>`;
    const done = v => { w.remove(); document.removeEventListener("keydown", onKey); res(v); };
    const onKey = e => { if (e.key === "Escape") done(false); };
    w.addEventListener("click", e => {
      const b = e.target.closest("[data-r]");
      if (b) done(b.dataset.r === "1"); else if (e.target === w) done(false);
    });
    document.addEventListener("keydown", onKey);
    document.body.appendChild(w);
    $('[data-r="0"]', w).focus();
  });
}

/* ====================== Data helper ====================== */
const gamesList = () => Object.keys(state.games).map(id => Object.assign({ id }, state.games[id]));
const playsOf = id => state.plays[id] || 0;
const catName = id => (state.cats[id] && state.cats[id].name) || "Tanpa kategori";
const newest = (a, b) => (b.createdAt || 0) - (a.createdAt || 0);
const popular = (a, b) => playsOf(b.id) - playsOf(a.id) || newest(a, b);

/* ====================== Auth ====================== */
async function login() {
  const p = new firebase.auth.GoogleAuthProvider();
  p.setCustomParameters({ prompt: "select_account" });
  showLoader(true);
  try {
    await auth.signInWithPopup(p);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      try { await auth.signInWithRedirect(p); } catch (e2) { toast(errMsg(e2), "error"); }
    } else if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") {
      toast(errMsg(e), "error");
    }
  } finally { showLoader(false); }
}
function logout() { auth.signOut().catch(e => toast(errMsg(e), "error")); }

async function ensureUserRecord(u) {
  try {
    const ref = db.ref("users/" + u.uid);
    const snap = await ref.once("value");
    const base = {
      name: (u.displayName || "Pengguna").slice(0, 100),
      email: u.email ? u.email.slice(0, 200) : null,
      photo: u.photoURL ? u.photoURL.slice(0, 500) : null,
      lastLogin: TS
    };
    if (snap.exists()) await ref.update(base);
    else await ref.set(Object.assign({}, base, { createdAt: TS }));
  } catch (e) { console.warn("Gagal menyimpan data pengguna:", e); }
}

function detachUserListeners() {
  if (favRef) { favRef.off(); favRef = null; }
  if (mineRef) { mineRef.off(); mineRef = null; }
  state.favs = {}; state.mine = {}; state.loaded.mine = false;
}
function attachUserListeners(u) {
  favRef = db.ref("favorites/" + u.uid);
  favRef.on("value", s => { state.favs = s.val() || {}; refresh(); }, onDbErr);
  mineRef = db.ref("games").orderByChild("ownerId").equalTo(u.uid);
  mineRef.on("value", s => { state.mine = s.val() || {}; state.loaded.mine = true; refresh(); }, e => { state.loaded.mine = true; onDbErr(e); refresh(); });
}

  if (!state.loaded.games) return loadingBlock("Memuat game...");
  const all = gamesList();

    html += `<div class="hero"><h1>Mainkan game buatan komunitas.</h1><p>${all.length ? fmtNum(all.length) + " game siap dimainkan langsung di browser, tanpa unduhan." : "Belum ada game yang dipublikasikan."} Punya game HTML sendiri? Bagikan di sini.</p><a class="btn primary" href="#/upload">Unggah game</a></div>`;
  }
  html += chips;
  if (q || state.cat) {
    let list = all.filter(g => (!state.cat || g.category === state.cat) && (!q || ((g.title || "") + " " + (g.description || "") + " " + (g.ownerName || "")).toLowerCase().indexOf(q) !== -1));
    list.sort(state.sort === "pop" ? popular : newest);
    html += `<section class="sec"><div class="sec-head"><h2>${fmtNum(list.length)} hasil</h2><select id="sort" aria-label="Urutkan"><option value="new" ${state.sort === "new" ? "selected" : ""}>Terbaru</option><option value="pop" ${state.sort === "pop" ? "selected" : ""}>Terpopuler</option></select></div>${list.length ? gridHTML(list) : '<div class="empty"><p>Tidak ada game yang cocok dengan pencarian atau kategori ini.</p></div>'}</section>`;
  } else if (!all.length) {
    html += `<section class="sec"><div class="empty"><p>Belum ada game. Jadilah yang pertama mengunggah.</p><a class="btn primary" href="#/upload">Unggah game</a></div></section>`;
  } else {
    const feat = all.filter(g => g.featured).sort(newest);

  }
  return `<section class="wrap">${html}</section>`;
}

function bindForm() {
  const f = $("#gform");
  if (!f) return;
  const mark = () => { state.touched = true; };
  f.addEventListener("input", mark);
  f.addEventListener("change", mark);
  const counter = () => { $("#gdesc-c").textContent = f.elements.gdesc.value.length + "/" + LIMIT.desc; };
  f.elements.gdesc.addEventListener("input", counter);
  counter();
  f.elements.gcover.addEventListener("change", () => {
    const file = f.elements.gcover.files[0];
    const box = $("#cover-prev");
    if (!file) return;
    const url = URL.createObjectURL(file);
    box.hidden = false;
    box.innerHTML = '<img alt="Pratinjau sampul">';
    const im = $("img", box);
    im.onload = () => URL.revokeObjectURL(url);
    im.src = url;
  });
  f.addEventListener("submit", e => { e.preventDefault(); submitForm(f); });
}

function loadImg(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const im = new Image();
    im.onload = () => { URL.revokeObjectURL(url); res(im); };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error("Gambar sampul tidak dapat dibaca.")); };
    im.src = url;
  });
}
async function makeCover(file) {
  if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) throw new Error("Sampul harus berupa PNG, JPG, WebP, atau GIF.");
  if (file.size > 8 * 1024 * 1024) throw new Error("Gambar sampul terlalu besar (maksimal 8 MB sebelum dikecilkan).");
  const im = await loadImg(file);
  const steps = [[480, 0.78], [420, 0.68], [360, 0.6], [300, 0.5], [240, 0.45]];
  for (const st of steps) {
    const w = st[0], h = Math.round(w * 9 / 16);
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    const x = c.getContext("2d");
    x.fillStyle = "#000"; x.fillRect(0, 0, w, h);
    const s = Math.max(w / im.width, h / im.height);
    const dw = im.width * s, dh = im.height * s;
    x.drawImage(im, (w - dw) / 2, (h - dh) / 2, dw, dh);
    const url = c.toDataURL("image/jpeg", st[1]);
    if (url.length <= LIMIT.cover) return url;
  }
  throw new Error("Sampul terlalu detail untuk dikecilkan di bawah " + Math.round(LIMIT.cover / 1000) + " KB. Coba gambar lain.");
}

async function submitForm(f) {
  const u = state.user;
  if (!u) { toast("Anda harus masuk terlebih dahulu.", "error"); return; }
  const editing = route.name === "edit";
  const id = editing ? route.id : null;
  const el = f.elements;
  const title = el.gtitle.value.trim();
  const desc = el.gdesc.value.trim();
  const cat = el.gcat.value;
  const file = el.gfile.files[0];
  const coverFile = el.gcover.files[0];

  if (title.length < LIMIT.titleMin || title.length > LIMIT.titleMax) return toast("Nama game harus " + LIMIT.titleMin + " sampai " + LIMIT.titleMax + " karakter.", "error");
  if (desc.length > LIMIT.desc) return toast("Deskripsi maksimal " + LIMIT.desc + " karakter.", "error");
  if (!state.cats[cat]) return toast("Pilih kategori.", "error");
  if (!editing && !file) return toast("Pilih file HTML game.", "error");

  if (editing && state.mine[id] && state.mine[id].status === "approved") {
    const ok = await confirmBox({ title: "Kirim ulang untuk ditinjau?", text: "Game akan disembunyikan dari publik sampai admin menyetujui perubahan Anda.", ok: "Simpan perubahan" });
    if (!ok) return;
  }

  const btn = $("#gsubmit");
  btn.disabled = true;
  showLoader(true);
  try {
    let code = null, cover = null;
    if (file) {
      if (!/\.html?$/i.test(file.name)) throw new Error("File harus berformat .html atau .htm.");
      if (file.size > LIMIT.html) throw new Error("Ukuran file " + Math.ceil(file.size / 1000) + " KB melebihi batas " + Math.round(LIMIT.html / 1000) + " KB. Kecilkan ukuran gambar atau aset di dalam game.");
      code = await file.text();
      if (code.length > LIMIT.html) throw new Error("Isi file melebihi batas " + Math.round(LIMIT.html / 1000) + " KB.");
      if (!/<\s*(!doctype|html|head|body|script|canvas|div)/i.test(code)) throw new Error("Isi file tidak terlihat seperti dokumen HTML.");
    }
    if (coverFile) cover = await makeCover(coverFile);

    const up = {};
    if (editing) {
      const base = "games/" + id + "/";
      up[base + "title"] = title;
      up[base + "description"] = desc || null;
      up[base + "category"] = cat;
      up[base + "status"] = "pending";
      up[base + "reviewNote"] = null;
      up[base + "updatedAt"] = TS;
      if (cover) up[base + "cover"] = cover;
      else if (el.rmcover && el.rmcover.checked) up[base + "cover"] = null;
      if (code) up["gameCode/" + id] = code;
    } else {
      const newId = db.ref("games").push().key;
      const rec = { ownerId: u.uid, ownerName: (u.displayName || "Pengguna").slice(0, 100), title: title, category: cat, status: "pending", featured: false, createdAt: TS, updatedAt: TS };
      if (desc) rec.description = desc;
      if (cover) rec.cover = cover;
      up["games/" + newId] = rec;
      up["gameCode/" + newId] = code;
    }
    await db.ref().update(up);
    toast(editing ? "Perubahan dikirim untuk ditinjau." : "Game dikirim. Admin akan meninjau sebelum dipublikasikan.", "ok");
    location.hash = "#/profile";
  } catch (e) {
    toast(errMsg(e), "error");
  } finally {
    showLoader(false);
    btn.disabled = false;
  }
}

/* ====================== Aksi ====================== */
async function toggleFav(id) {
  if (!state.user) { toast("Masuk dengan Google untuk menyimpan favorit.", "error"); return; }
  if (!ID_RE.test(id)) return;
  const ref = db.ref("favorites/" + state.user.uid + "/" + id);
  try {
    if (state.favs[id]) await ref.remove(); else await ref.set(TS);
  } catch (e) { toast(errMsg(e), "error"); }
}

async function deleteGame(id) {
  if (!state.user || !ID_RE.test(id)) return;
  const g = state.mine[id] || state.detail;
  const ok = await confirmBox({ title: "Hapus game ini?", text: 'Game "' + ((g && g.title) || "") + '" akan dihapus permanen dari database. Tindakan ini tidak dapat dibatalkan.', ok: "Hapus permanen", danger: true });
  if (!ok) return;
  showLoader(true);
  try {
    const up = {};
    up["games/" + id] = null;
    up["gameCode/" + id] = null;
    up["plays/" + id] = null;
    up["favorites/" + state.user.uid + "/" + id] = null;
    await db.ref().update(up);
    toast("Game dihapus.", "ok");
    if (route.name === "game") location.hash = "#/profile";
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

async function share(id) {
  const url = location.href.split("#")[0] + "#/game/" + id;
  const title = state.detail && state.detail.title ? state.detail.title : "Caxa GameHub";
  try {
    if (navigator.share) { await navigator.share({ title: title, url: url }); return; }
    await navigator.clipboard.writeText(url);
    toast("Tautan disalin.", "ok");
  } catch (e) {
    if (e && e.name === "AbortError") return;
    window.prompt("Salin tautan game ini:", url);
  }
}

function countPlay(id, g) {
  if (!state.user || !g || g.status !== "approved") return;
  const key = "caxa_played_" + id;
  try {
    if (sessionStorage.getItem(key)) return;
    sessionStorage.setItem(key, "1");
  } catch (_) { /* abaikan */ }
  db.ref("plays/" + id).transaction(c => (c || 0) + 1).catch(() => {});
}

async function playGame(id) {
  if (!ID_RE.test(id)) return;
  const g = state.detail;
  showLoader(true);
  try {
    const snap = await db.ref("gameCode/" + id).once("value");
    const code = snap.val();
    if (typeof code !== "string" || !code) throw new Error("Kode game tidak tersedia atau belum dipublikasikan.");
    openPlayer((g && g.title) || "Game", code);
    countPlay(id, g);
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

function openPlayer(title, code) {
  const w = document.createElement("div");
  w.className = "player";
  w.innerHTML = `<div class="pbar"><strong>${esc(title)}</strong>${document.fullscreenEnabled ? '<button class="btn sm" data-p="fs">Layar penuh</button>' : ""}<button class="btn primary sm" data-p="close">Tutup</button></div><iframe title="${esc(title)}" sandbox="allow-scripts allow-pointer-lock allow-modals" referrerpolicy="no-referrer" allow="fullscreen" allowfullscreen></iframe>`;
  const close = () => {
    document.removeEventListener("keydown", onKey);
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    w.remove();
    document.body.style.overflow = "";
  };
  const onKey = e => { if (e.key === "Escape" && !document.fullscreenElement) close(); };
  w.addEventListener("click", e => {
    const b = e.target.closest("[data-p]");
    if (!b) return;
    if (b.dataset.p === "close") close();
    else if (w.requestFullscreen) w.requestFullscreen().catch(() => {});
  });
  document.addEventListener("keydown", onKey);
  document.body.style.overflow = "hidden";
  document.body.appendChild(w);
  // Tanpa "allow-same-origin": game berjalan di origin terpisah dan tidak bisa
  // membaca halaman, cookie, localStorage, maupun sesi Firebase kita.
  $("iframe", w).srcdoc = code;
}

/* ====================== Multiplayer ====================== */
// Skrip kecil yang disuntikkan ke dalam iframe game saat mode multiplayer.
// Fungsinya: (1) acak yang sama untuk kedua pemain (seed), (2) merekam input
// pemain lokal, (3) memutar ulang input lawan di panel lawan, (4) mendeteksi game over.
function caxaShim(cfg) {
  "use strict";
  var role = cfg.role;
  var post = function (m) { try { parent.postMessage(m, "*"); } catch (e) {} };
  var t0 = Date.now(), done = false;

  if (typeof cfg.seed === "number") {
    var sd = cfg.seed | 0;
    Math.random = function () {
      sd = (sd + 0x6D2B79F5) | 0;
      var t = sd;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var ctxs = [];
  ["AudioContext", "webkitAudioContext"].forEach(function (n) {
    var O = window[n];
    if (!O) return;
    var W = function (a) { var c = new O(a); ctxs.push(c); return c; };
    W.prototype = O.prototype;
    try { window[n] = W; } catch (e) {}
  });

  var RE = /game\s*over|permainan\s*(?:selesai|berakhir)|(?:kamu|anda|you)\s*(?:kalah|lose|lost|died|dead)|you\s*are\s*dead/i;
  function over(force) {
    if (done || role !== "local") return;
    if (!force && Date.now() - t0 < 1500) return;
    done = true;
    post({ caxa: 1, type: "gameover" });
  }
  window.Caxa = { role: role, multiplayer: true, gameOver: function () { over(true); } };

  if (role === "mirror") {
    try { AudioNode.prototype.connect = function (d) { return d; }; } catch (e) {}
    try { HTMLMediaElement.prototype.play = function () { return Promise.resolve(); }; } catch (e) {}
    window.alert = function () {};
    window.confirm = function () { return false; };
    window.prompt = function () { return null; };
  }

  if (role === "local") {
    var oa = window.alert, oc = window.confirm;
    window.alert = function (m) { if (RE.test(String(m))) over(true); return oa.apply(window, arguments); };
    window.confirm = function (m) { if (RE.test(String(m))) over(true); return oc.apply(window, arguments); };

    // Perekaman input
    var buf = [], timer = null;
    var flush = function () { timer = null; if (buf.length) { post({ caxa: 1, type: "input", ev: buf }); buf = []; } };
    var push = function (o) {
      var l = buf[buf.length - 1];
      if (l && l.t === o.t && /move$/.test(o.t)) buf[buf.length - 1] = o; else buf.push(o);
      if (buf.length >= 40) flush(); else if (!timer) timer = setTimeout(flush, 80);
    };
    var tl = function (a) {
      var r = [];
      for (var i = 0; a && i < a.length && i < 5; i++) r.push({ i: a[i].identifier, x: a[i].clientX / innerWidth, y: a[i].clientY / innerHeight });
      return r;
    };
    var ser = function (e) {
      var o = { t: e.type };
      if (e.type === "keydown" || e.type === "keyup") {
        if (e.repeat) return null;
        o.k = e.key; o.c = e.code; o.kc = e.keyCode;
        o.m = (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0);
      } else if (e.type.indexOf("touch") === 0) {
        o.ts = tl(e.touches); o.cs = tl(e.changedTouches);
      } else {
        o.x = e.clientX / innerWidth; o.y = e.clientY / innerHeight; o.b = e.button; o.bs = e.buttons;
      }
      return o;
    };
    ["keydown", "keyup", "mousedown", "mouseup", "mousemove", "click", "touchstart", "touchmove", "touchend", "touchcancel", "pointerdown", "pointerup", "pointermove"].forEach(function (t) {
      window.addEventListener(t, function (e) { var o = ser(e); if (o) push(o); }, { capture: true, passive: true });
    });

    // Deteksi game over dari teks yang tampil di layar (upaya terbaik).
    var ignore = [], baselined = false, tm = null;
    var shown = function (el) {
      for (var p = el, n = 0; p && p !== document.documentElement && n < 8; p = p.parentElement, n++) {
        if (parseFloat(getComputedStyle(p).opacity) < 0.05) return false;
      }
      var r = el.getBoundingClientRect();
      if (r.width < 1 || r.height < 1 || r.bottom < 0 || r.right < 0 || r.top > innerHeight || r.left > innerWidth) return false;
      var cs = getComputedStyle(el);
      return cs.display !== "none" && cs.visibility !== "hidden";
    };
    var scan = function () {
      if (done || !document.body || Date.now() - t0 < 1500) return;
      var w = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT, null);
      var n, c = 0, found = [];
      while ((n = w.nextNode()) && c++ < 3000) {
        var p = n.parentElement;
        if (!p || /^(SCRIPT|STYLE|NOSCRIPT|TEXTAREA|OPTION)$/.test(p.tagName)) continue;
        if (RE.test(n.nodeValue) && shown(p)) found.push(n);
      }
      if (!baselined) { baselined = true; ignore = found; return; }
      ignore = ignore.filter(function (x) { return found.indexOf(x) !== -1; });
      for (var i = 0; i < found.length; i++) {
        if (ignore.indexOf(found[i]) === -1) { over(false); return; }
      }
    };
    setInterval(scan, 1000);
    try {
      new MutationObserver(function () { clearTimeout(tm); tm = setTimeout(scan, 250); })
        .observe(document.documentElement, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ["style", "class", "hidden"] });
    } catch (e) {}
  }

  // Pemutaran ulang input lawan (panel lawan)
  var replay = function (o) {
    var W = innerWidth, H = innerHeight, t = o.t;
    try {
      if (t === "keydown" || t === "keyup") {
        var ev = new KeyboardEvent(t, { key: o.k, code: o.c, bubbles: true, cancelable: true, shiftKey: !!(o.m & 1), ctrlKey: !!(o.m & 2), altKey: !!(o.m & 4), metaKey: !!(o.m & 8) });
        try {
          Object.defineProperty(ev, "keyCode", { get: function () { return o.kc; } });
          Object.defineProperty(ev, "which", { get: function () { return o.kc; } });
        } catch (e) {}
        (document.activeElement || document.body).dispatchEvent(ev);
      } else if (t.indexOf("touch") === 0) {
        var p = (o.cs || [])[0];
        if (!p) return;
        var tgt = document.elementFromPoint(p.x * W, p.y * H) || document.body;
        if (typeof Touch === "function" && typeof TouchEvent === "function") {
          var mk = function (a) {
            return (a || []).map(function (q) {
              return new Touch({ identifier: q.i, target: tgt, clientX: q.x * W, clientY: q.y * H, pageX: q.x * W, pageY: q.y * H, screenX: q.x * W, screenY: q.y * H });
            });
          };
          tgt.dispatchEvent(new TouchEvent(t, { bubbles: true, cancelable: true, touches: mk(o.ts), targetTouches: mk(o.ts), changedTouches: mk(o.cs) }));
        } else {
          var mt = t === "touchstart" ? "mousedown" : t === "touchmove" ? "mousemove" : "mouseup";
          tgt.dispatchEvent(new MouseEvent(mt, { bubbles: true, cancelable: true, clientX: p.x * W, clientY: p.y * H, view: window }));
        }
      } else {
        var x = o.x * W, y = o.y * H;
        var el = document.elementFromPoint(x, y) || document.body;
        var init = { bubbles: true, cancelable: true, clientX: x, clientY: y, screenX: x, screenY: y, button: o.b || 0, buttons: o.bs || 0, view: window };
        var me;
        if (t.indexOf("pointer") === 0 && typeof PointerEvent === "function") {
          init.pointerId = 1; init.pointerType = "mouse"; init.isPrimary = true;
          me = new PointerEvent(t, init);
        } else me = new MouseEvent(t, init);
        el.dispatchEvent(me);
      }
    } catch (err) {}
  };
  window.addEventListener("message", function (e) {
    if (e.source !== parent) return;
    var d = e.data;
    if (!d || d.caxa !== 1) return;
    if (d.type === "replay" && role === "mirror" && Array.isArray(d.events)) {
      d.events.forEach(function (o) { if (o && typeof o.t === "string") replay(o); });
    } else if (d.type === "freeze") {
      done = true;
      ctxs.forEach(function (c) { try { c.suspend(); } catch (x) {} });
      document.querySelectorAll("audio,video").forEach(function (m) { try { m.pause(); } catch (x) {} });
    }
  });
}

function injectShim(code, cfg) {
  const tag = "<script>(" + caxaShim.toString() + ")(" + JSON.stringify(cfg) + ");<\/script>";
  let m = code.match(/<head(?:\s[^>]*)?>/i) || code.match(/<html(?:\s[^>]*)?>/i);
  if (m) { const i = m.index + m[0].length; return code.slice(0, i) + tag + code.slice(i); }
  m = code.match(/^\s*<!doctype[^>]*>/i);
  if (m) return code.slice(0, m[0].length) + tag + code.slice(m[0].length);
  return tag + code;
}

function genCode() {
  const a = new Uint8Array(6);
  crypto.getRandomValues(a);
  let s = "";
  for (let i = 0; i < a.length; i++) s += ROOM_CHARS[a[i] % 32];
  return s;
}

function modal(html) {
  const w = document.createElement("div");
  w.className = "backdrop";
  w.innerHTML = '<div class="dlg" role="dialog" aria-modal="true">' + html + "</div>";
  const onKey = e => { if (e.key === "Escape") close(); };
  const close = () => { w.remove(); document.removeEventListener("keydown", onKey); };
  w.addEventListener("click", e => { if (e.target === w || e.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(w);
  return { el: w, close: close };
}

/* ---- Pilih mode, buat room, gabung room ---- */
function playMenu(id) {
  const g = state.detail;
  if (!g) return;
  const canRoom = g.status === "approved";
  const roomNote = !canRoom ? "Tersedia setelah game dipublikasikan." : (!state.user ? "Perlu masuk dengan Google. Buat room lalu bagikan kodenya." : "Buat room lalu bagikan kodenya ke teman.");
  const m = modal('<h3>Pilih mode permainan</h3><p>' + esc(g.title) + '</p><div class="choices"><button class="choice" data-m="solo"><b>Mainkan sendiri</b><span>Satu pemain, langsung mulai.</span></button><button class="choice" data-m="room" ' + (canRoom ? "" : "disabled") + '><b>Mainkan bersama teman</b><span>' + esc(roomNote) + '</span></button></div><div class="dlg-act"><button class="btn" data-close>Batal</button></div>');
  m.el.addEventListener("click", e => {
    const b = e.target.closest("[data-m]");
    if (!b || b.disabled) return;
    m.close();
    if (b.dataset.m === "solo") playGame(id); else createRoom(id);
  });
}

async function createRoom(gameId) {
  const u = state.user, g = state.detail;
  if (!u) { toast("Masuk dengan Google untuk membuat room.", "error"); return; }
  if (!g || g.status !== "approved") { toast("Hanya game yang sudah dipublikasikan yang bisa dimainkan bersama.", "error"); return; }
  showLoader(true);
  try {
    for (let i = 0; i < 5; i++) {
      const code = genCode();
      const ref = db.ref("rooms/" + code);
      if ((await ref.once("value")).exists()) continue;
      await ref.set({ hostId: u.uid, hostName: (u.displayName || "Pengguna").slice(0, 100), gameId: gameId, gameTitle: g.title, status: "waiting", round: 0, createdAt: TS });
      location.hash = "#/room/" + code;
      return;
    }
    throw new Error("Gagal membuat kode room. Coba lagi.");
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

function joinModal() {
  if (!state.user) { toast("Masuk dengan Google untuk bergabung ke room.", "error"); return; }
  const m = modal('<form id="jr-form"><h3>Gabung room</h3><p>Masukkan kode room dari temanmu.</p><input type="text" id="jr" maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="Kode room" style="text-transform:uppercase;letter-spacing:.3em;text-align:center;font-size:26px;font-weight:800"><div class="dlg-act"><button type="button" class="btn" data-close>Batal</button><button type="submit" class="btn primary">Gabung</button></div></form>');
  const input = $("#jr", m.el);
  input.focus();
  $("#jr-form", m.el).addEventListener("submit", e => { e.preventDefault(); const v = input.value; m.close(); joinRoom(v); });
}

async function joinRoom(raw) {
  const u = state.user;
  if (!u) { toast("Masuk dengan Google untuk bergabung ke room.", "error"); return; }
  const code = String(raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  if (!ROOM_RE.test(code)) { toast("Kode room terdiri dari 6 karakter huruf dan angka.", "error"); return; }
  showLoader(true);
  try {
    const r = (await db.ref("rooms/" + code).once("value")).val();
    if (!r) throw new Error("Room tidak ditemukan atau sudah ditutup.");
    if (r.hostId === u.uid || r.guestId === u.uid) { location.hash = "#/room/" + code; return; }
    if (r.guestId) throw new Error("Room sudah penuh.");
    if (r.status === "playing") throw new Error("Pertandingan di room ini sedang berlangsung.");
    try {
      await db.ref().update({ ["rooms/" + code + "/guestId"]: u.uid, ["rooms/" + code + "/guestName"]: (u.displayName || "Pengguna").slice(0, 100) });
    } catch (e) {
      if (/permission_denied/i.test((e.code || "") + (e.message || ""))) throw new Error("Tidak bisa bergabung. Room mungkin sudah penuh.");
      throw e;
    }
    location.hash = "#/room/" + code;
  } catch (e) { toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

async function leaveRoom() {
  const r = state.room, code = state.roomId, u = state.user;
  if (!r || !u) return;
  const host = r.hostId === u.uid;
  const ok = await confirmBox({ title: host ? "Tutup room?" : "Keluar dari room?", text: host ? "Room akan ditutup dan teman Anda dikeluarkan." : "Anda akan keluar dari room ini.", ok: host ? "Tutup room" : "Keluar", danger: true });
  if (!ok) return;
  state.leaving = true;
  showLoader(true);
  try {
    if (host) await db.ref().update({ ["rooms/" + code]: null, ["roomInputs/" + code]: null });
    else await db.ref().update({ ["rooms/" + code + "/guestId"]: null, ["rooms/" + code + "/guestName"]: null });
    cancelDisconnect(code);
    location.hash = "#/";
  } catch (e) { state.leaving = false; toast(errMsg(e), "error"); }
  finally { showLoader(false); }
}

function setupDisconnect(r) {
  const code = state.roomId, uid = state.user.uid;
  const role = r.hostId === uid ? "h" : "g";
  if (state.disc[code] === role) return;
  state.disc[code] = role;
  if (role === "h") {
    // Urutan penting: hapus input dulu selagi room masih ada.
    db.ref("roomInputs/" + code).onDisconnect().remove();
    db.ref("rooms/" + code).onDisconnect().remove();
  } else {
    db.ref("rooms/" + code).onDisconnect().update({ guestId: null, guestName: null });
  }
}
function cancelDisconnect(code) {
  ["roomInputs/" + code, "rooms/" + code].forEach(p => db.ref(p).onDisconnect().cancel());
  delete state.disc[code];
}

function pickGame() {
  const r = state.room;
  if (!r || !state.user || r.hostId !== state.user.uid || r.status === "playing") return;
  const m = modal('<h3>Pilih game untuk room</h3><input type="search" id="pk-q" placeholder="Cari game" aria-label="Cari game"><div class="pick-list" id="pk-list"></div><div class="dlg-act"><button class="btn" data-close>Tutup</button></div>');
  const list = $("#pk-list", m.el), q = $("#pk-q", m.el);
  const draw = () => {
    const t = q.value.trim().toLowerCase();
    const items = gamesList().filter(g => !t || ((g.title || "") + " " + (g.ownerName || "")).toLowerCase().indexOf(t) !== -1).sort(newest);
    list.innerHTML = items.length ? items.map(g => '<button class="pick" data-id="' + esc(g.id) + '"><b>' + esc(g.title) + '</b><span class="muted">' + esc(g.ownerName) + "</span></button>").join("") : '<p class="muted">Tidak ada game yang cocok.</p>';
  };
  q.addEventListener("input", draw);
  draw();
  list.addEventListener("click", async e => {
    const b = e.target.closest("[data-id]");
    if (!b) return;
    const g = state.games[b.dataset.id];
    if (!g) return;
    m.close();
    showLoader(true);
    try {
      await db.ref().update({ ["rooms/" + state.roomId + "/gameId"]: b.dataset.id, ["rooms/" + state.roomId + "/gameTitle"]: g.title });
      toast("Game room diganti.", "ok");
    } catch (err) { toast(errMsg(err), "error"); }
    finally { showLoader(false); }
  });
}

async function startRound() {
  const r = state.room, code = state.roomId;
  if (!r || !r.guestId || !state.user) return;
  const b = "rooms/" + code + "/";
  const up = {};
  up[b + "status"] = "playing";
  up[b + "round"] = (r.round || 0) + 1;
  up[b + "seed"] = Math.floor(Math.random() * 4294967296);
  up[b + "startedAt"] = TS;
  up[b + "loserId"] = null;
  up["roomInputs/" + code] = null;
  try { await db.ref().update(up); }
  catch (e) { toast(/permission_denied/i.test((e.code || "") + (e.message || "")) ? "Tidak bisa memulai. Mungkin pemain lain sudah memulai." : errMsg(e), "error"); }
}

async function changeGame() {
  const r = state.room, u = state.user;
  if (!r || !u) return;
  const host = r.hostId === u.uid;
  showLoader(true);
  try { await db.ref("rooms/" + state.roomId + "/status").set("waiting"); }
  catch (e) { toast(errMsg(e), "error"); return; }
  finally { showLoader(false); }
  if (host) setTimeout(pickGame, 80);
}

function copyCode(code) {
  const done = () => toast("Kode room disalin.", "ok");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, () => window.prompt("Salin kode room:", code));
  else window.prompt("Salin kode room:", code);
}

/* ---- Halaman room (lobi) ---- */
function viewRoom() {
  if (!state.authReady) return loadingBlock();
  if (!state.user) return needLogin("Masuk dengan Google untuk bergabung ke room.");
  const code = (route.id || "").toUpperCase();
  if (state.roomId === "bad" || !ROOM_RE.test(code)) return notFound("Kode room tidak valid.");
  if (state.roomId !== code) return loadingBlock("Memuat room...");
  const r = state.room;
  if (!r) return notFound("Room tidak ditemukan atau sudah ditutup.");
  const uid = state.user.uid, isHost = r.hostId === uid, isGuest = r.guestId === uid;
  if (!isHost && !isGuest) {
    if (r.guestId) return notFound("Room ini sudah penuh.");
    return '<section class="wrap narrow"><h1>Gabung ke room ' + esc(code) + '</h1><div class="roomgame"><div><span class="muted">Game</span><b>' + esc(r.gameTitle) + '</b></div><div><span class="muted">Host</span><b>' + esc(r.hostName) + '</b></div></div><div class="actions" style="margin-top:20px"><button class="btn primary" data-act="join-room-now" data-id="' + esc(code) + '">Gabung room</button><a class="btn" href="#/">Batal</a></div></section>';
  }
  const canStart = !!r.guestId && ((isHost && r.status === "waiting") || r.status === "finished");
  const pc = (label, name, me, empty) => '<div class="pcard ' + (name ? "" : "empty") + '"><span class="muted">' + label + "</span><b>" + esc(name || empty) + "</b>" + (me ? '<span class="badge">Anda</span>' : "") + "</div>";
  let startArea;
  if (canStart) startArea = '<button class="btn primary" data-act="start-room">' + (r.status === "finished" ? "Main lagi" : "Mainkan") + "</button>";
  else if (isHost) startArea = '<button class="btn primary" disabled>Mainkan</button>';
  else startArea = "";
  const wait = isHost && !r.guestId ? "Menunggu teman bergabung dengan kode di atas." : (!isHost && r.status === "waiting" ? "Menunggu host menekan Mainkan." : "");
  return '<section class="wrap narrow"><h1>Room multiplayer</h1>' +
    '<p class="muted" style="margin-top:6px">' + (isHost ? "Bagikan kode ini ke temanmu. Mereka memasukkannya lewat tombol Gabung room di menu atas." : "Anda sudah berada di room ini.") + "</p>" +
    '<div class="roomcode"><div><span class="muted">Kode room</span><output>' + esc(code) + '</output></div><button class="btn sm" data-act="copy-code" data-id="' + esc(code) + '">Salin kode</button></div>' +
    '<div class="players">' + pc("Player 1", r.hostName, isHost, "") + pc("Player 2", r.guestName, isGuest, "Menunggu teman") + "</div>" +
    '<div class="roomgame"><div><span class="muted">Game</span><b>' + esc(r.gameTitle) + "</b></div>" + (isHost ? '<button class="btn sm" data-act="pick-game">Ganti game</button>' : "") + "</div>" +
    (wait ? '<p class="hint">' + esc(wait) + "</p>" : "") +
    '<div class="actions" style="margin-top:22px">' + startArea + '<button class="btn danger" data-act="leave-room">' + (isHost ? "Tutup room" : "Keluar room") + "</button></div>" +
    '<p class="hint">Kedua pemain memainkan game yang sama dengan pola acak yang sama. Layar lawan adalah tayangan ulang dari input mereka, jadi bisa sedikit berbeda dari layar asli mereka. Pemenang ditentukan dari siapa yang game over lebih dulu.</p></section>';
}

/* ---- Layar terbagi dua ---- */
function paneLabel(n, name, me) {
  return '<div class="plabel"><b>Player ' + n + "</b><span>" + esc(name || "") + "</span>" + (me ? '<em class="you">Anda</em>' : "") + "</div>";
}

function startMp(r) {
  destroyMp(false);
  const uid = state.user.uid;
  const meP1 = r.hostId === uid;
  const m = { code: state.roomId, round: r.round, gameId: r.gameId, meP1: meP1, oppId: meP1 ? r.guestId : r.hostId, dead: false, live: false, reported: false, resultShown: false, tickT: null, oppRef: null, oppCb: null, local: null, mirror: null, mirrorReady: false, queue: [], el: null };
  mp = m;
  const el = document.createElement("div");
  el.className = "mp";
  el.innerHTML = '<div class="pane" data-pane="1">' + paneLabel(1, r.hostName, meP1) + '</div><div class="pane" data-pane="2">' + paneLabel(2, r.guestName, !meP1) + '</div><div class="cd" id="mp-cd" aria-live="assertive"></div>';
  document.body.appendChild(el);
  document.body.style.overflow = "hidden";
  m.el = el;
  const codePromise = db.ref("gameCode/" + r.gameId).once("value").then(s => s.val());
  codePromise.catch(() => {});
  const startAt = (r.startedAt || (Date.now() + state.srvOff)) + 3000;
  const cd = $("#mp-cd", el);
  const tick = () => {
    if (m.dead) return;
    const left = startAt - (Date.now() + state.srvOff);
    if (left > 0) {
      cd.hidden = false;
      cd.textContent = String(Math.ceil(left / 1000));
      m.tickT = setTimeout(tick, Math.min(left, 100));
    } else {
      cd.hidden = true;
      launchMp(m, r, codePromise);
    }
  };
  tick();
}

async function launchMp(m, r, codePromise) {
  let code;
  try {
    code = await codePromise;
    if (typeof code !== "string" || !code) throw new Error("Kode game tidak tersedia. Mungkin game sedang ditinjau ulang.");
  } catch (e) { toast(errMsg(e), "error"); return; }
  if (m.dead) return;
  const build = (role, title) => {
    const f = document.createElement("iframe");
    f.setAttribute("sandbox", "allow-scripts allow-pointer-lock allow-modals");
    f.referrerPolicy = "no-referrer";
    f.title = title;
    f.srcdoc = injectShim(code, { role: role, seed: r.seed });
    return f;
  };
  const lf = build("local", "Game Anda"), mf = build("mirror", "Tayangan lawan");
  mf.className = "mirror";
  mf.tabIndex = -1;
  m.local = lf; m.mirror = mf;
  mf.addEventListener("load", () => {
    m.mirrorReady = true;
    const q = m.queue; m.queue = [];
    q.forEach(evs => { try { mf.contentWindow.postMessage({ caxa: 1, type: "replay", events: evs }, "*"); } catch (_) {} });
  });
  lf.addEventListener("load", () => { try { lf.contentWindow.focus(); } catch (_) {} });
  const localPane = $('[data-pane="' + (m.meP1 ? 1 : 2) + '"]', m.el);
  const mirrorPane = $('[data-pane="' + (m.meP1 ? 2 : 1) + '"]', m.el);
  localPane.insertBefore(lf, localPane.firstChild);
  mirrorPane.insertBefore(mf, mirrorPane.firstChild);
  const ctl = document.createElement("button");
  ctl.className = "btn sm mp-ctl";
  ctl.dataset.act = "mp-surrender";
  ctl.textContent = "Menyerah";
  localPane.appendChild(ctl);

  const ref = db.ref("roomInputs/" + m.code + "/" + m.oppId);
  const cb = snap => {
    const v = snap.val();
    if (typeof v !== "string") return;
    const i = v.indexOf("|");
    if (i < 1 || v.slice(0, i) !== String(m.round)) return;
    let evs;
    try { evs = JSON.parse(v.slice(i + 1)); } catch (_) { return; }
    if (!Array.isArray(evs)) return;
    if (m.mirrorReady && mf.contentWindow) mf.contentWindow.postMessage({ caxa: 1, type: "replay", events: evs }, "*");
    else if (m.queue.length < 500) m.queue.push(evs);
  };
  ref.on("child_added", cb, () => {});
  m.oppRef = ref; m.oppCb = cb;
  m.live = true;
  if (r.round === 1) countPlay(r.gameId, state.games[r.gameId]);
}

function sendInput(arr) {
  const m = mp;
  if (!m || !m.live || m.dead || !state.user) return;
  const ref = db.ref("roomInputs/" + m.code + "/" + state.user.uid);
  const push = a => {
    const s = m.round + "|" + JSON.stringify(a);
    if (s.length > 2900) {
      if (a.length > 1) { const h = a.length >> 1; push(a.slice(0, h)); push(a.slice(h)); }
      return;
    }
    ref.push(s).catch(() => {});
  };
  push(arr);
}

async function reportLoss() {
  const m = mp;
  if (!m || !m.live || m.reported || m.dead || m.resultShown || !state.user) return;
  m.reported = true;
  const b = "rooms/" + m.code + "/";
  const up = {};
  up[b + "loserId"] = state.user.uid;
  up[b + "status"] = "finished";
  try { await db.ref().update(up); }
  catch (e) { console.warn("Laporan game over ditolak (kemungkinan lawan sudah kalah lebih dulu):", e); }
}

function showResult(r) {
  const m = mp;
  if (!m || m.resultShown) return;
  m.resultShown = true;
  [m.local, m.mirror].forEach(f => { try { if (f && f.contentWindow) f.contentWindow.postMessage({ caxa: 1, type: "freeze" }, "*"); } catch (_) {} });
  const loserIsP1 = r.loserId === r.hostId;
  const winP = loserIsP1 ? 2 : 1, loseP = loserIsP1 ? 1 : 2;
  const winName = loserIsP1 ? r.guestName : r.hostName;
  const loseName = loserIsP1 ? r.hostName : r.guestName;
  const iWon = (winP === 1) === m.meP1;
  const w = document.createElement("div");
  w.className = "backdrop";
  w.innerHTML = '<div class="dlg" role="alertdialog" aria-modal="true"><h3>Player ' + winP + ' menang</h3><p><b>' + esc(winName) + "</b> memenangkan ronde ini. Player " + loseP + " (" + esc(loseName) + ") game over. " + (iWon ? "Selamat, Anda menang." : "Anda kalah di ronde ini.") + '</p><div class="dlg-act"><button class="btn" data-act="mp-change">Ganti game</button><button class="btn primary" data-act="mp-again">Lanjutkan game</button></div></div>';
  m.el.appendChild(w);
  const first = $('[data-act="mp-again"]', w);
  if (first) first.focus();
}

function destroyMp(forfeit) {
  const m = mp;
  if (!m) return;
  if (forfeit && m.live && !m.reported && !m.resultShown) reportLoss();
  m.dead = true;
  clearTimeout(m.tickT);
  if (m.oppRef) m.oppRef.off("child_added", m.oppCb);
  if (m.el) m.el.remove();
  document.body.style.overflow = "";
  mp = null;
}

/* ---- Sinkronisasi room ---- */
function detachRoom() {
  if (roomRef) { roomRef.off("value", roomCb); roomRef = null; }
  state.room = null; state.roomId = null;
}
function attachRoom() {
  detachRoom();
  if (route.name !== "room") return;
  const code = (route.id || "").toUpperCase();
  if (!ROOM_RE.test(code)) { state.roomId = "bad"; return; }
  if (!state.user) return;
  const same = () => (route.id || "").toUpperCase() === code;
  roomCb = s => { if (!same()) return; state.room = s.val(); state.roomId = code; onRoomUpdate(); };
  roomRef = db.ref("rooms/" + code);
  roomRef.on("value", roomCb, e => { if (!same()) return; state.room = null; state.roomId = code; onDbErr(e); renderView(); });
}

function onRoomUpdate() {
  const r = state.room, u = state.user;
  if (!u) return;
  if (!r) {
    destroyMp(false);
    if (state.seenRoom === state.roomId && !state.leaving) { toast("Room telah ditutup.", "error"); state.seenRoom = null; location.hash = "#/"; return; }
    renderView();
    return;
  }
  state.seenRoom = state.roomId;
  const isHost = r.hostId === u.uid, isGuest = r.guestId === u.uid;
  const member = isHost || isGuest;
  if (member) setupDisconnect(r);
  if (isHost) {
    if (state.prevGuest && !r.guestId) toast("Teman keluar dari room.");
    if (r.status !== "waiting" && !r.guestId) db.ref("rooms/" + state.roomId + "/status").set("waiting").catch(() => {});
  }
  state.prevGuest = r.guestId || null;
  if (member && r.status === "playing" && r.guestId) {
    if (!mp || mp.round !== r.round || mp.code !== state.roomId) startMp(r);
  } else if (member && r.status === "finished" && r.loserId && mp && mp.round === r.round) {
    showResult(r);
  } else if (mp) {
    destroyMp(false);
  }
  if (!mp) renderView();
}

window.addEventListener("message", e => {
  const m = mp;
  if (!m || !m.local || e.source !== m.local.contentWindow) return;
  const d = e.data;
  if (!d || d.caxa !== 1) return;
  if (d.type === "gameover") reportLoss();
  else if (d.type === "input" && Array.isArray(d.ev)) sendInput(d.ev.slice(0, 200));
});

/* ====================== Router ====================== */
function parseHash() {
  const p = location.hash.replace(/^#\/?/, "").split("/");
  return { name: p[0] || "home", id: p[1] || null };
}
function onRoute() {
  destroyMp(true);
  route = parseHash();
  state.touched = false;
  state.leaving = false;
  attachRoom();
  if (detailRef) { detailRef.off("value", detailCb); detailRef = null; }
  state.detail = null; state.detailId = null;
  if (route.name === "game") {
    const rid = route.id;
    if (!ID_RE.test(rid || "")) { state.detailId = "bad"; }
    else {
      detailCb = s => { if (route.id !== rid) return; state.detail = s.val(); state.detailId = rid; renderView(); };
      detailRef = db.ref("games/" + rid);
      detailRef.on("value", detailCb, e => { if (route.id !== rid) return; state.detail = null; state.detailId = rid; onDbErr(e); renderView(); });
    }
  }
  const navKey = route.name === "edit" ? "upload" : route.name;
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === navKey));
  window.scrollTo(0, 0);
  renderView();
}
function renderView() {
  const v = $("#view");
  switch (route.name) {
    case "home": v.innerHTML = viewHome(); break;
    case "game": v.innerHTML = viewGame(); break;
    case "favorites": v.innerHTML = viewFavorites(); break;
    case "profile": v.innerHTML = viewProfile(); break;
    case "room": v.innerHTML = viewRoom(); break;
    case "upload": case "edit": v.innerHTML = viewForm(); bindForm(); break;
    default: v.innerHTML = notFound("Halaman tidak ada.");
  }
}
// Data realtime memanggil refresh(); form yang sedang diisi tidak ditimpa.
function refresh() {
  if ((route.name === "upload" || route.name === "edit") && state.touched) return;
  renderView();
}

/* ====================== Event ====================== */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "login") login();
  else if (a === "logout") logout();
  else if (a === "fav") toggleFav(id);
  else if (a === "play") playMenu(id);
  else if (a === "join-room") joinModal();
  else if (a === "join-room-now") joinRoom(id);
  else if (a === "copy-code") copyCode(id);
  else if (a === "leave-room") leaveRoom();
  else if (a === "start-room" || a === "mp-again") startRound();
  else if (a === "pick-game") pickGame();
  else if (a === "mp-change") changeGame();
  else if (a === "mp-surrender") {
    confirmBox({ title: "Menyerah?", text: "Anda akan dinyatakan kalah di ronde ini.", ok: "Menyerah", danger: true }).then(ok => { if (ok) reportLoss(); });
  }
  else if (a === "share") share(id);
  else if (a === "delete") deleteGame(id);
  else if (a === "cat") { state.cat = id || ""; renderView(); }
});
document.addEventListener("change", e => {
  if (e.target.id === "sort") { state.sort = e.target.value; renderView(); }
});
let qTimer = null;
$("#q").addEventListener("input", e => {
  clearTimeout(qTimer);
  const val = e.target.value;
  qTimer = setTimeout(() => {
    state.query = val;
    if (route.name !== "home") location.hash = "#/"; else renderView();
  }, 150);
});
window.addEventListener("hashchange", onRoute);

/* ====================== Mulai ====================== */
db.ref(".info/serverTimeOffset").on("value", s => { state.srvOff = s.val() || 0; });
let offTimer = null;
db.ref(".info/connected").on("value", s => {
  clearTimeout(offTimer);
  if (s.val() === true) $("#offline").hidden = true;
  else offTimer = setTimeout(() => { $("#offline").hidden = false; }, 4000);
});
db.ref("categories").on("value", s => { state.cats = s.val() || {}; state.loaded.cats = true; refresh(); }, e => { state.loaded.cats = true; onDbErr(e); });
db.ref("games").orderByChild("status").equalTo("approved").on("value", s => {
  state.games = s.val() || {}; state.loaded.games = true; state.loadError = ""; refresh();
}, e => { state.loaded.games = true; state.loadError = errMsg(e); onDbErr(e); refresh(); });
db.ref("plays").on("value", s => { state.plays = s.val() || {}; refresh(); }, onDbErr);

auth.getRedirectResult().catch(e => toast(errMsg(e), "error"));
auth.onAuthStateChanged(async u => {
  detachUserListeners();
  state.user = u;
  state.authReady = true;
  renderAuth();
  if (!u) { destroyMp(false); detachRoom(); }
  else if (route.name === "room") attachRoom();
  if (u) { await ensureUserRecord(u); attachUserListeners(u); }
  refresh();
});

onRoute();
})();
</script>
</body>
</html>
