<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join VDverse</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f2f2f2; /* Abu-abu muda bersih */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Animasi Masuk */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 50px 30px;
            border-radius: 35px; /* Rounding smooth sesuai foto */
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            animation: slideUp 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 40px;
            line-height: 1.3;
        }

        .container-tombol {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            border-radius: 18px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        /* Biru Solid persis di gambar */
        .btn-biru {
            background-color: #007bff;
            color: white;
        }

        /* Hover effect yang smooth */
        .btn-biru:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
            box-shadow: 0 8px 20px rgba(0, 123, 255, 0.2);
        }

        .btn-biru:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body>

    <div class="card">
        <h1>Join ke komunitas VDverse</h1>

        <div class="container-tombol">
            <a href="https://chat.whatsapp.com/EPbo9CECMExK9VKE6yHGjE" target="_blank" class="btn btn-biru">
                Komunitas WhatsApp
            </a>

            <a href="https://discord.gg/QAWmcbEW9" target="_blank" class="btn btn-biru">
                Komunitas Discord (Fikri)
            </a>
        </div>
    </div>

</body>
</html>
