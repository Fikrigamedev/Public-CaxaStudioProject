<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pyki Text Generator</title>

<!-- EMOJI FONTS -->
<link id="emojiFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji">

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f3f3f3;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 450px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }

    .preview {
        width: 100%;
        aspect-ratio: 1 / 1;
        background: #222;
        border-radius: 12px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        padding: 20px;
    }

    #textOutput {
        font-size: 38px;
        font-weight: 700;
        width: 100%;
        word-break: break-word;
        white-space: pre-wrap;
        text-align: center;
        line-height: 1.05;
        color: #fff;
        font-family: Arial, "Noto Color Emoji";
    }

    .btn-row {
        display: flex;
        gap: 8px;
        margin-top: 12px;
    }

    button, select, input {
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ddd;
        margin-top: 10px;
        width: 100%;
        box-sizing: border-box;
    }

    button {
        border: none;
        background: #222;
        color: #fff;
        cursor: pointer;
        font-weight: 600;
    }

    .btn-mini {
        width: 33%;
    }
</style>
</head>
<body>

<div class="container">

    <!-- LANGUAGE SELECTOR -->
    <select id="langSelect">
        <option value="id" selected>Bahasa Indonesia</option>
        <option value="en">English</option>
    </select>

    <!-- EMOJI STYLE -->
    <select id="emojiSelect">
        <option value="android">Emoji Android</option>
        <option value="iphone">Emoji iPhone</option>
    </select>

    <input id="textInput" placeholder="Tulis teks kamu di sini...">

    <!-- ALIGN BUTTONS -->
    <div class="btn-row">
        <button class="btn-mini" onclick="setAlign('left')" id="btnLeft">Kiri</button>
        <button class="btn-mini" onclick="setAlign('center')" id="btnCenter">Tengah</button>
        <button class="btn-mini" onclick="setAlign('right')" id="btnRight">Kanan</button>
    </div>

    <!-- COLOR PICKERS -->
    <label>Warna Teks:</label>
    <input type="color" id="textColor" value="#ffffff">

    <label>Warna Latar Belakang:</label>
    <input type="color" id="bgColor" value="#222222">

    <!-- LINE SPACING -->
    <label>Jarak Baris:</label>
    <input type="range" id="lineSpacing" min="0.8" max="2.0" value="1.05" step="0.05">

    <!-- PREVIEW -->
    <div class="preview" id="previewBox">
        <div id="textOutput">Text Pyki</div>
    </div>

    <!-- DOWNLOAD -->
    <button style="margin-top: 15px;" onclick="downloadImage()" id="btnDownload">Download</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
/* ===========================
   LANGUAGE SYSTEM
=========================== */
const t = {
    id: {
        placeholder: "Tulis teks kamu di sini... ",
        left: "Kiri",
        center: "Tengah",
        right: "Kanan",
        download: "Download"
    },
    en: {
        placeholder: "Type your text here... ",
        left: "Left",
        center: "Center",
        right: "Right",
        download: "Download"
    }
};

function updateLanguage() {
    let lang = document.getElementById("langSelect").value;

    document.getElementById("textInput").placeholder = t[lang].placeholder;
    document.getElementById("btnLeft").innerText = t[lang].left;
    document.getElementById("btnCenter").innerText = t[lang].center;
    document.getElementById("btnRight").innerText = t[lang].right;
    document.getElementById("btnDownload").innerText = t[lang].download;
}
document.getElementById("langSelect").addEventListener("change", updateLanguage);

/* ===========================
   MAIN FUNCTIONALITY
=========================== */
let input = document.getElementById("textInput");
let output = document.getElementById("textOutput");
let previewBox = document.getElementById("previewBox");

input.addEventListener("input", () => {
    output.textContent = input.value;
});

// ALIGN
function setAlign(pos) {
    output.style.textAlign = pos;
}

// TEXT COLOR
document.getElementById("textColor").addEventListener("input", e => {
    output.style.color = e.target.value;
});

// BACKGROUND COLOR
document.getElementById("bgColor").addEventListener("input", e => {
    previewBox.style.background = e.target.value;
});

// LINE SPACING
document.getElementById("lineSpacing").addEventListener("input", e => {
    output.style.lineHeight = e.target.value;
});

/* ===========================
   EMOJI STYLE SWITCH
=========================== */
/* ===========================
   FIXED — EMOJI STYLE SWITCH (WORKING)
=========================== */
/* ===== FIX EMOJI IPHONE (REPLACE THIS BLOCK ONLY) ===== */

// helper: convert an emoji sequence into hyphen-joined codepoints (lowercase hex)
function seqToCodepoints(seq) {
  const cps = [];
  for (const ch of Array.from(seq)) {
    const cp = ch.codePointAt(0).toString(16).toLowerCase();
    cps.push(cp);
  }
  return cps.join('-');
}

// build <img> tag for given emoji sequence and style; includes robust fallback
function emojiImgTag(seq, style) {
  const code = seqToCodepoints(seq);

  if (style === 'iphone') {
    // primary: iamcal repo PNG (160px), fallback -> twemoji svg if 404
    const primary = `https://raw.githubusercontent.com/iamcal/emoji-data/master/img-apple-160/${code}.png`;
    const fallback = `https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/${code}.svg`;
    // return img with onerror fallback to twemoji svg
    return `<img src="${primary}" onerror="this.onerror=null;this.src='${fallback}';" style="width:1em;height:1em;vertical-align:-0.12em">`;
  } else {
    // android/twemoji: svg (works reliable)
    const tw = `https://cdnjs.cloudflare.com/ajax/libs/twemoji/14.0.2/svg/${code}.svg`;
    return `<img src="${tw}" style="width:1em;height:1em;vertical-align:-0.12em">`;
  }
}

// main parser: replaces emoji with <img> tags; leaves other text intact
function parseEmojiToHtml(text, style) {
  // regex that matches extended pictographic/emoji presentations (works on modern engines)
  const emojiRegex = /\p{Emoji_Presentation}|\p{Extended_Pictographic}/gu;

  // We need to preserve words and spaces; replace each match
  return text.replace(emojiRegex, match => {
    try {
      return emojiImgTag(match, style);
    } catch (e) {
      // fallback: return original char if anything goes wrong
      return match;
    }
  });
}

// render function that updates output.innerHTML with parsed emoji images
function renderEmoji() {
  const raw = input.value || '';
  // currentEmojiStyle assumed set by emojiSelect change listener elsewhere
  const style = currentEmojiStyle || 'android';
  // preserve HTML-escaping for non-emoji text
  const esc = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // parse emojis and set as innerHTML
  output.innerHTML = parseEmojiToHtml(esc, style);
}

// ensure listeners set: (if your code already set them, this won't duplicate)
// update when input changes
input.removeEventListener('input', renderEmoji); // safe-remove if existed
input.addEventListener('input', renderEmoji);

// emoji style selector change -> re-render
const emojiSelectEl = document.getElementById('emojiSelect');
if (emojiSelectEl) {
  emojiSelectEl.removeEventListener('change', () => {}); // safe no-op removal
  emojiSelectEl.addEventListener('change', (e) => {
    currentEmojiStyle = e.target.value;
    renderEmoji();
  });
}

// initial call to render current content
renderEmoji();

/* ===========================
   DOWNLOAD IMAGE
=========================== */
function downloadImage() {
    html2canvas(previewBox).then(canvas => {
        let link = document.createElement("a");
        link.download = "pyki-text.png";
        link.href = canvas.toDataURL();
        link.click();
    });
}
</script>

</body>
</html>
