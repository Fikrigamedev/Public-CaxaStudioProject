<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hotspot Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: satu kolom; bar atas, area unggah, kontrol, lalu panggung preview berskala */
:root{
  --bg:#111113; --panel:#1a1a1e; --panel-2:#222227; --line:#2e2e35;
  --fg:#e9e9ec; --muted:#8e8e98; --accent:#a4a4b0; --accent-ink:#141416;
  --ok:#8fb89a; --warn:#d2a86a; --err:#d08585;
  --font-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Space Grotesk","Inter",system-ui,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f1f1f3; --panel:#ffffff; --panel-2:#e8e8ec; --line:#d6d6dc;
    --fg:#18181b; --muted:#6a6a74; --accent:#4a4a55; --accent-ink:#ffffff;
    --ok:#3f7a52; --warn:#9a6a1f; --err:#b04848; color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f1f1f3; --panel:#ffffff; --panel-2:#e8e8ec; --line:#d6d6dc;
  --fg:#18181b; --muted:#6a6a74; --accent:#4a4a55; --accent-ink:#ffffff;
  --ok:#3f7a52; --warn:#9a6a1f; --err:#b04848; color-scheme:light;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.5;
  padding-block:20px 32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:12px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px}
h1{font:600 19px/1.2 var(--font-head);letter-spacing:.2px;margin:0}
header p{margin:2px 0 0;color:var(--muted);font-size:12.5px}

.drop{
  border:1.5px dashed var(--line);border-radius:16px;background:var(--panel);
  padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;transition:.15s;
}
.drop.over{border-color:var(--accent);background:var(--panel-2)}
.drop svg{width:30px;height:30px;stroke:var(--muted);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop strong{font:500 15px var(--font-head)}
.drop span.sub{color:var(--muted);font-size:12.5px}
.drop.compact{flex-direction:row;flex-wrap:wrap;justify-content:space-between;text-align:left;padding:12px 16px;border-style:solid}
.drop.compact svg,.drop.compact .sub{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button,.btn{
  font:500 13px var(--font-ui);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);
  border-radius:10px;padding:8px 14px;cursor:pointer;min-height:36px;
}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=file]{display:none}

.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:2px;min-width:0}
.tabs button{white-space:nowrap;font-family:var(--font-mono);font-size:12px;padding:6px 11px;min-height:32px}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{border:0;border-radius:0;background:transparent;padding:6px 13px;min-height:32px}
.seg button[aria-pressed=true]{background:var(--panel-2);color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.opts{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.opts label{display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.opts input{accent-color:var(--accent);width:15px;height:15px}

.stage{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0;
  display:flex;flex-direction:column;align-items:center;gap:10px}
.stagebox{width:100%;display:flex;justify-content:center;overflow:hidden}
.frame{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#000;flex:none}
.frame.mobile{border-radius:26px;border-width:5px}
.frame iframe{border:0;display:block;transform-origin:0 0;background:#000}
.empty{color:var(--muted);text-align:center;padding:60px 16px;font-size:13px}
.status{align-self:stretch;font-family:var(--font-mono);font-size:12px;color:var(--muted);min-height:18px;word-break:break-all}
.warn{color:var(--warn)}
details{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:10px 14px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
.files{margin:10px 0 0;padding:0;list-style:none;font-family:var(--font-mono);font-size:12px;max-height:220px;overflow:auto;color:var(--muted)}
.files li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid var(--line)}
.files li span:first-child{word-break:break-all;color:var(--fg)}
.msg{padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:13px}
.msg.err{border-color:var(--err);color:var(--err)}

.work{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.work[data-mode="preview"] .editor{display:none}
.work[data-mode="editor"] .stage{display:none}
@media (min-width:900px){.work[data-mode="split"]{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.editor{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.edhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.edhead .row{justify-content:flex-end}
select{font:500 12.5px var(--font-mono);color:var(--fg);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 10px;min-height:36px;max-width:100%;min-width:0}
#edText{
  width:100%;height:min(62vh,520px);min-height:260px;resize:vertical;
  font:12.5px/1.6 var(--font-mono);color:var(--fg);background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:12px;tab-size:2;white-space:pre;overflow:auto;
}
#edText:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.edfoot{font-size:12px;color:var(--muted);font-family:var(--font-mono)}

.imgs{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.imgs h2{font:600 14px var(--font-head);margin:0}
.imggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.imgcard{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg);display:flex;flex-direction:column;gap:6px;min-width:0}
.thumb{height:92px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:repeating-conic-gradient(var(--panel-2) 0 25%,var(--bg) 0 50%) 50%/14px 14px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.imgname{font:11.5px/1.35 var(--font-mono);word-break:break-all}
.imgmeta{font:11px var(--font-mono);color:var(--muted)}
.imgcard .row{justify-content:flex-start;gap:6px}
.imgcard button{padding:5px 10px;min-height:30px;font-size:12px}
.tag{color:var(--warn)}
@media (max-width:520px){.seg button{padding:6px 10px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header>
    <div class="mark">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)">
        <path d="M5 18.5a27 27 0 0 1 38 0"/><path d="M11 25a18.5 18.5 0 0 1 26 0"/><path d="M17 31.5a10 10 0 0 1 14 0"/>
        <circle cx="24" cy="38" r="2.6" fill="currentColor" stroke="none"/>
      </svg>
    </div>
    <div>
      <h1>Hotspot Preview</h1>
      <p>Pratinjau template login hotspot MikroTik</p>
    </div>
  </header>

  <div class="drop" id="drop">
    <svg viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <div>
      <strong id="dropTitle">Seret file ZIP atau RAR ke sini</strong><br>
      <span class="sub">Berisi login.html, style, gambar. Diproses di browser, tidak diunggah ke server.</span>
    </div>
    <div class="row">
      <button class="primary" id="pick" type="button">Pilih file</button>
      <button id="demo" type="button">Muat contoh</button>
    </div>
    <input type="file" id="file" accept=".zip,.rar,application/zip,application/x-rar-compressed">
  </div>

  <div id="note"></div>

  <div id="workspace" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <div class="bar">
        <div class="tabs" id="tabs" role="tablist" aria-label="Halaman"></div>
        <div class="seg" id="devices" role="group" aria-label="Perangkat">
          <button type="button" data-d="mobile" aria-pressed="true">Ponsel</button>
          <button type="button" data-d="tablet" aria-pressed="false">Tablet</button>
          <button type="button" data-d="desktop" aria-pressed="false">Desktop</button>
        </div>
      </div>
      <div class="seg" id="modes" role="group" aria-label="Mode tampilan" style="align-self:flex-start">
        <button type="button" data-m="preview" aria-pressed="true">Preview</button>
        <button type="button" data-m="editor" aria-pressed="false">Editor</button>
        <button type="button" data-m="split" aria-pressed="false">Split</button>
      </div>
      <div class="opts">
        <label for="optChap"><input type="checkbox" id="optChap" checked> Login CHAP</label>
        <label for="optErr"><input type="checkbox" id="optErr"> Tampilkan error</label>
      </div>
      <div class="work" id="work" data-mode="preview">
      <section class="editor" id="editor" aria-label="Editor kode">
        <div class="edhead">
          <select id="edFile" aria-label="File yang diedit"></select>
          <div class="row">
            <button type="button" id="edReset">Reset</button>
            <button type="button" id="edCopy">Salin</button>
            <button type="button" id="edZip">Unduh ZIP</button>
          </div>
        </div>
        <textarea id="edText" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="Isi file"></textarea>
        <div class="imgs">
          <div class="edhead">
            <h2>Gambar</h2>
            <div class="row"><button type="button" id="imgAdd">Tambah gambar</button></div>
          </div>
          <div class="imggrid" id="imgGrid"></div>
          <input type="file" id="imgIn" accept="image/*">
        </div>
        <div class="edfoot" id="edInfo">Perubahan langsung tampil di preview. Tab menyisipkan spasi, Esc lalu Tab untuk keluar.</div>
      </section>
      <div class="stage">
        <div class="stagebox" id="stagebox">
          <div class="frame mobile" id="frame"><iframe id="view" title="Preview hotspot" sandbox="allow-scripts allow-forms"></iframe></div>
        </div>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      </div>
      <details>
        <summary id="fileSummary">Daftar file</summary>
        <ul class="files" id="fileList"></ul>
      </details>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var S={files:new Map(),pages:[],cur:null,device:"mobile",name:"",mode:"preview",edit:null};
var SIZES={mobile:[390,780],tablet:[768,1024],desktop:[1280,720]};
var MIME={png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",gif:"image/gif",svg:"image/svg+xml",webp:"image/webp",ico:"image/x-icon",bmp:"image/bmp",avif:"image/avif",woff:"font/woff",woff2:"font/woff2",ttf:"font/ttf",otf:"font/otf",mp4:"video/mp4",webm:"video/webm",mp3:"audio/mpeg",css:"text/css",js:"text/javascript"};
var ORDER=["login","alogin","status","logout","error","redirect","rlogin","flogout","radvert","fstatus"];
var missing=new Set();

/* ---------- template engine MikroTik ---------- */
function renderTpl(tpl,vars){
  var re=/\$\((if|elif|else|endif)\b([^)]*)\)/g,out="",last=0,m,stack=[],active=true;
  function cond(e){
    e=e.trim();
    var mm=e.match(/^([\w-]+)\s*(==|!=)\s*['"]?(.*?)['"]?$/);
    if(mm){var v=String(vars[mm[1]]==null?"":vars[mm[1]]);return mm[2]==="=="?v===mm[3]:v!==mm[3]}
    var x=vars[e];return !!x&&x!=="0"&&x!=="no";
  }
  while((m=re.exec(tpl))){
    if(active)out+=tpl.slice(last,m.index);
    last=re.lastIndex;
    var s;
    if(m[1]==="if"){var c=active&&cond(m[2]);stack.push({parent:active,taken:c});active=c}
    else if(m[1]==="elif"){s=stack[stack.length-1];if(!s)continue;if(s.taken||!s.parent)active=false;else{var c2=cond(m[2]);s.taken=c2;active=c2}}
    else if(m[1]==="else"){s=stack[stack.length-1];if(!s)continue;active=s.parent&&!s.taken;s.taken=true}
    else{s=stack.pop();if(s)active=s.parent}
  }
  if(active)out+=tpl.slice(last);
  return out.replace(/\$\(([\w-]+)\)/g,function(_,k){return vars[k]==null?"":vars[k]});
}
window.__renderTpl=renderTpl;

function sampleVars(page){
  var chap=$("#optChap").checked,errOn=$("#optErr").checked||page==="error.html";
  return {
    "username":"fikri","ip":"192.168.88.254","mac":"AA:BB:CC:DD:EE:FF","uptime":"1h23m","session-time-left":"2h36m",
    "session-timeout":"4h","idle-timeout":"5m","bytes-in-nice":"124.5 MiB","bytes-out-nice":"18.2 MiB",
    "bytes-in":"130547712","bytes-out":"19084083","remain-bytes-total-nice":"875.5 MiB","limit-bytes-total":"1073741824",
    "hostname":"Fikri.net","identity":"Fikri.net","server-name":"hotspot1","interface-name":"bridge-hotspot",
    "link-login":"#to-login","link-login-only":"#to-login","link-status":"#to-status","link-logout":"#to-logout",
    "link-redirect":"#to-redirect","link-orig":"https://example.com/","link-orig-esc":"https%3A%2F%2Fexample.com%2F",
    "popup":"false","trial":"","refresh-timeout":"","logged-in":"yes",
    "error":errOn?(page==="error.html"?"no more sessions are allowed for user fikri":"invalid username or password"):"",
    "chap-id":chap?"\\134":"","chap-challenge":chap?"\\204\\311\\010\\172\\045\\301\\067\\112":""
  };
}

/* ---------- aset ---------- */
function resolve(ref){
  if(!ref)return null;
  ref=String(ref).trim();
  if(/^(data:|https?:|\/\/|#|mailto:|tel:|javascript:|about:)/i.test(ref))return null;
  ref=ref.split("#")[0].split("?")[0];
  try{ref=decodeURIComponent(ref)}catch(e){}
  var parts=[];ref.replace(/\\/g,"/").split("/").forEach(function(p){
    if(!p||p===".")return; if(p==="..")parts.pop(); else parts.push(p);
  });
  return parts.join("/").toLowerCase();
}
function getFile(ref){
  var k=resolve(ref);if(k==null)return null;
  var f=S.files.get(k);
  if(!f&&k){missing.add(ref)}
  return f||null;
}
function mimeOf(n){var e=(n.split(".").pop()||"").toLowerCase();return MIME[e]||"application/octet-stream"}
function b64(bytes){
  var s="",i,CH=0x8000;
  for(i=0;i<bytes.length;i+=CH)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+CH));
  return btoa(s);
}
var dcache=new Map();
function dataUrl(f){
  if(dcache.has(f.name))return dcache.get(f.name);
  var u="data:"+mimeOf(f.name)+";base64,"+b64(f.data);
  dcache.set(f.name,u);return u;
}
function text(f){
  try{return new TextDecoder("utf-8",{fatal:true}).decode(f.data)}
  catch(e){return new TextDecoder("windows-1252").decode(f.data)}
}
function rewriteCss(css){
  return css.replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g,function(all,q,ref){
    var f=getFile(ref);return f?'url("'+dataUrl(f)+'")':all;
  });
}

var INJECT="(function(){function send(t,x){parent.postMessage({hsPreview:1,type:t,target:x},'*')}"+
"function route(u){var m=String(u||'').match(/to-([a-z]+)/);return m?m[1]:null}"+
"document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a'):null;if(!a)return;e.preventDefault();var h=a.getAttribute('href')||'';send('nav',route(h)||h)},true);"+
"document.addEventListener('submit',function(e){e.preventDefault();send('submit',route(e.target.getAttribute('action')))},true);"+
"HTMLFormElement.prototype.submit=function(){send('submit',route(this.getAttribute('action')))};"+
"window.addEventListener('hashchange',function(){var r=route(location.hash);if(r)send('nav',r)});"+
"window.open=function(){send('popup','');return null};})();";

function buildDoc(html){
  var doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(function(l){
    var f=getFile(l.getAttribute("href"));
    if(f){var st=doc.createElement("style");st.textContent=rewriteCss(text(f));l.replaceWith(st)}
  });
  doc.querySelectorAll('link[rel~="icon"],link[rel~="shortcut"]').forEach(function(l){
    var f=getFile(l.getAttribute("href"));if(f)l.setAttribute("href",dataUrl(f));
  });
  doc.querySelectorAll("script[src]").forEach(function(s){
    var f=getFile(s.getAttribute("src"));
    if(f){s.removeAttribute("src");s.textContent=text(f).replace(/<\/script/gi,"<\\/script")}
  });
  doc.querySelectorAll("img[src],source[src],video[src],audio[src],input[src],embed[src]").forEach(function(e){
    var f=getFile(e.getAttribute("src"));if(f)e.setAttribute("src",dataUrl(f));
  });
  doc.querySelectorAll("[poster]").forEach(function(e){var f=getFile(e.getAttribute("poster"));if(f)e.setAttribute("poster",dataUrl(f))});
  doc.querySelectorAll("[background]").forEach(function(e){var f=getFile(e.getAttribute("background"));if(f)e.setAttribute("background",dataUrl(f))});
  doc.querySelectorAll("style").forEach(function(s){s.textContent=rewriteCss(s.textContent)});
  doc.querySelectorAll("[style]").forEach(function(e){e.setAttribute("style",rewriteCss(e.getAttribute("style")))});
  var sc=doc.createElement("script");sc.textContent=INJECT;
  doc.head.insertBefore(sc,doc.head.firstChild);
  doc.querySelectorAll("base").forEach(function(b){b.remove()});
  var bs=doc.createElement("base");bs.setAttribute("href","about:srcdoc");
  doc.head.insertBefore(bs,doc.head.firstChild);
  return "<!DOCTYPE html>"+doc.documentElement.outerHTML;
}

/* ---------- render ---------- */
function render(){
  if(!S.cur)return;
  missing=new Set();
  var f=S.files.get(S.cur.toLowerCase());
  if(!f)return;
  var out;
  try{out=buildDoc(renderTpl(text(f),sampleVars(S.cur)))}
  catch(e){setStatus("Gagal merender: "+e.message,true);return}
  $("#view").srcdoc=out;
  var m=Array.from(missing);
  setStatus(m.length?"File tidak ditemukan: "+m.join(", "):"Menampilkan "+S.cur,m.length>0);
  fit();
}
function setStatus(t,warn){var s=$("#status");s.textContent=t;s.className="status"+(warn?" warn":"")}
function fit(){
  var d=SIZES[S.device],box=$("#stagebox"),fr=$("#frame"),ifr=$("#view");
  var bw=S.device==="mobile"?10:2;
  var avail=box.clientWidth||d[0];
  var sc=Math.min(1,(avail-bw)/d[0]);
  fr.className="frame "+(S.device==="mobile"?"mobile":"");
  ifr.style.width=d[0]+"px";ifr.style.height=d[1]+"px";
  ifr.style.transform="scale("+sc+")";
  fr.style.width=(d[0]*sc+bw)+"px";fr.style.height=(d[1]*sc+bw)+"px";
}
window.addEventListener("resize",fit);
if(window.ResizeObserver)new ResizeObserver(fit).observe($("#stagebox"));

function go(page){
  if(!S.files.has(page.toLowerCase()))return false;
  S.cur=page;drawTabs();render();
  if(S.mode!=="preview")openEd(page);
  return true;
}
function pageFor(name){
  var n=name+".html";
  var hit=S.pages.filter(function(p){return p.toLowerCase()===n||p.toLowerCase()===name+".htm"})[0];
  return hit||null;
}
window.addEventListener("message",function(e){
  var d=e.data;
  if(!d||!d.hsPreview||e.source!==$("#view").contentWindow)return;
  var t=d.target;
  if(d.type==="popup"){setStatus("Halaman membuka jendela popup status (dinonaktifkan di preview)");return}
  if(d.type==="submit"){
    if(t==="logout"){var lo=pageFor("logout");if(lo){go(lo);setStatus("Form logout dikirim, membuka "+lo);return}}
    if(t==="login"||!t){
      var al=pageFor("alogin")||pageFor("status");
      if(al){go(al);setStatus("Form login dikirim, membuka "+al);return}
    }
    setStatus("Form dikirim ke "+(t||"tujuan lain"));return;
  }
  if(d.type==="nav"){
    if(t==="redirect"){setStatus("Redirect ke https://example.com/ (tidak dibuka di preview)");return}
    var p=t&&pageFor(t);
    if(p){go(p);return}
    if(t&&/^(login|status|logout|advert)$/.test(t)){setStatus("Halaman "+t+".html tidak ada di paket",true);return}
    setStatus("Link keluar: "+t);
  }
});

/* ---------- UI ---------- */
function drawTabs(){
  var tabs=$("#tabs");tabs.innerHTML="";
  S.pages.forEach(function(p){
    var b=document.createElement("button");b.type="button";b.setAttribute("role","tab");
    b.textContent=p;b.setAttribute("aria-selected",String(p===S.cur));
    b.addEventListener("click",function(){go(p)});tabs.appendChild(b);
  });
}
function drawFiles(){
  var ul=$("#fileList");ul.innerHTML="";var n=0,tot=0;
  S.files.forEach(function(f){
    n++;tot+=f.data.length;
    var li=document.createElement("li"),a=document.createElement("span"),b=document.createElement("span");
    a.textContent=f.name;b.textContent=f.data.length>1024?(f.data.length/1024).toFixed(1)+" KB":f.data.length+" B";
    li.appendChild(a);li.appendChild(b);ul.appendChild(li);
  });
  $("#fileSummary").textContent="Daftar file ("+n+" file, "+(tot/1024).toFixed(0)+" KB)";
}
function note(t,err){var n=$("#note");n.innerHTML="";if(!t)return;var d=document.createElement("div");d.className="msg"+(err?" err":"");d.textContent=t;n.appendChild(d)}

function loadEntries(entries,name){
  entries=entries.filter(function(e){
    return !/(^|\/)(__MACOSX\/|\.DS_Store$|Thumbs\.db$)/i.test(e.path);
  });
  var htmls=entries.filter(function(e){return /\.html?$/i.test(e.path)});
  if(!htmls.length)throw new Error("Tidak ada file .html di dalam arsip.");
  var depth=function(e){return e.path.split("/").length};
  var logins=htmls.filter(function(e){return /(^|\/)login\.html?$/i.test(e.path)}).sort(function(a,b){return depth(a)-depth(b)});
  var root=(logins[0]||htmls.sort(function(a,b){return depth(a)-depth(b)})[0]).path;
  var base=root.indexOf("/")>=0?root.slice(0,root.lastIndexOf("/")+1):"";
  S.files=new Map();dcache=new Map();
  entries.forEach(function(e){
    if(e.path.indexOf(base)!==0)return;
    var rel=e.path.slice(base.length);if(!rel)return;
    S.files.set(rel.toLowerCase(),{name:rel,data:e.data,orig:e.data});
  });
  S.pages=[];
  S.files.forEach(function(f){if(f.name.indexOf("/")<0&&/\.html?$/i.test(f.name))S.pages.push(f.name)});
  S.pages.sort(function(a,b){
    var ia=ORDER.indexOf(a.replace(/\.html?$/i,"").toLowerCase()),ib=ORDER.indexOf(b.replace(/\.html?$/i,"").toLowerCase());
    return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b);
  });
  S.cur=S.pages[0];S.name=name;S.edit=null;
  $("#workspace").hidden=false;
  $("#drop").classList.add("compact");
  $("#dropTitle").textContent=name;
  note(base?("Folder dasar terdeteksi: "+base):"");
  drawTabs();drawFiles();render();drawEd();drawImgs();
  if(S.mode!=="preview")openEd(S.cur);
}

async function readZip(buf){
  if(typeof JSZip==="undefined")throw new Error("Pustaka ZIP gagal dimuat. Periksa koneksi lalu muat ulang halaman.");
  var zip=await JSZip.loadAsync(buf),out=[];
  var list=Object.keys(zip.files).map(function(k){return zip.files[k]}).filter(function(f){return !f.dir});
  for(var i=0;i<list.length;i++)out.push({path:list[i].name.replace(/\\/g,"/"),data:await list[i].async("uint8array")});
  return out;
}
async function readRar(buf){
  var base="https://cdn.jsdelivr.net/npm/node-unrar-js@2.0.2/esm/";
  var mod,wasm;
  try{
    mod=await import(base+"index.esm.js");
    wasm=await (await fetch(base+"js/unrar.wasm")).arrayBuffer();
  }catch(e){
    throw new Error("Pembaca RAR tidak bisa dimuat di halaman ini. Ubah file ke ZIP, atau buka versi file HTML lokal.");
  }
  var ex=await mod.createExtractorFromData({data:new Uint8Array(buf),wasmBinary:wasm});
  var res=ex.extract(),out=[];
  for(var f of res.files){
    if(f.fileHeader.flags.directory||!f.extraction)continue;
    out.push({path:f.fileHeader.name.replace(/\\/g,"/"),data:f.extraction.data});
  }
  return out;
}
async function handleFile(file){
  note("Membaca "+file.name+"...");
  try{
    var buf=await file.arrayBuffer(),isRar=/\.rar$/i.test(file.name)||new Uint8Array(buf.slice(0,4))[0]===0x52;
    var entries=isRar?await readRar(buf):await readZip(buf);
    loadEntries(entries,file.name);
  }catch(e){note(e.message||String(e),true)}
}

/* ---------- editor ---------- */
var EDITABLE=/\.(html?|css|js|txt|svg|json)$/i;
var edTimer=null,tabFree=false;
function isMod(f){return f.data!==f.orig}
function drawEd(){
  var sel=$("#edFile");sel.innerHTML="";
  var names=[];S.files.forEach(function(f){if(EDITABLE.test(f.name))names.push(f)});
  names.sort(function(a,b){return a.name.localeCompare(b.name)});
  names.forEach(function(f){
    var o=document.createElement("option");o.value=f.name;
    o.textContent=f.name+(isMod(f)?"  (diubah)":"");
    if(f.name===S.edit)o.selected=true;sel.appendChild(o);
  });
}
function openEd(name){
  var f=S.files.get(String(name).toLowerCase());
  if(!f){return}
  S.edit=f.name;
  $("#edText").value=text(f);
  drawEd();
  var sel=$("#edFile");sel.value=f.name;
  $("#edInfo").textContent=f.name+" - "+f.data.length+" byte";
}
function commitEd(){
  var f=S.files.get(String(S.edit||"").toLowerCase());if(!f)return;
  var v=$("#edText").value;
  f.data=v===text({data:f.orig})?f.orig:new TextEncoder().encode(v);
  dcache.delete(f.name);
  drawEd();drawFiles();
  $("#edInfo").textContent=f.name+" - "+f.data.length+" byte"+(isMod(f)?" - diubah":"");
  render();
}
function setMode(m){
  S.mode=m;
  $("#work").setAttribute("data-mode",m);
  $("#modes").querySelectorAll("button").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.m===m))});
  if(m!=="preview"&&S.files.size){
    var cur=S.edit&&S.files.has(S.edit.toLowerCase())?S.edit:S.cur;
    openEd(cur);
  }
  setTimeout(fit,30);
}
$("#modes").addEventListener("click",function(e){var b=e.target.closest("button[data-m]");if(b)setMode(b.dataset.m)});
$("#edText").addEventListener("input",function(){clearTimeout(edTimer);edTimer=setTimeout(commitEd,250)});
$("#edText").addEventListener("keydown",function(e){
  if(e.key==="Escape"){tabFree=true;return}
  if(e.key==="Tab"&&!tabFree&&!e.shiftKey){
    e.preventDefault();
    var t=this,s=t.selectionStart,en=t.selectionEnd;
    t.value=t.value.slice(0,s)+"  "+t.value.slice(en);
    t.selectionStart=t.selectionEnd=s+2;
    t.dispatchEvent(new Event("input"));
    return;
  }
  tabFree=false;
});
$("#edFile").addEventListener("change",function(){
  var n=this.value;
  var isPage=S.pages.some(function(p){return p===n});
  openEd(n);
  if(isPage&&S.cur!==n){S.cur=n;drawTabs();render()}
});
$("#edReset").addEventListener("click",function(){
  var f=S.files.get(String(S.edit||"").toLowerCase());if(!f||!isMod(f))return;
  f.data=f.orig;dcache.delete(f.name);openEd(f.name);drawFiles();render();
});
$("#edCopy").addEventListener("click",function(){
  var ta=$("#edText"),v=ta.value;
  var done=function(){$("#edInfo").textContent="Isi file disalin ke clipboard."};
  var fail=function(){ta.focus();ta.select();$("#edInfo").textContent="Teks dipilih, salin manual dengan menu salin."};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(v).then(done,fail);else fail();
});
$("#edZip").addEventListener("click",async function(){
  var info=$("#edInfo");
  try{
    if(typeof JSZip==="undefined")throw new Error("pustaka ZIP belum termuat");
    var z=new JSZip(),dir="hotspot/";
    S.files.forEach(function(f){z.file(dir+f.name,f.data)});
    var blob=await z.generateAsync({type:"blob"});
    var fname=(S.name||"hotspot").replace(/\.(zip|rar)$/i,"")+"-edit.zip";
    var dl=null;
    try{if(window.claude&&window.claude.use)dl=await window.claude.use("downloads")}catch(e){}
    if(dl){
      try{await dl.save({filename:fname,data:blob});info.textContent="ZIP hasil edit disimpan: "+fname}
      catch(e){info.textContent=e&&e.code==="declined"?"Unduhan dibatalkan.":"Unduhan gagal ("+(e&&e.code||"error")+"). Pakai Salin per file."}
      return;
    }
    if(location.protocol==="file:"){
      var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=fname;
      document.body.appendChild(a);a.click();a.remove();
      info.textContent="ZIP hasil edit diunduh.";return;
    }
    info.textContent="Unduhan tidak tersedia di tampilan ini. Pakai Salin per file, atau buka versi file HTML lokal.";
  }catch(e){info.textContent="Gagal membuat ZIP: "+e.message}
});

/* ---------- gambar ---------- */
var IMGEXT=/\.(png|jpe?g|gif|webp|svg|bmp|avif|ico)$/i;
var imgTarget=null;
function kb(n){return n>1024?(n/1024).toFixed(n>10240?0:1)+" KB":n+" B"}
function drawImgs(){
  var g=$("#imgGrid");g.innerHTML="";
  var list=[];S.files.forEach(function(f){if(IMGEXT.test(f.name))list.push(f)});
  list.sort(function(a,b){return a.name.localeCompare(b.name)});
  if(!list.length){var e=document.createElement("div");e.className="imgmeta";e.textContent="Belum ada gambar di paket ini.";g.appendChild(e);return}
  list.forEach(function(f){
    var c=document.createElement("div");c.className="imgcard";
    var t=document.createElement("div");t.className="thumb";
    var im=document.createElement("img");im.alt=f.name;im.src=dataUrl(f);t.appendChild(im);
    var n=document.createElement("div");n.className="imgname";n.textContent=f.name;
    var m=document.createElement("div");m.className="imgmeta";
    m.textContent=kb(f.data.length)+(f.orig==null?" - baru":isMod(f)?" - diganti":"");
    var r=document.createElement("div");r.className="row";
    var b1=document.createElement("button");b1.type="button";b1.textContent="Ganti";
    b1.addEventListener("click",function(){imgTarget=f.name;$("#imgIn").click()});
    r.appendChild(b1);
    if(f.orig==null){
      var bd=document.createElement("button");bd.type="button";bd.textContent="Hapus";
      bd.addEventListener("click",function(){S.files.delete(f.name.toLowerCase());dcache.delete(f.name);afterImg();});
      r.appendChild(bd);
    }else if(isMod(f)){
      var br=document.createElement("button");br.type="button";br.textContent="Reset";
      br.addEventListener("click",function(){f.data=f.orig;dcache.delete(f.name);afterImg()});
      r.appendChild(br);
    }
    c.appendChild(t);c.appendChild(n);c.appendChild(m);c.appendChild(r);g.appendChild(c);
  });
}
function afterImg(){drawImgs();drawFiles();drawEd();render()}
async function decodeImg(file){
  try{return await createImageBitmap(file)}catch(e){}
  return await new Promise(function(res,rej){
    var u=URL.createObjectURL(file),im=new Image();
    im.onload=function(){res({img:im,width:im.naturalWidth||512,height:im.naturalHeight||512,url:u})};
    im.onerror=function(){rej(new Error("format gambar tidak dikenali"))};
    im.src=u;
  });
}
async function encodeImg(file,ext){
  /* samakan format dengan nama file tujuan agar referensi tetap valid */
  var isSvg=file.type==="image/svg+xml"||/\.svg$/i.test(file.name);
  if(ext==="gif"||ext==="ico"||ext==="bmp"||ext==="avif"||(ext==="svg"&&isSvg)){
    return new Uint8Array(await file.arrayBuffer());
  }
  var d=await decodeImg(file),src=d.img||d;
  var W=d.width,H=d.height;
  var max=ext==="png"?1024:1600,sc=Math.min(1,max/Math.max(W,H));
  var w=Math.max(1,Math.round(W*sc)),h=Math.max(1,Math.round(H*sc));
  var cv=document.createElement("canvas");cv.width=w;cv.height=h;
  var cx=cv.getContext("2d");
  if(ext==="jpg"||ext==="jpeg"){cx.fillStyle="#000";cx.fillRect(0,0,w,h)}
  cx.drawImage(src,0,0,w,h);
  if(d.url)URL.revokeObjectURL(d.url);
  if(ext==="svg"){
    var png=cv.toDataURL("image/png");
    return new TextEncoder().encode('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'"><image width="'+w+'" height="'+h+'" href="'+png+'"/></svg>');
  }
  var type=ext==="png"?"image/png":ext==="webp"?"image/webp":"image/jpeg";
  var blob=await new Promise(function(res){cv.toBlob(res,type,0.85)});
  if(!blob)throw new Error("gagal menyimpan gambar");
  return new Uint8Array(await blob.arrayBuffer());
}
$("#imgAdd").addEventListener("click",function(){imgTarget="";$("#imgIn").click()});
$("#imgIn").addEventListener("change",async function(){
  var file=this.files[0];this.value="";
  if(!file)return;
  var info=$("#edInfo");
  try{
    if(imgTarget){
      var f=S.files.get(imgTarget.toLowerCase());if(!f)return;
      var ext=f.name.split(".").pop().toLowerCase();
      f.data=await encodeImg(file,ext);dcache.delete(f.name);
      info.textContent=f.name+" diganti ("+kb(f.data.length)+")"+(f.data.length>400*1024?". Ukuran besar, router bisa lambat memuatnya.":"");
    }else{
      var base=file.name.replace(/[^\w.\-]+/g,"_"),ex=(base.split(".").pop()||"png").toLowerCase();
      var nm="img/"+base,k=1;
      while(S.files.has(nm.toLowerCase())){nm="img/"+base.replace(/(\.[^.]+)$/,"-"+(k++)+"$1")}
      var data=await encodeImg(file,ex);
      S.files.set(nm.toLowerCase(),{name:nm,data:data,orig:null});
      info.textContent="Ditambahkan "+nm+". Pakai di kode dengan src atau url ke path itu.";
    }
    afterImg();
  }catch(e){info.textContent="Gagal memproses gambar: "+e.message}
});
