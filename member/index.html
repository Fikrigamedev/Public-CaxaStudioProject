<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Limitless</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, deleteDoc, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAq-wdlmB3N1ILspNT6N2evzWYf5vhI5-U",
  authDomain: "limitless-gank.firebaseapp.com",
  projectId: "limitless-gank",
  storageBucket: "limitless-gank.firebasestorage.app",
  messagingSenderId: "903851898250",
  appId: "1:903851898250:web:03e5da2b64dce0013bc473"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);

const DEVELOPER_EMAIL = "kriiaja48@gmail.com";

let currentUser = null;
let replyTo = null;
let unsubMessages = null;

window.loginWithGoogle = async () => {
  const provider = new GoogleAuthProvider();
  try { await signInWithPopup(auth, provider); } catch(e) { console.error(e); }
};

window.logout = async () => { await signOut(auth); };

onAuthStateChanged(auth, async (user) => {
  currentUser = user;
  if (user) {
    const userRef = doc(db, "users", user.uid);
    const snap = await getDoc(userRef);
    if (!snap.exists()) {
      await setDoc(userRef, {
        uid: user.uid,
        email: user.email,
        username: user.displayName || user.email.split("@")[0],
        photoURL: user.photoURL || "",
        createdAt: serverTimestamp()
      });
    }
    showApp();
    loadProfile();
    startMessages();
  } else {
    showLogin();
  }
});

function showLogin() {
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("app-screen").style.display = "none";
}
function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
}

window.switchPage = (page) => {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".nav-item").forEach(n => n.classList.remove("active"));
  document.getElementById("page-" + page).classList.add("active");
  document.querySelector(`.nav-item[data-page="${page}"]`).classList.add("active");
  if (page === "chat") startMessages();
  if (page === "profile") loadProfile();
};

function startMessages() {
  if (unsubMessages) unsubMessages();
  const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
  unsubMessages = onSnapshot(q, async (snap) => {
    const box = document.getElementById("messages-box");
    const wasAtBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = "";
    for (const d of snap.docs) {
      const msg = { id: d.id, ...d.data() };
      box.appendChild(buildMsgEl(msg));
    }
    if (wasAtBottom) box.scrollTop = box.scrollHeight;
  });
}

function esc(str) {
  if (!str) return "";
  return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function buildMsgEl(msg) {
  const isMine = currentUser && msg.uid === currentUser.uid;
  const isDev = msg.email === DEVELOPER_EMAIL;
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (isMine ? "mine" : "theirs");
  wrap.dataset.id = msg.id;

  const avatarSrc = msg.photoURL || "";
  const avatarEl = avatarSrc
    ? `<img src="${esc(avatarSrc)}" class="msg-avatar" onerror="this.outerHTML='<div class=msg-avatar-ph>${(msg.username||"?")[0].toUpperCase()}</div>'">`
    : `<div class="msg-avatar-ph">${(msg.username||"?")[0].toUpperCase()}</div>`;

  const devBadge = isDev ? `<span class="badge-dev">DEV</span>` : "";
  const time = msg.createdAt ? new Date(msg.createdAt.toDate()).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"}) : "";

  let replyHtml = "";
  if (msg.replyTo) {
    replyHtml = `<div class="reply-strip"><b>${esc(msg.replyTo.username)}</b> ${esc(msg.replyTo.text||"[Foto]")}</div>`;
  }

  let content = "";
  if (msg.imageURL) {
    content = `<img src="${esc(msg.imageURL)}" class="msg-img" onclick="openImg('${esc(msg.imageURL)}')">`;
    if (msg.text) content += `<p class="msg-text">${esc(msg.text)}</p>`;
  } else {
    content = `<p class="msg-text">${esc(msg.text)}</p>`;
  }

  const safeUser = (msg.username||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  const safeText = (msg.text||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/\n/g," ");

  const replyBtn = `<button class="act-btn" onclick="setReply('${esc(msg.id)}','${safeUser}','${safeText}')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg> Balas</button>`;
  const delBtn = isMine ? `<button class="act-btn act-del" onclick="deleteMsg('${esc(msg.id)}')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg> Hapus</button>` : "";

  wrap.innerHTML = `
    <div class="msg-inner">
      ${!isMine ? `<div class="msg-av-wrap">${avatarEl}</div>` : ""}
      <div class="msg-col ${isMine?"align-end":""}">
        ${!isMine ? `<div class="msg-meta"><span class="msg-uname">${esc(msg.username||"User")}</span>${devBadge}</div>` : ""}
        <div class="msg-bubble ${isMine?"bubble-mine":"bubble-theirs"}">
          ${replyHtml}${content}
        </div>
        <div class="msg-acts">
          ${replyBtn}${delBtn}
          <span class="msg-time">${time}</span>
        </div>
      </div>
      ${isMine ? `<div class="msg-av-wrap">${avatarEl}</div>` : ""}
    </div>`;
  return wrap;
}

window.setReply = (id, username, text) => {
  replyTo = { id, username, text };
  document.getElementById("reply-bar").style.display = "flex";
  document.getElementById("rb-name").textContent = username;
  document.getElementById("rb-text").textContent = text || "[Foto]";
};

window.clearReply = () => {
  replyTo = null;
  document.getElementById("reply-bar").style.display = "none";
};

window.deleteMsg = async (id) => {
  if (!confirm("Hapus pesan ini?")) return;
  await deleteDoc(doc(db, "messages", id));
};

window.openImg = (url) => {
  document.getElementById("img-ov-img").src = url;
  document.getElementById("img-ov").style.display = "flex";
};
window.closeImg = () => { document.getElementById("img-ov").style.display = "none"; };

window.sendMessage = async () => {
  if (!currentUser) return;
  const inp = document.getElementById("chat-input");
  const fi = document.getElementById("chat-file");
  const text = inp.value.trim();
  const file = fi.files[0];
  if (!text && !file) return;

  const userSnap = await getDoc(doc(db, "users", currentUser.uid));
  const ud = userSnap.exists() ? userSnap.data() : {};

  let imageURL = null;
  if (file) {
    const sRef = ref(storage, `chat-images/${Date.now()}_${file.name}`);
    await uploadBytes(sRef, file);
    imageURL = await getDownloadURL(sRef);
    fi.value = "";
    document.getElementById("fp").style.display = "none";
  }

  await addDoc(collection(db, "messages"), {
    uid: currentUser.uid,
    email: currentUser.email,
    username: ud.username || currentUser.displayName || "User",
    photoURL: ud.photoURL || currentUser.photoURL || "",
    text: text || "",
    imageURL: imageURL || null,
    replyTo: replyTo || null,
    createdAt: serverTimestamp()
  });

  inp.value = "";
  autoResize(inp);
  clearReply();
};

window.handleFileSelect = () => {
  const file = document.getElementById("chat-file").files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById("fp-img").src = e.target.result;
    document.getElementById("fp").style.display = "flex";
  };
  reader.readAsDataURL(file);
};

window.removeFile = () => {
  document.getElementById("chat-file").value = "";
  document.getElementById("fp").style.display = "none";
};

window.autoResize = (el) => {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
};

async function loadProfile() {
  if (!currentUser) return;
  const snap = await getDoc(doc(db, "users", currentUser.uid));
  const d = snap.exists() ? snap.data() : {};
  document.getElementById("p-uname-input").value = d.username || "";
  document.getElementById("p-email").textContent = d.email || currentUser.email || "";
  document.getElementById("p-name-text").textContent = d.username || "";
  const isDev = (d.email || currentUser.email) === DEVELOPER_EMAIL;
  document.getElementById("p-dev-badge").style.display = isDev ? "inline-flex" : "none";
  const photo = d.photoURL || currentUser.photoURL || "";
  setProfileAvatar(photo, d.username || "?");
}

function setProfileAvatar(url, name) {
  const img = document.getElementById("p-av-img");
  const ph = document.getElementById("p-av-ph");
  if (url) {
    img.src = url;
    img.style.display = "block";
    ph.style.display = "none";
  } else {
    img.style.display = "none";
    ph.style.display = "flex";
    ph.textContent = (name||"?")[0].toUpperCase();
  }
}

window.saveProfile = async () => {
  if (!currentUser) return;
  const username = document.getElementById("p-uname-input").value.trim();
  if (!username) { alert("Username tidak boleh kosong."); return; }
  const fi = document.getElementById("p-photo-input");
  const file = fi.files[0];
  let photoURL = null;
  if (file) {
    const sRef = ref(storage, `avatars/${currentUser.uid}`);
    await uploadBytes(sRef, file);
    photoURL = await getDownloadURL(sRef);
  }
  const update = { username };
  if (photoURL) update.photoURL = photoURL;
  await setDoc(doc(db, "users", currentUser.uid), update, { merge: true });
  document.getElementById("p-name-text").textContent = username;
  alert("Profil tersimpan.");
  loadProfile();
};

window.triggerPhoto = () => document.getElementById("p-photo-input").click();
window.previewPhoto = () => {
  const file = document.getElementById("p-photo-input").files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = e => {
    document.getElementById("p-av-img").src = e.target.result;
    document.getElementById("p-av-img").style.display = "block";
    document.getElementById("p-av-ph").style.display = "none";
  };
  r.readAsDataURL(file);
};

document.addEventListener("DOMContentLoaded", () => {
  const inp = document.getElementById("chat-input");
  if (inp) {
    inp.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    inp.addEventListener("input", () => autoResize(inp));
  }
});
</script>

<style>
:root {
  /* Light theme — beige/olive like foto referensi */
  --bg:      #ddd8ce;
  --bg2:     #e8e3d8;
  --bg3:     #cec9be;
  --card:    #e8e3d8;
  --border:  #b8b2a5;
  --text:    #2a2820;
  --text2:   #5a5648;
  --text3:   #8a8478;
  --accent:  #3d5229;   /* dark olive green */
  --accent2: #4e6a33;
  --accent3: #2c3d1e;
  --accent-soft: #d4ddc8;
  --bubble-mine: #3d5229;
  --bubble-mine-t: #f0ede6;
  --bubble-theirs: #f0ede6;
  --bubble-theirs-t: #2a2820;
  --topbar-h: 52px;
  --nav-h:    46px;
  --r: 0px;
  --shadow: 0 1px 4px rgba(0,0,0,0.10);
  --shadow-lg: 0 4px 20px rgba(0,0,0,0.15);
}
[data-theme="dark"] {
  --bg:      #1a1c16;
  --bg2:     #22251c;
  --bg3:     #2c302a;
  --card:    #252820;
  --border:  #3a3e34;
  --text:    #e8e4d8;
  --text2:   #9a9688;
  --text3:   #5e5c54;
  --accent:  #7aaa4a;
  --accent2: #8bbf5a;
  --accent3: #5d8836;
  --accent-soft: #1e2818;
  --bubble-mine: #5a8a32;
  --bubble-mine-t: #f0ede6;
  --bubble-theirs: #2c302a;
  --bubble-theirs-t: #e8e4d8;
  --shadow: 0 1px 4px rgba(0,0,0,0.4);
  --shadow-lg: 0 6px 28px rgba(0,0,0,0.5);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{
  font-family:'Space Grotesk',sans-serif;
  background:var(--bg);color:var(--text);
  transition:background .35s,color .35s;
}

/* ── TOPBAR ── */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:200;
  height:var(--topbar-h);
  background:var(--bg2);
  border-bottom:2px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;
}

/* Logo — infinity symbol kotak tebal seperti di foto */
.logo-mark{
  display:flex;align-items:center;gap:0;
}
.logo-infinity{
  font-size:26px;font-weight:900;
  font-family:'Barlow Condensed',sans-serif;
  color:var(--accent);
  letter-spacing:-1px;
  line-height:1;
}

/* Theme toggle — kotak seperti di foto */
.theme-toggle{
  position:relative;
  display:flex;align-items:center;
  cursor:pointer;
}
.theme-toggle input{display:none;}
.t-track{
  width:52px;height:26px;
  background:var(--bg3);
  border:2px solid var(--border);
  border-radius:0;
  position:relative;
  transition:background .25s,border-color .25s;
  display:flex;align-items:center;
}
.theme-toggle input:checked~.t-track{
  background:var(--accent);
  border-color:var(--accent3);
}
.t-knob{
  position:absolute;left:2px;
  width:18px;height:18px;
  background:#fff;
  border-radius:0;
  box-shadow:0 1px 3px rgba(0,0,0,.2);
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.theme-toggle input:checked~.t-track .t-knob{transform:translateX(26px);}

/* Moon/sun icon inside toggle */
.t-icon{
  position:absolute;right:4px;
  width:13px;height:13px;
  color:var(--text2);
  transition:opacity .2s;
  pointer-events:none;
}
.theme-toggle input:checked~.t-track .t-icon{color:#fff;right:auto;left:4px;}

/* ── NAVBAR ── */
.navbar{
  position:fixed;top:var(--topbar-h);left:0;right:0;z-index:190;
  height:var(--nav-h);
  background:var(--bg2);
  border-bottom:2px solid var(--border);
  display:flex;
}
.nav-item{
  flex:1;display:flex;align-items:center;justify-content:center;gap:5px;
  border:none;background:none;cursor:pointer;
  color:var(--text2);
  font-family:'Space Grotesk',sans-serif;
  font-size:12px;font-weight:600;
  position:relative;
  transition:color .2s,background .2s;
  padding:0 6px;
  letter-spacing:.02em;
  text-transform:uppercase;
}
.nav-item svg{width:16px;height:16px;flex-shrink:0;}
.nav-item.active{
  color:var(--accent);
  background:var(--accent-soft);
}
.nav-item.active::after{
  content:"";position:absolute;bottom:0;left:0;right:0;
  height:2px;background:var(--accent);
}

/* ── LAYOUT ── */
#login-screen{
  position:fixed;inset:0;z-index:999;
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);
}
#app-screen{
  position:fixed;
  top:calc(var(--topbar-h) + var(--nav-h));
  left:0;right:0;bottom:0;
  overflow:hidden;
}
.page{display:none;height:100%;flex-direction:column;overflow:hidden;}
.page.active{display:flex;}

/* ── LOGIN ── */
.login-card{
  background:var(--card);
  border:2px solid var(--border);
  border-radius:0;
  padding:44px 32px;
  width:100%;max-width:340px;
  text-align:center;
  box-shadow:var(--shadow-lg);
  animation:fadeUp .5s cubic-bezier(.22,1,.36,1) both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:translateY(0);}
}
.login-logo-wrap{
  display:flex;justify-content:center;
  margin-bottom:24px;
}
.login-logo-big{
  font-family:'Barlow Condensed',sans-serif;
  font-size:52px;font-weight:900;
  color:var(--accent);
  letter-spacing:-2px;
  line-height:.9;
  display:flex;align-items:center;gap:6px;
}
.login-logo-big .inf{font-size:60px;}
.login-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:20px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  margin-bottom:8px;
}
.login-sub{color:var(--text2);font-size:13px;margin-bottom:28px;line-height:1.6;}
.btn-google{
  width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
  background:var(--bg3);border:2px solid var(--border);
  color:var(--text);font-family:'Space Grotesk',sans-serif;
  font-size:14px;font-weight:600;
  padding:12px 20px;border-radius:0;cursor:pointer;
  transition:background .2s,border-color .2s,transform .1s;
  text-transform:uppercase;letter-spacing:.04em;
}
.btn-google:hover{background:var(--accent-soft);border-color:var(--accent);}
.btn-google:active{transform:scale(.97);}

/* ── PAGE HEADER ── */
.page-hdr{
  padding:14px 16px 10px;
  border-bottom:2px solid var(--border);
  background:var(--bg2);
  flex-shrink:0;
}
.page-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:30px;font-weight:900;
  color:var(--text);line-height:1;
  letter-spacing:-.5px;text-transform:uppercase;
}

/* ── CHAT ── */
#messages-box{
  flex:1;overflow-y:auto;
  padding:12px 12px 0;
  display:flex;flex-direction:column;gap:5px;
  scroll-behavior:smooth;
}
#messages-box::-webkit-scrollbar{width:3px;}
#messages-box::-webkit-scrollbar-thumb{background:var(--border);}

.msg-wrap{
  display:flex;
  animation:msgIn .22s cubic-bezier(.22,1,.36,1) both;
}
@keyframes msgIn{
  from{opacity:0;transform:translateY(8px);}
  to{opacity:1;transform:translateY(0);}
}
.msg-wrap.mine{justify-content:flex-end;}
.msg-wrap.theirs{justify-content:flex-start;}
.msg-inner{display:flex;align-items:flex-end;gap:7px;max-width:min(76%,480px);}
.msg-av-wrap{flex-shrink:0;}

/* Avatar — kotak */
.msg-avatar,.msg-avatar-ph{
  width:28px;height:28px;
  border-radius:0;
  object-fit:cover;flex-shrink:0;
}
.msg-avatar-ph{
  background:var(--accent);color:var(--bubble-mine-t);
  font-size:11px;font-weight:700;font-family:'Barlow Condensed',sans-serif;
  display:flex;align-items:center;justify-content:center;
}

.msg-col{display:flex;flex-direction:column;gap:2px;min-width:0;}
.msg-col.align-end{align-items:flex-end;}
.msg-meta{display:flex;align-items:center;gap:5px;font-size:11px;margin-bottom:1px;}
.msg-uname{font-weight:700;color:var(--text2);font-family:'Space Grotesk',sans-serif;}

.badge-dev{
  display:inline-flex;align-items:center;
  background:var(--accent);color:var(--bubble-mine-t);
  font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:1px 5px;border-radius:0;
  font-family:'Barlow Condensed',sans-serif;
}

/* Bubble chat — KOTAK penuh */
.msg-bubble{
  padding:8px 12px;
  border-radius:0;
  font-size:13.5px;line-height:1.55;word-break:break-word;
  transition:opacity .15s;
}
.bubble-mine{
  background:var(--bubble-mine);
  color:var(--bubble-mine-t);
}
.bubble-theirs{
  background:var(--bubble-theirs);
  color:var(--bubble-theirs-t);
  border:1.5px solid var(--border);
  box-shadow:var(--shadow);
}
.msg-text{margin:0;}
.msg-img{
  max-width:190px;max-height:190px;
  border-radius:0;
  display:block;cursor:pointer;object-fit:cover;margin-bottom:4px;
}
.reply-strip{
  background:rgba(0,0,0,.12);
  border-left:3px solid rgba(255,255,255,.5);
  border-radius:0;padding:4px 8px;margin-bottom:6px;
  font-size:12px;opacity:.85;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.bubble-theirs .reply-strip{background:var(--bg3);border-left-color:var(--accent);}

.msg-acts{
  display:flex;align-items:center;gap:3px;
  opacity:0;transition:opacity .15s;
}
.msg-wrap:hover .msg-acts{opacity:1;}
.act-btn{
  display:flex;align-items:center;gap:3px;
  background:var(--bg3);border:1.5px solid var(--border);
  color:var(--text2);font-family:'Space Grotesk',sans-serif;font-size:10px;font-weight:600;
  padding:2px 6px;border-radius:0;cursor:pointer;
  transition:background .15s,color .15s;
  text-transform:uppercase;letter-spacing:.04em;
}
.act-btn:hover{background:var(--accent-soft);color:var(--accent);}
.act-del:hover{background:#fee2e2;color:#dc2626;border-color:#fca5a5;}
.msg-time{font-size:10px;color:var(--text3);white-space:nowrap;padding:0 2px;}

/* Reply bar */
#reply-bar{
  display:none;align-items:center;gap:8px;
  background:var(--accent-soft);
  border-top:2px solid var(--accent);
  padding:7px 14px;font-size:12px;flex-shrink:0;
}
#rb-name{font-weight:700;color:var(--accent);white-space:nowrap;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:.04em;}
#rb-text{color:var(--text2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rb-close{background:none;border:none;cursor:pointer;color:var(--text3);display:flex;}
.rb-close:hover{color:var(--text);}

/* File preview */
#fp{
  display:none;align-items:center;gap:10px;
  padding:8px 14px;background:var(--bg3);
  border-top:1.5px solid var(--border);flex-shrink:0;
}
#fp-img{width:40px;height:40px;border-radius:0;object-fit:cover;}
.fp-rm{background:none;border:none;cursor:pointer;color:var(--text3);}
.fp-rm:hover{color:var(--accent);}

/* Input area */
.chat-input-area{
  background:var(--bg2);border-top:2px solid var(--border);
  padding:8px 10px;display:flex;align-items:flex-end;gap:7px;
  flex-shrink:0;
}
#chat-input{
  flex:1;background:var(--bg3);border:1.5px solid var(--border);
  border-radius:0;padding:9px 13px;
  font-size:13.5px;font-family:'Space Grotesk',sans-serif;
  color:var(--text);resize:none;max-height:120px;min-height:36px;
  line-height:1.5;outline:none;
  transition:border-color .2s;overflow-y:auto;
}
#chat-input:focus{border-color:var(--accent);}
#chat-input::placeholder{color:var(--text3);}

/* Buttons — KOTAK */
.c-btn{
  width:36px;height:36px;border-radius:0;border:none;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;
  transition:transform .1s,background .15s;
}
.c-btn:active{transform:scale(.92);}
.c-btn-file{background:var(--bg3);color:var(--text2);border:1.5px solid var(--border);}
.c-btn-file:hover{background:var(--accent-soft);color:var(--accent);}
.c-btn-send{background:var(--accent);color:var(--bubble-mine-t);}
.c-btn-send:hover{background:var(--accent3);}

/* ── DOWNLOADER ── */
.page-body{flex:1;overflow-y:auto;padding:16px;}
.dl-tabs{
  display:flex;gap:0;
  border:2px solid var(--border);
  margin-bottom:14px;
  overflow:hidden;
}
.dl-tab{
  flex:1;padding:9px;border-radius:0;border:none;background:none;
  font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;color:var(--text2);
  transition:background .2s,color .2s;
  text-transform:uppercase;letter-spacing:.04em;
  border-right:2px solid var(--border);
}
.dl-tab:last-child{border-right:none;}
.dl-tab.active{background:var(--accent);color:var(--bubble-mine-t);}
.dl-row{display:flex;gap:0;margin-bottom:14px;border:2px solid var(--border);}
.dl-inp{
  flex:1;background:var(--card);border:none;
  padding:11px 14px;
  font-size:13px;font-family:'Space Grotesk',sans-serif;color:var(--text);outline:none;
}
.dl-inp::placeholder{color:var(--text3);}
.btn-dl{
  background:var(--accent);color:var(--bubble-mine-t);border:none;
  padding:0 18px;font-family:'Barlow Condensed',sans-serif;
  font-size:14px;font-weight:700;
  cursor:pointer;transition:background .2s,transform .1s;
  white-space:nowrap;border-left:2px solid var(--accent3);
  letter-spacing:.04em;text-transform:uppercase;
}
.btn-dl:hover{background:var(--accent3);}
.btn-dl:active{transform:scale(.97);}
.dl-card{
  background:var(--card);border:2px solid var(--border);
  padding:28px;text-align:center;margin-bottom:14px;
}
.dl-card svg{width:40px;height:40px;color:var(--text3);margin-bottom:10px;}
.dl-card-title{
  font-family:'Barlow Condensed',sans-serif;
  font-size:17px;font-weight:700;margin-bottom:5px;
  text-transform:uppercase;letter-spacing:.04em;
}
.dl-card-sub{font-size:13px;color:var(--text2);}
.dl-progress{display:none;background:var(--bg3);height:4px;margin-top:14px;overflow:hidden;}
.dl-progress-bar{height:100%;background:var(--accent);animation:prog 2s ease-in-out infinite alternate;}
@keyframes prog{from{width:15%}to{width:88%}}
.dl-progress.show{display:block;}
.note-box{
  background:var(--accent-soft);border:2px solid var(--accent);
  padding:13px 15px;
}
.note-box-label{
  font-size:10px;font-weight:700;color:var(--accent);
  font-family:'Barlow Condensed',sans-serif;letter-spacing:.1em;
  text-transform:uppercase;margin-bottom:4px;
}
.note-box-text{font-size:13px;color:var(--text2);line-height:1.6;}

/* ── PROFILE ── */
.profile-body{flex:1;overflow-y:auto;padding:18px 16px;}
.profile-top{
  display:flex;flex-direction:column;align-items:center;gap:10px;
  margin-bottom:20px;padding-bottom:18px;
  border-bottom:2px solid var(--border);
}
.av-btn{position:relative;width:80px;height:80px;cursor:pointer;}
#p-av-img{width:80px;height:80px;border-radius:0;object-fit:cover;border:3px solid var(--accent);}
#p-av-ph{
  width:80px;height:80px;border-radius:0;border:3px solid var(--accent);
  background:var(--accent);color:var(--bubble-mine-t);
  font-size:30px;font-weight:900;font-family:'Barlow Condensed',sans-serif;
  display:flex;align-items:center;justify-content:center;
}
.av-overlay{
  position:absolute;inset:0;border-radius:0;
  background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .2s;
}
.av-btn:hover .av-overlay{opacity:1;}
.av-overlay svg{width:20px;height:20px;color:#fff;}
.profile-name-row{display:flex;align-items:center;gap:7px;}
.profile-dname{
  font-family:'Barlow Condensed',sans-serif;
  font-size:22px;font-weight:700;
  letter-spacing:.02em;text-transform:uppercase;
}
#p-dev-badge{
  display:none;align-items:center;
  background:var(--accent);color:var(--bubble-mine-t);
  font-size:9px;font-weight:700;letter-spacing:.1em;
  padding:2px 6px;border-radius:0;
  font-family:'Barlow Condensed',sans-serif;
}
#p-email{font-size:12px;color:var(--text2);}
.profile-card{
  background:var(--card);border:2px solid var(--border);
  padding:16px;margin-bottom:12px;
  display:flex;flex-direction:column;gap:13px;
}
.p-field{display:flex;flex-direction:column;gap:5px;}
.p-label{
  font-size:10px;font-weight:700;color:var(--text2);
  letter-spacing:.1em;text-transform:uppercase;
  font-family:'Barlow Condensed',sans-serif;
}
.p-input{
  background:var(--bg3);border:1.5px solid var(--border);
  border-radius:0;padding:10px 12px;
  font-size:13.5px;font-family:'Space Grotesk',sans-serif;color:var(--text);outline:none;
  transition:border-color .2s;
}
.p-input:focus{border-color:var(--accent);}
.btn-save{
  width:100%;background:var(--accent);color:var(--bubble-mine-t);border:none;
  border-radius:0;padding:13px;
  font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;
  cursor:pointer;transition:background .2s,transform .1s;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;
}
.btn-save:hover{background:var(--accent3);}
.btn-save:active{transform:scale(.98);}
.btn-logout{
  width:100%;background:none;color:var(--text2);
  border:2px solid var(--border);border-radius:0;
  padding:12px;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
  transition:background .2s,color .2s,border-color .2s;
  text-transform:uppercase;letter-spacing:.04em;
}
.btn-logout:hover{background:#fee2e2;color:#dc2626;border-color:#dc2626;}

/* Image overlay */
#img-ov{
  display:none;position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,.9);align-items:center;justify-content:center;cursor:zoom-out;
}
#img-ov-img{max-width:92vw;max-height:90vh;border-radius:0;}

/* Smooth page transitions */
.page{
  opacity:0;
  transition:opacity .22s ease;
}
.page.active{
  opacity:1;
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <!-- Logo: simbol infinity ∞ tebal seperti di foto -->
  <div class="logo-mark">
    <span class="logo-infinity">&#x221E;</span>
  </div>

  <label class="theme-toggle" title="Ganti tema">
    <input type="checkbox" id="theme-switch" onchange="toggleTheme(this)">
    <div class="t-track">
      <div class="t-knob"></div>
      <!-- moon icon -->
      <svg class="t-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </div>
  </label>
</div>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-logo-big">
        <span class="inf">&#x221E;</span>
      </div>
    </div>
    <div class="login-title">Selamat Datang</div>
    <div class="login-sub">Masuk untuk bergabung. Hanya login Google yang tersedia.</div>
    <button class="btn-google" onclick="loginWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Masuk dengan Google
    </button>
  </div>
</div>

<!-- APP -->
<nav class="navbar">
  <button class="nav-item active" data-page="chat" onclick="switchPage('chat')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Chat
  </button>
  <button class="nav-item" data-page="downloader" onclick="switchPage('downloader')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg>
    Downloader
  </button>
  <button class="nav-item" data-page="profile" onclick="switchPage('profile')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><rect x="9" y="3" width="6" height="8" rx="0"/></svg>
    Profil
  </button>
</nav>

<div id="app-screen">

  <!-- CHAT -->
  <div class="page active" id="page-chat">
    <div class="page-hdr">
      <div class="page-title">Chat</div>
    </div>
    <div id="messages-box"></div>
    <div id="reply-bar">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg>
      <span id="rb-name"></span>
      <span id="rb-text"></span>
      <button class="rb-close" onclick="clearReply()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="fp">
      <img id="fp-img" src="" alt="">
      <span style="font-size:13px;color:var(--text2);flex:1;">Siap dikirim</span>
      <button class="fp-rm" onclick="removeFile()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="chat-input-area">
      <input type="file" id="chat-file" accept="image/*" style="display:none" onchange="handleFileSelect()">
      <button class="c-btn c-btn-file" onclick="document.getElementById('chat-file').click()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="0"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <textarea id="chat-input" placeholder="Tulis pesan..." rows="1"></textarea>
      <button class="c-btn c-btn-send" onclick="sendMessage()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- DOWNLOADER -->
  <div class="page" id="page-downloader">
    <div class="page-hdr">
      <div class="page-title">Downloader</div>
    </div>
    <div class="page-body">
      <div class="dl-tabs">
        <button class="dl-tab active" id="tab-tiktok" onclick="switchDlTab('tiktok')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-2.88 2.5 2.89 2.89 0 0 1-2.89-2.89 2.89 2.89 0 0 1 2.89-2.89c.28 0 .54.04.79.1V9.01a6.27 6.27 0 0 0-.79-.05 6.34 6.34 0 0 0-6.34 6.34 6.34 6.34 0 0 0 6.34 6.34 6.34 6.34 0 0 0 6.33-6.34V8.69a8.18 8.18 0 0 0 4.78 1.52V6.76a4.85 4.85 0 0 1-1.01-.07z"/></svg>
          TikTok
        </button>
        <button class="dl-tab" id="tab-youtube" onclick="switchDlTab('youtube')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="display:inline;vertical-align:middle;margin-right:4px"><path d="M23.5 6.19a3.02 3.02 0 0 0-2.12-2.14C19.54 3.5 12 3.5 12 3.5s-7.54 0-9.38.55A3.02 3.02 0 0 0 .5 6.19C0 8.04 0 12 0 12s0 3.96.5 5.81a3.02 3.02 0 0 0 2.12 2.14C4.46 20.5 12 20.5 12 20.5s7.54 0 9.38-.55a3.02 3.02 0 0 0 2.12-2.14C24 15.96 24 12 24 12s0-3.96-.5-5.81zM9.75 15.52V8.48L15.5 12l-5.75 3.52z"/></svg>
          YouTube
        </button>
      </div>
      <div class="dl-row">
        <input class="dl-inp" id="dl-url" type="url" placeholder="Tempel link video di sini...">
        <button class="btn-dl" onclick="startFakeDownload()">Unduh</button>
      </div>
      <div class="dl-card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <div class="dl-card-title" id="dl-title">Belum ada video</div>
        <div class="dl-card-sub" id="dl-sub">Masukkan link video untuk mulai</div>
        <div class="dl-progress" id="dl-prog"><div class="dl-progress-bar"></div></div>
      </div>
      <div class="note-box">
        <div class="note-box-label">Catatan</div>
        <div class="note-box-text">Fitur downloader sedang dalam pengembangan aktif. Fungsionalitas penuh akan segera hadir.</div>
      </div>
    </div>
  </div>

  <!-- PROFILE -->
  <div class="page" id="page-profile">
    <div class="page-hdr">
      <div class="page-title">Profil</div>
    </div>
    <div class="profile-body">
      <div class="profile-top">
        <div class="av-btn" onclick="triggerPhoto()">
          <img id="p-av-img" src="" alt="" style="display:none">
          <div id="p-av-ph">?</div>
          <div class="av-overlay">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><rect x="3" y="3" width="18" height="18" rx="0"/><circle cx="12" cy="13" r="4"/><path d="M9 3h6l2 3H7z"/></svg>
          </div>
        </div>

          <span id="p-dev-badge">DEV</span>
        </div>
        <span id="p-email"></span>
      </div>

        <div class="p-field">

        </div>
      </div>
      <button class="btn-save" onclick="saveProfile()">Simpan Perubahan</button>
      <button class="btn-logout" onclick="logout()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Keluar dari Akun
      </button>
    </div>
  </div>

</div>

<!-- IMG OVERLAY -->
<div id="img-ov" onclick="closeImg()">
  <img id="img-ov-img" src="" alt="">
</div>

<script>
function toggleTheme(cb){
  const isDark = cb.checked;
  document.documentElement.setAttribute("data-theme", isDark?"dark":"light");
  localStorage.setItem("theme", isDark?"dark":"light");
}
(function(){
  const s = localStorage.getItem("theme")||"light";
  document.documentElement.setAttribute("data-theme",s);
  const sw = document.getElementById("theme-switch");
  if(sw) sw.checked = s==="dark";
})();

let dlTab="tiktok";
function switchDlTab(t){
  dlTab=t;
  document.querySelectorAll(".dl-tab").forEach(b=>b.classList.remove("active"));
  document.getElementById("tab-"+t).classList.add("active");
  document.getElementById("dl-url").placeholder = t==="tiktok"?"Tempel link TikTok di sini...":"Tempel link YouTube di sini...";
  document.getElementById("dl-title").textContent="Belum ada video";
  document.getElementById("dl-sub").textContent="Masukkan link video untuk mulai";
  document.getElementById("dl-prog").classList.remove("show");
}
function startFakeDownload(){
  const url=document.getElementById("dl-url").value.trim();
  if(!url){alert("Masukkan link video terlebih dahulu.");return;}
  document.getElementById("dl-title").textContent="Memproses video...";
  document.getElementById("dl-sub").textContent="Harap tunggu sebentar.";
  document.getElementById("dl-prog").classList.add("show");
  setTimeout(()=>{
    document.getElementById("dl-title").textContent="Fitur Segera Hadir";
    document.getElementById("dl-sub").textContent="Downloader sedang dalam pengembangan. Nantikan pembaruan.";
    document.getElementById("dl-prog").classList.remove("show");
  },2600);
}
</script>
</body>
</html>
