<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTik`D - TikTok Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #0f0f0f;
            --container-bg: rgba(30, 30, 30, 0.8);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.05);
        }

        body.light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e0e0e0;
            --bg-tertiary: #efefef;
            --container-bg: rgba(255, 255, 255, 0.95);
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.1);
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .settings-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(0, 123, 255, 0.2);
        }

        .settings-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s ease-out;
            transition: all 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-tertiary);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 123, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .type-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .type-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .type-btn.active {
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            border-color: transparent;
            color: #fff;
            transform: scale(1.02);
        }

        .download-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #007bff 0%, #0056b3 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .result.show {
            display: block;
        }

        .result-title {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            fill: #28a745;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-link {
            padding: 12px 16px;
            background: rgba(0, 123, 255, 0.15);
            border: 1px solid rgba(0, 123, 255, 0.3);
            border-radius: 8px;
            color: #007bff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .download-link:hover {
            background: rgba(0, 123, 255, 0.25);
            border-color: rgba(0, 123, 255, 0.5);
            transform: translateX(5px);
        }

        .download-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .action-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .action-btn svg {
            width: 18px;
            height: 18px;
            fill: #fff;
        }

        .error {
            margin-top: 20px;
            padding: 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 12px;
            color: #fca5a5;
            font-size: 14px;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error.show {
            display: block;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Settings Modal */
        .settings-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-content {
            background: var(--container-bg);
            border-radius: 24px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border-color);
            animation: slideUp 0.3s ease-out;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .settings-header h2 {
            color: var(--text-primary);
            font-size: 24px;
            font-weight: 700;
        }

        .close-btn {
            width: 35px;
            height: 35px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
            transform: rotate(90deg);
        }

        .close-btn svg {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
        }

        .settings-section {
            margin-bottom: 25px;
            padding-bottom: 25px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-section:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .settings-section h3 {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .settings-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .settings-item label {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 0;
        }

        .settings-value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        .theme-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            transition: .3s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: #007bff;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider:before {
            transform: translateX(24px);
        }

        .social-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .social-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            background: rgba(0, 123, 255, 0.15);
            border-color: rgba(0, 123, 255, 0.3);
            transform: translateX(5px);
        }

        .social-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        .developer-info {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(0, 123, 255, 0.1) 0%, rgba(0, 86, 179, 0.1) 100%);
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .developer-name {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .developer-title {
            color: var(--text-secondary);
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 28px;
            }

            .type-selector {
                flex-direction: column;
            }

            .settings-btn {
                top: 15px;
                right: 15px;
                width: 45px;
                height: 45px;
            }

            .settings-content {
                padding: 25px 20px;
            }
        }
    </style>
</head>

    <script>
        let selectedType = 'video';
        let allImages = [];
        let currentVideoUrl = '';
        let currentAudioUrl = '';
        
        // Theme Toggle
        const themeToggle = document.getElementById('theme-toggle');
        const savedTheme = localStorage.getItem('theme') || 'dark';
        
        if (savedTheme === 'light') {
            document.body.classList.add('light-theme');
            themeToggle.checked = false;
        }

        themeToggle.addEventListener('change', function() {
            if (this.checked) {
                document.body.classList.remove('light-theme');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.add('light-theme');
                localStorage.setItem('theme', 'light');
            }
        });

        // Settings Modal
        const settingsBtn = document.getElementById('settings-btn');
        const settingsModal = document.getElementById('settings-modal');
        const closeSettings = document.getElementById('close-settings');

        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('show');
        });

        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('show');
        });

        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('show');
            }
        });

        // Type selector
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedType = this.getAttribute('data-type');
            });
        });

        // Download button
        document.getElementById('download-btn').addEventListener('click', async function() {
            const url = document.getElementById('tiktok-url').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const downloadBtn = this;

            // Reset
            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            allImages = [];
            currentVideoUrl = '';
            currentAudioUrl = '';
            
            // Validation
            if (!url) {
                showError('Masukkan URL TikTok terlebih dahulu!');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showError('URL tidak valid! Pastikan ini adalah link TikTok.');
                return;
            }

            // Show loading
            loadingDiv.classList.add('show');
            downloadBtn.disabled = true;

            try {
                // Multiple API attempts
                let success = false;
                
                // API 1: TikWM API
                if (!success) {
                    try {
                        const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`);
                        const data = await response.json();
                        
                        if (data.code === 0 && data.data) {
                            displayResults(data.data, 'tikwm');
                            success = true;
                        }
                    } catch (e) {
                        console.log('TikWM API failed, trying next...');
                    }
                }

                // API 2: SnapTik Alternative
                if (!success) {
                    try {
                        const response = await fetch(`https://api.snaptik.site/abc?url=${encodeURIComponent(url)}`);
                        const data = await response.json();
                        
                        if (data.status === 'success') {
                            displayResults(data, 'snaptik');
                            success = true;
                        }
                    } catch (e) {
                        console.log('SnapTik API failed, trying next...');
                    }
                }

                // API 3: TikTokAPI Alternative
                if (!success) {
                    try {
                        const response = await fetch(`https://api.tiktokv.com/aweme/v1/feed/?aweme_id=${extractVideoId(url)}`);
                        const data = await response.json();
                        
                        if (data.aweme_list && data.aweme_list.length > 0) {
                            displayResults(data.aweme_list[0], 'tiktokapi');
                            success = true;
                        }
                    } catch (e) {
                        console.log('TikTokAPI failed, trying next...');
                    }
                }

                if (!success) {
                    showError('Gagal mengambil data. Coba lagi atau gunakan link lain. API mungkin sedang down.');
                }

            } catch (error) {
                showError('Terjadi kesalahan. Pastikan koneksi internet stabil dan coba lagi.');
                console.error(error);
            } finally {
                loadingDiv.classList.remove('show');
                downloadBtn.disabled = false;
            }
        });

        function displayResults(data, apiType) {
            const resultDiv = document.getElementById('result');
            const linksDiv = document.getElementById('download-links');
            linksDiv.innerHTML = '';

            if (apiType === 'tikwm') {
                if (selectedType === 'video') {
                    // HD Video
                    if (data.hdplay) {
                        addDownloadLink('Video HD (No Watermark)', data.hdplay);
                        currentVideoUrl = data.hdplay;
                    }
                    // SD Video
                    if (data.play) {
                        addDownloadLink('Video SD (No Watermark)', data.play);
                        if (!currentVideoUrl) currentVideoUrl = data.play;
                    }
                    // Original with watermark as backup
                    if (data.wmplay) {
                        addDownloadLink('Video Original (With Watermark)', data.wmplay);
                    }
                    
                    if (currentVideoUrl) {
                        addActionButton('video');
                    }
                } else if (selectedType === 'audio') {
                    if (data.music) {
                        addDownloadLink('Audio MP3', data.music);
                        currentAudioUrl = data.music;
                        addActionButton('audio');
                    }
                } else if (selectedType === 'slide') {
                    if (data.images && data.images.length > 0) {
                        allImages = data.images;
                        data.images.forEach((img, index) => {
                            addDownloadLink(`Foto ${index + 1}`, img);
                        });
                        addActionButton('slide');
                    } else {
                        showError('Video ini tidak memiliki foto/slide.');
                        return;
                    }
                }
            }

            resultDiv.classList.add('show');
        }

        function addDownloadLink(label, url) {
            const linksDiv = document.getElementById('download-links');
            const link = document.createElement('a');
            link.className = 'download-link';
            link.href = url;
            link.target = '_blank';
            link.download = '';
            link.innerHTML = `
                <span>${label}</span>
                <svg class="download-icon" viewBox="0 0 24 24">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
            `;
            linksDiv.appendChild(link);
        }

        function addActionButton(type) {
            const linksDiv = document.getElementById('download-links');
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            
            if (type === 'video') {
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    <span>Download Video</span>
                `;
                btn.onclick = () => downloadFile(currentVideoUrl, 'video-tiktok.mp4');
            } else if (type === 'audio') {
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    <span>Download Audio</span>
                `;
                btn.onclick = () => downloadFile(currentAudioUrl, 'audio-tiktok.mp3');
            } else if (type === 'slide') {
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                    </svg>
                    <span>Download Semua Foto</span>
                `;
                btn.onclick = downloadAllImages;
            }
            
            linksDiv.appendChild(btn);
        }

        async function downloadFile(url, filename) {
            const btn = event.target.closest('.action-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" style="animation: spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                    <path d="M12 2 A10 10 0 0 1 22 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Mendownload...</span>
            `;
            
            try {
                const response = await fetch(url);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(blobUrl);
                document.body.removeChild(a);
                
                btn.innerHTML = `
                    <svg class="check-icon" viewBox="0 0 24 24">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    <span>Selesai!</span>
                `;
                
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                }, 2000);
            } catch (error) {
                console.error('Error downloading file:', error);
                btn.innerHTML = originalContent;
                btn.disabled = false;
                showError('Gagal mendownload file. Coba lagi.');
            }
        }

        async function downloadAllImages() {
            if (allImages.length === 0) return;
            
            const btn = event.target.closest('.action-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" style="animation: spin 1s linear infinite;">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                    <path d="M12 2 A10 10 0 0 1 22 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Mendownload...</span>
            `;
            
            for (let i = 0; i < allImages.length; i++) {
                try {
                    const response = await fetch(allImages[i]);
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `foto-tiktok-${i + 1}.jpg`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                    
                    await new Promise(resolve => setTimeout(resolve, 500));
                } catch (error) {
                    console.error('Error downloading image:', error);
                }
            }
            
            btn.innerHTML = `
                <svg class="check-icon" viewBox="0 0 24 24">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                <span>Selesai Download!</span>
            `;
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        function extractVideoId(url) {
            const match = url.match(/\/video\/(\d+)/);
            return match ? match[1] : '';
        }

        // Enter key support
        document.getElementById('tiktok-url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('download-btn').click();
            }
        });
    </script>
</body>
</html>
