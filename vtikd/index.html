<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VTD - Virtual TikTok Downloader</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #0f0f0f;
            --container-bg: rgba(30, 30, 30, 0.8);
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.1);
            --text-primary: #fff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --text-tertiary: rgba(255, 255, 255, 0.4);
            --border-color: rgba(255, 255, 255, 0.05);
            --navbar-height: 70px;
        }

        body.light-theme {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e0e0e0;
            --bg-tertiary: #efefef;
            --container-bg: rgba(255, 255, 255, 0.95);
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.1);
            --text-primary: #1a1a1a;
            --text-secondary: rgba(0, 0, 0, 0.7);
            --text-tertiary: rgba(0, 0, 0, 0.5);
            --border-color: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            overflow-x: hidden;
        }

        /* UI Old Style */
        body.ui-old {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 50%, var(--bg-tertiary) 100%);
        }

        body.ui-old .main-content {
            align-items: center;
            padding-bottom: 20px;
        }

        body.ui-old .bottom-nav {
            display: none;
        }

        body.ui-old #video-page {
            display: block !important;
        }

        body.ui-old #audio-page,
        body.ui-old #photo-page,
        body.ui-old #history-page {
            display: none !important;
        }

        body.ui-old .type-selector {
            display: flex !important;
        }

        .settings-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .settings-btn:hover {
            transform: rotate(90deg) scale(1.1);
            background: rgba(0, 123, 255, 0.2);
        }

        .settings-btn svg {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px;
            padding-bottom: calc(var(--navbar-height) + 20px);
            padding-top: 80px;
        }

        .container {
            background: var(--container-bg);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 30px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            animation: slideUp 0.5s ease-out;
            transition: all 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            color: var(--text-primary);
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 25px;
            font-size: 13px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: var(--text-primary);
            margin-bottom: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-tertiary);
        }

        input[type="text"]:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(0, 123, 255, 0.8);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        .type-selector {
            display: none;
            gap: 10px;
            margin-bottom: 20px;
        }

        body.ui-old .type-selector {
            display: flex;
        }

        .type-btn {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .type-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .type-btn.active {
            background: #007bff;
            border-color: transparent;
            color: #fff;
            transform: scale(1.02);
        }

        .download-btn {
            width: 100%;
            padding: 14px;
            background: #007bff;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 12px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .result.show {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .video-thumbnail {
            width: 100%;
            border-radius: 10px;
            margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .video-title {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .caption-container {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 15px;
            position: relative;
        }

        .caption-text {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .copy-caption-btn {
            background: #28a745;
            border: none;
            border-radius: 8px;
            color: #fff;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.3s ease;
        }

        .copy-caption-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }

        .copy-caption-btn svg {
            width: 14px;
            height: 14px;
        }

        .video-details {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
        }

        .video-detail-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .video-detail-item svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        .download-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .download-link {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.2);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .download-link:hover {
            background: rgba(0, 123, 255, 0.2);
            transform: translateX(5px);
        }

        .download-quality {
            color: var(--text-primary);
            font-weight: 500;
            font-size: 14px;
        }

        .download-size {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 2px;
        }

        .download-icon {
            width: 24px;
            height: 24px;
            fill: var(--text-primary);
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background: #28a745;
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(40, 167, 69, 0.4);
        }

        .action-btn svg {
            width: 20px;
            height: 20px;
        }

        .error {
            display: none;
            padding: 14px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.3);
            border-radius: 10px;
            color: #dc3545;
            margin-top: 15px;
            animation: shake 0.5s ease;
        }

        .error.show {
            display: block;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            margin-top: 20px;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid var(--input-border);
            border-top: 3px solid #007bff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--navbar-height);
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 999;
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.2);
        }

        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            position: relative;
        }

        .nav-item.active {
            color: #007bff;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 3px;
            background: #007bff;
            border-radius: 0 0 3px 3px;
        }

        .nav-item svg {
            width: 24px;
            height: 24px;
            transition: all 0.3s ease;
        }

        .nav-item.active svg {
            transform: scale(1.1);
        }

        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--container-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            z-index: 10000;
            min-width: 300px;
            max-width: 90%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast.show {
            top: 20px;
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toast-icon {
            width: 24px;
            height: 24px;
            flex-shrink: 0;
        }

        .toast-icon.success {
            fill: #28a745;
        }

        .toast-icon.error {
            fill: #dc3545;
        }

        .toast-icon.info {
            fill: #007bff;
        }

        .toast-message {
            flex: 1;
        }

        .toast-title {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .toast-text {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .toast-progress {
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .toast-progress-bar {
            height: 100%;
            background: #007bff;
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 3px;
        }

        /* Modal/Pop-up */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            animation: scaleIn 0.3s ease;
        }

        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .modal-icon {
            width: 50px;
            height: 50px;
            background: #007bff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-icon svg {
            width: 26px;
            height: 26px;
            fill: #fff;
        }

        .modal-title {
            color: var(--text-primary);
            font-size: 18px;
            font-weight: 600;
        }

        .modal-message {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn-cancel {
            background: var(--input-bg);
            color: var(--text-primary);
            border: 1px solid var(--input-border);
        }

        .modal-btn-cancel:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .modal-btn-confirm {
            background: #007bff;
            color: #fff;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        /* Settings Modal */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .settings-modal.show {
            display: flex;
        }

        .settings-content {
            background: var(--container-bg);
            border-radius: 20px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .settings-title {
            color: var(--text-primary);
            font-size: 20px;
            font-weight: 600;
        }

        .close-settings {
            width: 30px;
            height: 30px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-settings:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        .close-settings svg {
            width: 16px;
            height: 16px;
            fill: var(--text-primary);
        }

        .settings-option {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-option:last-child {
            border-bottom: none;
        }

        .option-label {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
        }

        .option-description {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 4px;
        }

        .toggle-switch {
            position: relative;
            width: 50px;
            height: 26px;
            background: var(--input-bg);
            border-radius: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid var(--input-border);
        }

        .toggle-switch.active {
            background: #007bff;
        }

        .toggle-slider {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .toggle-switch.active .toggle-slider {
            transform: translateX(24px);
        }

        .settings-info {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .info-label {
            color: var(--text-secondary);
            font-size: 13px;
        }

        .info-value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }

        /* History Page */
        .history-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .history-item {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .history-thumbnail {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .history-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .history-title {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .history-meta {
            color: var(--text-secondary);
            font-size: 12px;
        }

        .history-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .history-btn {
            padding: 6px 12px;
            background: rgba(0, 123, 255, 0.1);
            border: 1px solid rgba(0, 123, 255, 0.2);
            border-radius: 6px;
            color: #007bff;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .history-btn:hover {
            background: rgba(0, 123, 255, 0.2);
        }

        .history-btn.delete {
            background: rgba(220, 53, 69, 0.1);
            border-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }

        .history-btn.delete:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        .empty-history {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-history svg {
            width: 80px;
            height: 80px;
            opacity: 0.3;
            margin-bottom: 15px;
        }

        .empty-history h3 {
            color: var(--text-primary);
            font-size: 18px;
            margin-bottom: 8px;
        }

        .empty-history p {
            font-size: 14px;
        }

        .clear-history-btn {
            width: 100%;
            padding: 12px;
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid rgba(220, 53, 69, 0.2);
            border-radius: 10px;
            color: #dc3545;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .clear-history-btn:hover {
            background: rgba(220, 53, 69, 0.2);
        }

        /* Page Content */
        .page-content {
            display: none;
        }

        .page-content.active {
            display: block;
        }

        /* Responsive */

    <script>
        let currentPage = 'video';
        let selectedType = 'video';
        let currentMediaData = null;
        let pendingDownload = null;
        let downloadHistory = JSON.parse(localStorage.getItem('downloadHistory') || '[]');

        // Switch Page Function
        function switchPage(page) {
            // Don't switch pages in old UI mode
            const uiVersion = localStorage.getItem('uiVersion');
            if (uiVersion === 'old') {
                return;
            }
            
            currentPage = page;
            
            // Update nav items
            document.querySelectorAll('.nav-item').forEach(item => {
                item.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            
            // Update page content
            document.querySelectorAll('.page-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${page}-page`).classList.add('active');

            // Load history if on history page
            if (page === 'history') {
                loadHistory();
            }
        }

        // Settings Functions
        function openSettings() {
            document.getElementById('settings-modal').classList.add('show');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.remove('show');
        }

        function toggleTheme() {
            const toggle = document.getElementById('theme-toggle');
            toggle.classList.toggle('active');
            document.body.classList.toggle('light-theme');
            
            // Save preference
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
        }

        function toggleUI() {
            const toggle = document.getElementById('ui-toggle');
            toggle.classList.toggle('active');
            document.body.classList.toggle('ui-old');
            
            // Save preference
            const isOld = document.body.classList.contains('ui-old');
            localStorage.setItem('uiVersion', isOld ? 'old' : 'new');
            
            // Reset to video page when switching UI
            if (isOld) {
                // Hide all pages first
                document.querySelectorAll('.page-content').forEach(content => {
                    content.classList.remove('active');
                });
                // Only show video page in old UI
                document.getElementById('video-page').classList.add('active');
                currentPage = 'video';
            } else {
                // In new UI, show the current page
                document.querySelectorAll('.page-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById(`${currentPage}-page`).classList.add('active');
                
                // Update nav
                document.querySelectorAll('.nav-item').forEach(item => {
                    item.classList.remove('active');
                });
                const navItems = document.querySelectorAll('.nav-item');
                const pageIndex = ['video', 'audio', 'photo', 'history'].indexOf(currentPage);
                if (pageIndex >= 0 && navItems[pageIndex]) {
                    navItems[pageIndex].classList.add('active');
                }
            }
        }

        // Load saved preferences
        window.addEventListener('load', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.getElementById('theme-toggle').classList.add('active');
            } else {
                document.getElementById('theme-toggle').classList.add('active');
            }
            
            const uiVersion = localStorage.getItem('uiVersion');
            if (uiVersion === 'old') {
                document.body.classList.add('ui-old');
                document.getElementById('ui-toggle').classList.add('active');
                
                // Make sure only video page is shown in old UI
                document.querySelectorAll('.page-content').forEach(content => {
                    content.classList.remove('active');
                });
                document.getElementById('video-page').classList.add('active');
                currentPage = 'video';
            }
        });

        // Toast Notification Function
        function showToast(title, message, type = 'info', showProgress = false, duration = 3000) {
            const toast = document.getElementById('toast');
            const toastIcon = document.getElementById('toast-icon');
            const toastTitle = document.getElementById('toast-title');
            const toastText = document.getElementById('toast-text');
            const toastProgress = document.getElementById('toast-progress');
            const toastProgressBar = document.getElementById('toast-progress-bar');

            toastTitle.textContent = title;
            toastText.textContent = message;
            
            // Set icon based on type
            toastIcon.className = `toast-icon ${type}`;
            if (type === 'success') {
                toastIcon.innerHTML = '<path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>';
            } else if (type === 'error') {
                toastIcon.innerHTML = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>';
            } else {
                toastIcon.innerHTML = '<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>';
            }

            if (showProgress) {
                toastProgress.style.display = 'block';
                toastProgressBar.style.width = '0%';
            } else {
                toastProgress.style.display = 'none';
            }

            toast.classList.add('show');

            if (showProgress) {
                let progress = 0;
                const interval = setInterval(() => {
                    progress += 10;
                    toastProgressBar.style.width = progress + '%';
                    if (progress >= 100) {
                        clearInterval(interval);
                    }
                }, duration / 10);
            }

            setTimeout(() => {
                toast.classList.remove('show');
            }, duration);
        }

        // Modal Functions
        function showDownloadModal(message, url, filename, thumbnail, title, type) {
            document.getElementById('modal-message').textContent = message;
            document.getElementById('download-modal').classList.add('show');
            pendingDownload = { url, filename, thumbnail, title, type };
        }

        function closeModal() {
            document.getElementById('download-modal').classList.remove('show');
            pendingDownload = null;
        }

        async function confirmDownload() {
            if (pendingDownload) {
                closeModal();
                
                // Show toast notification
                showToast('Download Dimulai', 'Mohon tunggu, file sedang diunduh...', 'info', true, 5000);
                
                // Execute download
                const success = await executeDownload(pendingDownload.url, pendingDownload.filename);
                
                if (success) {
                    // Add to history
                    addToHistory({
                        url: pendingDownload.url,
                        filename: pendingDownload.filename,
                        thumbnail: pendingDownload.thumbnail,
                        title: pendingDownload.title,
                        type: pendingDownload.type,
                        date: new Date().toISOString()
                    });
                    
                    // Show success
                    showToast('Download Berhasil', 'File berhasil diunduh! Cek folder Download Anda.', 'success', false, 3000);
                } else {
                    showToast('Perhatian', 'File terbuka di tab baru. Klik kanan → Save As untuk menyimpan.', 'info', false, 5000);
                }
                
                pendingDownload = null;
            }
        }

        async function executeDownload(url, filename) {
            try {
                // Method 1: Gunakan CORS proxy untuk bypass restriction
                const corsProxies = [
                    '',  // Try direct first
                    'https://corsproxy.io/?',
                    'https://api.allorigins.win/raw?url='
                ];
                
                let success = false;
                
                for (let proxy of corsProxies) {
                    try {
                        const fetchUrl = proxy + encodeURIComponent(url);
                        const response = await fetch(proxy === '' ? url : fetchUrl);
                        
                        if (response.ok) {
                            const blob = await response.blob();
                            
                            // Tentukan extension berdasarkan content type atau filename
                            let extension = '';
                            const contentType = response.headers.get('content-type');
                            
                            if (contentType) {
                                if (contentType.includes('video')) extension = '.mp4';
                                else if (contentType.includes('audio')) extension = '.mp3';
                                else if (contentType.includes('image')) extension = '.jpg';
                            }
                            
                            // Pastikan filename punya extension
                            if (!filename.includes('.')) {
                                filename += extension;
                            }
                            
                            // Create blob URL and download
                            const blobUrl = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = blobUrl;
                            a.download = filename;
                            a.style.display = 'none';
                            
                            document.body.appendChild(a);
                            a.click();
                            
                            setTimeout(() => {
                                document.body.removeChild(a);
                                URL.revokeObjectURL(blobUrl);
                            }, 500);
                            
                            success = true;
                            break;
                        }
                    } catch (e) {
                        console.log('Proxy failed:', proxy, e);
                        continue;
                    }
                }
                
                // If all proxies failed, try iframe method
                if (!success) {
                    // Method 2: Gunakan iframe untuk download
                    const iframe = document.createElement('iframe');
                    iframe.style.display = 'none';
                    iframe.src = url;
                    document.body.appendChild(iframe);
                    
                    setTimeout(() => {
                        document.body.removeChild(iframe);
                    }, 3000);
                    
                    success = true;
                }
                
                return success;
            } catch (error) {
                console.error('All download methods failed:', error);
                
                // Final fallback: open in new window
                const win = window.open(url, '_blank');
                if (win) {
                    win.focus();
                }
                
                return false;
            }
        }

        // History Functions
        function addToHistory(item) {
            // Check if already exists
            const exists = downloadHistory.some(h => h.url === item.url && h.filename === item.filename);
            if (!exists) {
                downloadHistory.unshift(item);
                // Keep only last 50 items
                if (downloadHistory.length > 50) {
                    downloadHistory = downloadHistory.slice(0, 50);
                }
                localStorage.setItem('downloadHistory', JSON.stringify(downloadHistory));
            }
        }

        function loadHistory() {
            const container = document.getElementById('history-container');
            downloadHistory = JSON.parse(localStorage.getItem('downloadHistory') || '[]');
            
            if (downloadHistory.length === 0) {
                container.innerHTML = `
                    <div class="empty-history">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/>
                        </svg>
                        <h3>Belum Ada Riwayat</h3>
                        <p>Download video, audio, atau foto untuk melihat riwayat</p>
                    </div>
                `;
                return;
            }

            let html = '';
            downloadHistory.forEach((item, index) => {
                const date = new Date(item.date);
                const dateStr = date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                const timeStr = date.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
                
                html += `
                    <div class="history-item">
                        <img src="${item.thumbnail || 'https://via.placeholder.com/80x80?text=TT'}" alt="${item.title}" class="history-thumbnail">
                        <div class="history-info">
                            <div class="history-title">${item.title || item.filename}</div>
                            <div class="history-meta">${item.type} • ${dateStr} ${timeStr}</div>
                            <div class="history-actions">
                                <button class="history-btn" onclick="redownload(${index})">Download Lagi</button>
                                <button class="history-btn delete" onclick="deleteHistory(${index})">Hapus</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            html += '<button class="clear-history-btn" onclick="clearAllHistory()">Hapus Semua Riwayat</button>';
            container.innerHTML = html;
        }

        async function redownload(index) {
            const item = downloadHistory[index];
            showToast('Memulai Download', 'Mohon tunggu, file sedang diunduh...', 'info', true, 5000);
            
            const success = await executeDownload(item.url, item.filename);
            
            if (success) {
                showToast('Download Berhasil', 'File berhasil diunduh! Cek folder Download Anda.', 'success', false, 3000);
            } else {
                showToast('Perhatian', 'File terbuka di tab baru. Klik kanan → Save As untuk menyimpan.', 'info', false, 5000);
            }
        }

        function deleteHistory(index) {
            if (confirm('Hapus item ini dari riwayat?')) {
                downloadHistory.splice(index, 1);
                localStorage.setItem('downloadHistory', JSON.stringify(downloadHistory));
                loadHistory();
                showToast('Dihapus', 'Item berhasil dihapus dari riwayat', 'success');
            }
        }

        function clearAllHistory() {
            if (confirm('Hapus semua riwayat download?')) {
                downloadHistory = [];
                localStorage.setItem('downloadHistory', JSON.stringify(downloadHistory));
                loadHistory();
                showToast('Dihapus', 'Semua riwayat berhasil dihapus', 'success');
            }
        }

        // Copy Caption Function (Fixed)
        function copyCaption(text) {
            // Hapus hashtag dari text
            const textWithoutHashtags = text.replace(/#\S+/g, '').replace(/\s+/g, ' ').trim();
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textWithoutHashtags).then(() => {
                    updateCopyButton();
                    showToast('Tersalin', 'Caption berhasil disalin (tanpa hashtag)', 'success');
                }).catch(err => {
                    console.error('Copy failed:', err);
                    fallbackCopy(textWithoutHashtags);
                });
            } else {
                fallbackCopy(textWithoutHashtags);
            }
        }

        function updateCopyButton() {
            const btn = event.target.closest('.copy-caption-btn');
            if (btn) {
                const originalContent = btn.innerHTML;
                btn.innerHTML = `
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                    <span>Tersalin!</span>
                `;
                setTimeout(() => {
                    btn.innerHTML = originalContent;
                }, 2000);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-999999px';
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                updateCopyButton();
                showToast('Tersalin', 'Caption berhasil disalin (tanpa hashtag)', 'success');
            } catch (err) {
                console.error('Fallback copy failed:', err);
                showToast('Gagal', 'Tidak bisa menyalin caption', 'error');
            }
            document.body.removeChild(textArea);
        }

        // Type selector for old UI
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedType = this.getAttribute('data-type');
                
                // Clear results when changing type in old UI
                const uiVersion = localStorage.getItem('uiVersion');
                if (uiVersion === 'old') {
                    document.getElementById('result').classList.remove('show');
                    document.getElementById('error').classList.remove('show');
                }
            });
        });

        // Download Video
        document.getElementById('download-btn').addEventListener('click', async function() {
            const url = document.getElementById('tt-url').value.trim();
            const errorDiv = document.getElementById('error');
            const resultDiv = document.getElementById('result');
            const loadingDiv = document.getElementById('loading');
            const downloadBtn = this;

            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            currentMediaData = null;
            
            if (!url) {
                showError('Masukkan link TikTok!', 'error');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showError('Link tidak valid!', 'error');
                return;
            }

            loadingDiv.classList.add('show');
            downloadBtn.disabled = true;

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    currentMediaData = data.data;
                    const uiVersion = localStorage.getItem('uiVersion');
                    
                    // Check if in old UI and slide type is selected but no images
                    if (uiVersion === 'old' && selectedType === 'slide') {
                        if (!data.data.images || data.data.images.length === 0) {
                            showError('Video ini tidak memiliki foto/slideshow!', 'error');
                            loadingDiv.classList.remove('show');
                            downloadBtn.disabled = false;
                            return;
                        }
                    }
                    
                    displayResults(data.data, uiVersion === 'old' ? selectedType : 'video');
                } else {
                    showError('Gagal memproses video!', 'error');
                }
            } catch (error) {
                showError('Terjadi kesalahan!', 'error');
                console.error(error);
            } finally {
                loadingDiv.classList.remove('show');
                downloadBtn.disabled = false;
            }
        });

        // Download Audio
        document.getElementById('download-btn-audio').addEventListener('click', async function() {
            const url = document.getElementById('tt-url-audio').value.trim();
            const errorDiv = document.getElementById('error-audio');
            const resultDiv = document.getElementById('result-audio');
            const loadingDiv = document.getElementById('loading-audio');
            const downloadBtn = this;

            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            
            if (!url) {
                showError('Masukkan link TikTok!', 'error-audio');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showError('Link tidak valid!', 'error-audio');
                return;
            }

            loadingDiv.classList.add('show');
            downloadBtn.disabled = true;

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    displayResults(data.data, 'audio');
                } else {
                    showError('Gagal memproses audio!', 'error-audio');
                }
            } catch (error) {
                showError('Terjadi kesalahan!', 'error-audio');
                console.error(error);
            } finally {
                loadingDiv.classList.remove('show');
                downloadBtn.disabled = false;
            }
        });

        // Download Photo
        document.getElementById('download-btn-photo').addEventListener('click', async function() {
            const url = document.getElementById('tt-url-photo').value.trim();
            const errorDiv = document.getElementById('error-photo');
            const resultDiv = document.getElementById('result-photo');
            const loadingDiv = document.getElementById('loading-photo');
            const downloadBtn = this;

            errorDiv.classList.remove('show');
            resultDiv.classList.remove('show');
            
            if (!url) {
                showError('Masukkan link TikTok!', 'error-photo');
                return;
            }

            if (!url.includes('tiktok.com')) {
                showError('Link tidak valid!', 'error-photo');
                return;
            }

            loadingDiv.classList.add('show');
            downloadBtn.disabled = true;

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(url)}`);
                const data = await response.json();
                
                if (data.code === 0 && data.data) {
                    if (data.data.images && data.data.images.length > 0) {
                        displayResults(data.data, 'photo');
                    } else {
                        showError('Video ini tidak memiliki foto/slideshow!', 'error-photo');
                    }
                } else {
                    showError('Gagal memproses foto!', 'error-photo');
                }
            } catch (error) {
                showError('Terjadi kesalahan!', 'error-photo');
                console.error(error);
            } finally {
                loadingDiv.classList.remove('show');
                downloadBtn.disabled = false;
            }
        });

        function displayResults(data, type) {
            // Di UI lama, semua tipe menggunakan element yang sama (tanpa suffix)
            const uiVersion = localStorage.getItem('uiVersion');
            const isOldUI = uiVersion === 'old';
            
            // Tentukan ID element berdasarkan UI mode
            let resultId, videoInfoId, linksId;
            
            if (isOldUI) {
                // UI lama: selalu gunakan element tanpa suffix
                resultId = 'result';
                videoInfoId = 'videoInfo';
                linksId = 'download-links';
            } else {
                // UI baru: gunakan suffix sesuai tipe
                resultId = type !== 'video' ? `result-${type}` : 'result';
                videoInfoId = type !== 'video' ? `videoInfo-${type}` : 'videoInfo';
                linksId = type !== 'video' ? `download-links-${type}` : 'download-links';
            }
            
            const resultDiv = document.getElementById(resultId);
            const videoInfo = document.getElementById(videoInfoId);
            const linksDiv = document.getElementById(linksId);
            
            if (!resultDiv || !videoInfo || !linksDiv) {
                console.error('Elements not found:', resultId, videoInfoId, linksId);
                return;
            }
            
            videoInfo.innerHTML = '';
            linksDiv.innerHTML = '';

            const thumbnailUrl = data.cover || data.origin_cover || 'https://via.placeholder.com/400x600?text=TikTok';
            const title = data.title || 'TikTok Video';
            const author = data.author ? data.author.nickname || data.author.unique_id : 'Unknown';
            const duration = data.duration ? formatDuration(data.duration) : 'N/A';
            const plays = data.play_count ? formatNumber(data.play_count) : 'N/A';

            // Escape single quotes in title for onclick
            const escapedTitle = title.replace(/'/g, "\\'").replace(/`/g, "\\`");

            videoInfo.innerHTML = `
                <img class="video-thumbnail" src="${thumbnailUrl}" alt="${title}">
                <div class="video-title">${title}</div>
                ${data.title ? `
                <div class="caption-container">
                    <div class="caption-text">${data.title}</div>
                    <button class="copy-caption-btn" onclick="copyCaption(\`${escapedTitle}\`)">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        <span>Salin Caption</span>
                    </button>
                </div>
                ` : ''}
                <div class="video-details">
                    <div class="video-detail-item">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                        </svg>
                        ${author}
                    </div>
                    <div class="video-detail-item">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/>
                        </svg>
                        ${duration}
                    </div>
                    <div class="video-detail-item">
                        <svg viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                        ${plays}
                    </div>
                </div>
            `;

            if (type === 'video') {
                if (data.hdplay) {
                    addDownloadLink('Video HD (No Watermark)', data.hdplay, 'HD', isOldUI ? 'video' : type, thumbnailUrl, title);
                }
                if (data.play) {
                    addDownloadLink('Video SD (No Watermark)', data.play, 'SD', isOldUI ? 'video' : type, thumbnailUrl, title);
                }
                if (data.wmplay) {
                    addDownloadLink('Video (With Watermark)', data.wmplay, 'WM', isOldUI ? 'video' : type, thumbnailUrl, title);
                }
            } else if (type === 'audio') {
                if (data.music) {
                    addDownloadLink('Audio MP3', data.music, 'MP3', isOldUI ? 'audio' : type, thumbnailUrl, title);
                }
            } else if (type === 'photo' || type === 'slide') {
                if (data.images && data.images.length > 0) {
                    data.images.forEach((img, index) => {
                        addDownloadLink(`Foto ${index + 1}`, img, 'IMG', isOldUI ? 'slide' : type, img, title);
                    });
                    addBatchDownloadButton(data.images, isOldUI ? 'slide' : type, title);
                } else {
                    // This shouldn't happen as we check before calling displayResults
                    showError('Tidak ada foto di video ini', type === 'slide' ? 'error' : 'error-photo');
                    return;
                }
            }

            resultDiv.classList.add('show');
        }

        function addDownloadLink(label, url, typeLabel, page, thumbnail, title) {
            // Cek apakah UI lama atau baru
            const uiVersion = localStorage.getItem('uiVersion');
            const isOldUI = uiVersion === 'old';
            
            // Fix selector untuk berbagai tipe halaman
            let selector = 'download-links';
            
            if (isOldUI) {
                // UI lama: selalu gunakan 'download-links'
                selector = 'download-links';
            } else {
                // UI baru: gunakan suffix sesuai tipe
                if (page === 'audio') {
                    selector = 'download-links-audio';
                } else if (page === 'photo') {
                    selector = 'download-links-photo';
                } else if (page === 'video' || page === 'slide') {
                    selector = 'download-links';
                }
            }
            
            const linksDiv = document.getElementById(selector);
            if (!linksDiv) {
                console.error('Download links container not found:', selector);
                return;
            }
            
            // Generate filename dengan extension yang sesuai
            let filename = 'tiktok-';
            let extension = '';
            
            if (page === 'video' || page === 'slide') {
                filename += 'video';
                extension = '.mp4';
            } else if (page === 'audio') {
                filename += 'audio';
                extension = '.mp3';
            } else if (page === 'photo') {
                filename += 'photo';
                extension = '.jpg';
            }
            
            // Tambahkan quality label jika ada
            if (typeLabel && typeLabel !== 'MP3' && typeLabel !== 'IMG') {
                filename += '-' + typeLabel.toLowerCase();
            }
            
            filename += extension;
            
            const link = document.createElement('div');
            link.className = 'download-link';
            link.onclick = async () => {
                let mediaType = 'file';
                if (page === 'video') mediaType = 'video';
                else if (page === 'audio') mediaType = 'audio';
                else if (page === 'photo' || page === 'slide') mediaType = 'foto';
                
                // Langsung download tanpa modal
                showToast('Download Dimulai', `Mengunduh ${mediaType}...`, 'info', true, 5000);
                
                const success = await executeDownload(url, filename);
                
                if (success) {
                    // Add to history
                    addToHistory({
                        url: url,
                        filename: filename,
                        thumbnail: thumbnail,
                        title: title,
                        type: mediaType.charAt(0).toUpperCase() + mediaType.slice(1),
                        date: new Date().toISOString()
                    });
                    
                    showToast('Download Berhasil', 'File berhasil diunduh! Cek folder Download Anda.', 'success', false, 3000);
                } else {
                    showToast('Perhatian', 'File terbuka di tab baru. Klik kanan → Save As untuk menyimpan.', 'info', false, 5000);
                }
            };
            link.innerHTML = `
                <span>
                    <div class="download-quality">${label}</div>
                    <div class="download-size">${typeLabel}</div>
                </span>
                <svg class="download-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
            `;
            linksDiv.appendChild(link);
        }

        function addBatchDownloadButton(images, type, title) {
            // Cek apakah UI lama atau baru
            const uiVersion = localStorage.getItem('uiVersion');
            const isOldUI = uiVersion === 'old';
            
            // Fix selector untuk berbagai tipe halaman
            let selector = 'download-links';
            
            if (isOldUI) {
                // UI lama: selalu gunakan 'download-links'
                selector = 'download-links';
            } else {
                // UI baru: gunakan suffix sesuai tipe
                if (type === 'photo') {
                    selector = 'download-links-photo';
                } else if (type === 'video' || type === 'slide') {
                    selector = 'download-links';
                }
            }
            
            const linksDiv = document.getElementById(selector);
            if (!linksDiv) {
                console.error('Download links container not found:', selector);
                return;
            }
            
            const btn = document.createElement('button');
            btn.className = 'action-btn';
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                </svg>
                <span>Download Semua (${images.length})</span>
            `;
            btn.onclick = () => downloadAllPhotos(images, title);
            linksDiv.appendChild(btn);
        }

        async function downloadAllPhotos(images, title) {
            const btn = event.target.closest('.action-btn');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `
                <svg viewBox="0 0 24 24" style="animation: spin 1s linear infinite;" fill="currentColor">
                    <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
                    <path d="M12 2 A10 10 0 0 1 22 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Mendownload...</span>
            `;

            showToast('Memulai Download', `Mendownload ${images.length} foto...`, 'info', true, images.length * 1500);

            // Download semua foto secara berurutan
            for (let i = 0; i < images.length; i++) {
                await executeDownload(images[i], `tiktok-photo-${i + 1}.jpg`);
                
                addToHistory({
                    url: images[i],
                    filename: `tiktok-photo-${i + 1}.jpg`,
                    thumbnail: images[i],
                    title: title,
                    type: 'Foto',
                    date: new Date().toISOString()
                });
                
                // Delay antar download
                await new Promise(resolve => setTimeout(resolve, 1000));
            }

            btn.innerHTML = `
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                </svg>
                <span>Selesai!</span>
            `;

            showToast('Download Selesai', `${images.length} foto berhasil diunduh! Cek folder Download Anda.`, 'success', false, 3000);

            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }, 2000);
        }

        function formatDuration(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'K';
            return num.toString();
        }

        function showError(message, elementId) {
            const errorDiv = document.getElementById(elementId);
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            
            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        // Enter key support
        document.getElementById('tt-url').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('download-btn').click();
            }
        });

        document.getElementById('tt-url-audio').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('download-btn-audio').click();
            }
        });

        document.getElementById('tt-url-photo').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('download-btn-photo').click();
            }
        });

        // Close modals when clicking outside
        document.getElementById('download-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.getElementById('settings-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeSettings();
            }
        });

        // Prevent zoom on double tap (iOS)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function(event) {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
    </script>
</body>
</html>
