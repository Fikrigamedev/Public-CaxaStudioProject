<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: Arial, Helvetica, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        h1 {
            margin-bottom: 20px;
            font-size: 28px;
            letter-spacing: 1px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
            color: #cccccc;
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            margin: 0 2px;
            background-color: #ffffff;
            border-radius: 50%;
            animation: blink 1.4s infinite both;
        }

        .dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            0%, 80%, 100% {
                opacity: 0;
            }
            40% {
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="box">
        <h1> Website Maintenance</h1>
        <p>
            Website sedang dalam perombakan besar-besaran.<br>
            Kemungkinan besar tidak memakan banyak waktu.<br>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
        </p>
    </div>

</body>
</html>
